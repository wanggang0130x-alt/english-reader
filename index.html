<style>

* { box-sizing:border-box }

}
[hidden] { display:none !important }
.site-header {

.card-speak,.card-close {

.card-close { background:var(--bg); color:var(--muted) }
.card-ipa { color:var(--muted); font-size:16px; margin-top:9px; white-space:pre-wrap }

"use strict";
const DATA = {"entries":[{"id":"2026-11-03","kind":"lesson","title":"第1课｜口语日常（11-03）","date":"2026-11-03","sort":"2026-11-03","html":"\u003ch1\u003e第1课｜口语日常（11-03）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e用礼貌的口语句型提出需求、请对方帮忙。（本课完整讲义未收录，以下依据课程索引整理。）\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003eI'd like to ... ／ Could you ...? （我想要……／你能……吗？）\u003c/p\u003e\n\u003ch2\u003e5个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"1\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eI'd like to\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我想要……\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e（回炉题）用 I'd like to… 口头说一个今天的需求。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"2\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eCould you...?\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e你能……吗？\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eCould you help sort out ______?（第2课回炉：请合作方理清下周付款安排）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003esort out\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e理清、处理好\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eCould you help sort out the payment schedule for next week?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eon my way\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e在路上\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e索引中未收录例句\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eno worries\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e没关系、不用担心\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e索引中未收录例句\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短对话\u003c/h2\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e索引中未收录本课对话；复习时重点记住两个开头：\u003cstrong\u003eI'd like to ...\u003c/strong\u003e 表达自己想做的事，\u003cstrong\u003eCould you ...?\u003c/strong\u003e 礼貌地请别人做事。\u003c/p\u003e","blocks":["I'd like to ... Could you ...? …… ……","I'd like to …… I'd like to…","Could you...? …… Could you help sort out ______? 2","sort out Could you help sort out the payment schedule for next week?","on my way","no worries","I'd like to ... Could you ...?"],"audio":["audio/9192cc36c526.mp3","audio/e0cb0b485d1c.mp3","audio/e52eabfeb724.mp3","audio/13a02ef666bd.mp3","audio/261ac9056281.mp3","audio/330034220301.mp3","audio/f1226c804ec4.mp3"]},{"id":"2026-11-04","kind":"lesson","title":"第2课｜商务英语：跟进邮件","date":"2026-11-04","sort":"2026-11-04","html":"\u003ch1\u003e第2课｜商务英语：跟进邮件\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 学会用一个句型，礼貌地催进度、跟进事情。\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm following up on + 事情.\u003c/strong\u003e （我想跟进一下……）\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eI'm following up on \u003cstrong\u003ethe draft agreement\u003c/strong\u003e.\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eI'm following up on \u003cstrong\u003eour call last week\u003c/strong\u003e.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5个商务词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003efollow up on\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e跟进\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI'm following up on the term sheet we sent.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ecircle back\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e回头再谈\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet's circle back after your board meeting.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eas discussed\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e如之前所谈\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eAs discussed, we'll review the project timeline.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eat your earliest convenience\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e您方便时尽快\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003ePlease send the update at your earliest convenience.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003elook forward to\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e期待\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI look forward to your reply.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短邮件示例（人名、公司、日期、数字均为举例）\u003c/h2\u003e\n\u003cblockquote data-block=\"8\" class=\"speak-block\"\u003e\u003cp\u003eDear Mr. Tan, I'm following up on our call on 3 November. As discussed, could you send the revised proposal at your earliest convenience? I look forward to your reply. Best regards, Gang\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003e中文：\u003c/strong\u003e 谭先生您好： 我想跟进一下我们11月3日的通话。如之前所谈，您方便时能否尽快发来修改后的方案？期待您的回复。 此致， Gang\u003c/p\u003e\n\u003ch2\u003e回炉（第1课）\u003c/h2\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e用 \u003cstrong\u003eCould you ...?\u003c/strong\u003e 或 \u003cstrong\u003esort out\u003c/strong\u003e 写一句话：请合作方理清下周付款安排。 提示：Could you help sort out ______?\u003c/p\u003e\n\u003ch2\u003e开口练习\u003c/h2\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e1. 替换练习：\u003c/strong\u003e 把画线部分换成别的事情，各说一句。 I'm following up on \u003cstrong\u003ethe draft agreement\u003c/strong\u003e. → the site visit / the payment schedule / the project update\u003c/p\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e2. 开放题：\u003c/strong\u003e 用 \u003cem\u003eI'm following up on ...\u003c/em\u003e 说一句你现在真实要跟进的事（投资、合作方或项目都可以）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e你回复后，我只纠正一两个最影响理解的地方，并给你更自然的说法。\u003c/strong\u003e\u003c/p\u003e","blocks":["I'm following up on + . ……","I'm following up on the draft agreement.","I'm following up on our call last week.","follow up on I'm following up on the term sheet we sent.","circle back Let's circle back after your board meeting.","as discussed As discussed, we'll review the project timeline.","at your earliest convenience Please send the update at your earliest convenience.","look forward to I look forward to your reply.","Dear Mr. Tan, I'm following up on our call on 3 November. As discussed, could you send the revised proposal at your earliest convenience? I look forward to your reply. Best regards, Gang","Could you ...? sort out Could you help sort out ______?","1. I'm following up on the draft agreement. → the site visit / the payment schedule / the project update","2. I'm following up on ..."],"audio":["audio/3ab3645c797b.mp3","audio/d96bcb43fdd4.mp3","audio/9d0b51b152b2.mp3","audio/c1dc64ee9856.mp3","audio/3be7c1afef11.mp3","audio/273bbd5f3b8e.mp3","audio/11ff459f1488.mp3","audio/97145435ac82.mp3","audio/267600ce5c65.mp3","audio/a17c84b42dc7.mp3","audio/4e28bcf7bde8.mp3","audio/9ed76eead51b.mp3"]},{"id":"2026-11-05","kind":"lesson","title":"第3课｜听读｜抓要点，再转述","date":"2026-11-05","sort":"2026-11-05","html":"\u003ch1\u003e第3课｜听读｜抓要点，再转述\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 听或读一段商业内容后，能用一句英文说出要点。\u003c/p\u003e\n\u003ch2\u003e1. 今天的句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eThe main point is that ...\u003c/strong\u003e（主要意思是……） 例：The main point is that demand is rising.\u003c/p\u003e\n\u003ch2\u003e2. 5 个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"1\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eaccording to the report\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e根据报告\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eAccording to the report, costs are going up.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"2\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003estrong demand for\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e对……需求强劲\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThere is strong demand for office space in Singapore.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eraise interest rates\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e加息\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThe bank may raise interest rates next year.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ecut costs\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e削减成本\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe need to cut costs in this business.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ewatch the market closely\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e密切关注市场\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eInvestors should watch the market closely.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e3. 短文\u003c/h2\u003e\n\u003cblockquote data-block=\"6\" class=\"speak-block\"\u003e\u003cp\u003eAccording to a market update, demand for office space in Singapore is rising. Example Capital (举例公司) says rents may go up next year. Banks may also raise interest rates. Investors should watch the market closely. We look forward to the full report next week.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e（练习用虚构短文，不是真实市场数据。）\u003c/p\u003e\n\u003cp data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003e中文：\u003c/strong\u003e 根据一份市场简报，新加坡的办公空间需求正在上升。Example Capital（举例公司）表示，明年租金可能上涨。银行也可能加息。投资者应密切关注市场。我们期待下周的完整报告。\u003c/p\u003e\n\u003ch2\u003e4. 回炉（第2课）\u003c/h2\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003e选词填空：follow up on / look forward to\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003eI will ______ the contract details after the meeting.\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003eWe ______ meeting your team next week.\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e答案在最后。\u003c/p\u003e\n\u003ch2\u003e5. 听读练习：Parroto\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e打开 https://parroto.app，自己注册或登录（我不替你注册）。\u003c/li\u003e\u003cli\u003e选 \u003cstrong\u003eA2\u003c/strong\u003e 材料，先听写一句，再对照原文，标出听错的词。\u003c/li\u003e\u003cli\u003e跟读这一句 2 遍，注意连读和语调。\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e6. 开口练习\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e读完短文，用 \u003cstrong\u003eThe main point is that ...\u003c/strong\u003e 说出要点，写 2 句英文即可，文字或语音都行。\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e选做：用 \u003cstrong\u003efollow up on\u003c/strong\u003e 说一句你本周的真实工作。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠最影响理解的 1–2 个错，并给你更自然的说法。\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e回炉答案：1. follow up on；2. look forward to\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e昨日自查（SGT）：11-04 英语学习调用外部模型 1 次，约 US$0.014；昨天除早课外没有额外的 Grok Bot 工作，用量正常。\u003c/p\u003e","blocks":["The main point is that ... …… The main point is that demand is rising.","according to the report According to the report, costs are going up.","strong demand for …… There is strong demand for office space in Singapore.","raise interest rates The bank may raise interest rates next year.","cut costs We need to cut costs in this business.","watch the market closely Investors should watch the market closely.","According to a market update, demand for office space in Singapore is rising. Example Capital ( ) says rents may go up next year. Banks may also raise interest rates. Investors should watch the market closely. We look forward to the full report next week.","Example Capital","follow up on / look forward to","I will ______ the contract details after the meeting.","We ______ meeting your team next week.","https://parroto.app","The main point is that ... 2","follow up on","1. follow up on 2. look forward to","SGT 11-04 1 US$0.014 Grok Bot"],"audio":["audio/22c3b385805c.mp3","audio/e573f890fbb7.mp3","audio/a7820bb1dd00.mp3","audio/72037e6ad1ca.mp3","audio/652795b22ab1.mp3","audio/cc5abb82fbd9.mp3","audio/65aec7d71a5a.mp3","audio/0854a7aa891c.mp3","audio/95d00462380c.mp3","audio/db58bca5557c.mp3","audio/d205512259d2.mp3","audio/1f6a49076462.mp3","audio/800ca899f97e.mp3","audio/71e375e10e65.mp3","audio/97340f73eeba.mp3","audio/5add21e032e4.mp3"]},{"id":"2026-11-06","kind":"lesson","title":"第4课｜词汇：说清下一步要做什么","date":"2026-11-06","sort":"2026-11-06","html":"\u003ch1\u003e第4课｜词汇：说清下一步要做什么\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 用一个句型搭配5个词块，说清投资、合作或日常安排中的下一步行动。（2026-11-06 SGT｜约15分钟）\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eI need to + 动作…\u003c/strong\u003e （我需要……）\u003c/p\u003e\n\u003cp\u003e把它当作一个完整开头，后面换上不同的动作词块即可。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eI need to check the figures before the meeting.   我需要在开会前核对数据。\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eI need to confirm the time with our partner.   我需要和合作方确认时间。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5个词块\u003c/h2\u003e\n\u003cp\u003e以下均为通用场景举例，不代表你实际做过的事。练习时整块读，不拆成单词背。\u003c/p\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003echeck the figures\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e核对数据\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to check the figures in the investment report.（我需要核对投资报告中的数据。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eassess the risks\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e评估风险\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to assess the risks before investing.（我需要在投资前评估风险。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ediscuss the terms\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e商讨条款\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to discuss the terms with our partner.（我需要和合作方商讨条款。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ereview progress\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e查看进展\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to review progress on the project this week.（我需要本周查看项目进展。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003econfirm the time\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e确认时间\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to confirm the time of my appointment at the clinic in Singapore.（我需要确认在新加坡诊所的预约时间。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短对话或短文（注明举例）\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e举例：两位同事准备与合作方开会，人物和情境均为虚构。\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003eA: I need to check the figures before our meeting. B: I need to assess the risks too. A: I need to discuss the terms with our partner. B: I need to confirm the time with them first.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e中文：\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003eA：我需要在开会前核对数据。 B：我也需要评估风险。 A：我需要和合作方商讨条款。 B：我需要先和他们确认时间。\u003c/p\u003e\n\u003ch2\u003e回炉\u003c/h2\u003e\n\u003cul\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e第1课（11-03｜第3天回炉）：\u003c/strong\u003e 用 \u003cstrong\u003eI'd like to…\u003c/strong\u003e 口头说一个今天的需求。\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e第3课（11-05｜第1天回炉）：\u003c/strong\u003e 用 \u003cstrong\u003eThe main point is that…\u003c/strong\u003e 口头概括一条你今天关注的信息。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e错题本目前为空；练习中出现的错点会记入，并按第1、3、7、14天回炉。\u003c/p\u003e\n\u003ch2\u003e开口练习\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e替换说三句：\u003c/strong\u003e 假设你要准备一次投资会议，用 \u003cstrong\u003eI need to…\u003c/strong\u003e 分别说“核对数据”“评估风险”“商讨条款”。先看词块说，再遮住英文说一遍。\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003e联系自己的安排：\u003c/strong\u003e 选今天最可能用到的两个词块，各说一句 \u003cstrong\u003eI need to…\u003c/strong\u003e；不方便谈真实业务时，可以使用假设场景。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e文字或语音都行。你回复后，我只纠最影响理解的 1–2 个错，并给你更自然的说法。\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e昨日自查（SGT）：11-05 英语学习调用外部模型 1 次，约 US$0.019；昨天除早课外没有额外的 Grok Bot 工作，用量正常。\u003c/p\u003e","blocks":["I need to + … ……","I need to check the figures before the meeting.","I need to confirm the time with our partner.","check the figures I need to check the figures in the investment report.","assess the risks I need to assess the risks before investing.","discuss the terms I need to discuss the terms with our partner.","review progress I need to review progress on the project this week.","confirm the time I need to confirm the time of my appointment at the clinic in Singapore.","A: I need to check the figures before our meeting. B: I need to assess the risks too. A: I need to discuss the terms with our partner. B: I need to confirm the time with them first.","A B A B","1 11-03 3 I'd like to…","3 11-05 1 The main point is that…","I need to… “ ”“ ”“ ”","I need to…","SGT 11-05 1 US$0.019 Grok Bot"],"audio":["audio/7803dda963af.mp3","audio/63478fa88056.mp3","audio/23ef701d563e.mp3","audio/35745e3ae56d.mp3","audio/da7e5ebf2636.mp3","audio/1e638aee0f23.mp3","audio/1459e65c38dd.mp3","audio/fa4dbe0fbf1c.mp3","audio/5376ae246c2b.mp3","audio/eca3c4290569.mp3","audio/e5e15c29e605.mp3","audio/892d091be747.mp3","audio/b214973291ac.mp3","audio/e4a029bccdb5.mp3","audio/c02deabb2793.mp3"]},{"id":"2026-11-07","kind":"lesson","title":"第5课｜口语日常：约时间，礼貌提议","date":"2026-11-07","sort":"2026-11-07","html":"\u003ch1\u003e第5课｜口语日常：约时间，礼貌提议\u003c/h1\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 学会用 How about we...? 轻松、礼貌地提议时间或安排。\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eHow about we + 动作/时间?\u003c/strong\u003e （中文意思：我们……怎么样？用来提议、商量安排）\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eHow about we meet on Thursday morning to go over the deal? （我们周四早上碰一下，过一遍这个项目怎么样？）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003eHow about we have lunch near Raffles Place tomorrow? （我们明天在莱佛士坊附近吃午饭怎么样？）\u003cem\u003e（地点为举例）\u003c/em\u003e\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eThat works for me.\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我这边可以。\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThursday at 10? That works for me.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eI'm tied up until...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我到……都走不开。\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI'm tied up until 3 p.m. with an investor call.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eLet me get back to you.\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我晚点回复你。\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet me get back to you after I check my schedule.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003epush back\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e往后推、延后\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eCan we push back the meeting by an hour?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"8\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ecatch up over coffee\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e喝杯咖啡聊聊近况\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eHow about we catch up over coffee in the afternoon?\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短对话（举例，人名为虚构）\u003c/h2\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eA（合作方 Mr. Tan，举例）：\u003c/strong\u003e Can we talk about the project today? \u003cstrong\u003eB（你）：\u003c/strong\u003e I'm tied up until 3 p.m. How about we meet at 4? \u003cstrong\u003eA：\u003c/strong\u003e Sorry, 4 is difficult. How about tomorrow morning? \u003cstrong\u003eB：\u003c/strong\u003e Let me get back to you in an hour. \u003cstrong\u003eA：\u003c/strong\u003e Sure. That works for me.\u003c/p\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e中文翻译：\u003c/strong\u003e \u003cstrong\u003eA：\u003c/strong\u003e 我们今天能聊聊项目吗？ \u003cstrong\u003eB：\u003c/strong\u003e 我到下午3点前都走不开。我们4点见怎么样？ \u003cstrong\u003eA：\u003c/strong\u003e 抱歉，4点不太方便。明天早上怎么样？ \u003cstrong\u003eB：\u003c/strong\u003e 我一小时后回复你。 \u003cstrong\u003eA：\u003c/strong\u003e 好的，我这边可以。\u003c/p\u003e\n\u003ch2\u003e回炉\u003c/h2\u003e\n\u003cul\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e第2课（第3天复习）：\u003c/strong\u003e 想一想，怎么说「我想跟进一下上次的会议」？提示：I'm following up on...\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e第4课（第1天复习）：\u003c/strong\u003e 用 I need to... 说一句：我需要确认时间。提示：confirm the time。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e开口练习\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e你的合作方想今天下午2点开会，但你到3点前都在忙。请用 \u003cstrong\u003eI'm tied up until...\u003c/strong\u003e 和 \u003cstrong\u003eHow about we...?\u003c/strong\u003e 各说一句回复他。\u003c/li\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e请用 \u003cstrong\u003eHow about we...?\u003c/strong\u003e 向一位朋友或合作方提议下周的一个时间，一起吃饭或喝咖啡（时间、地点自己定）。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e文字或语音都行。你回复后，我只纠最影响理解的 1–2 个错，并给你更自然的说法。\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e昨日自查（SGT）：11-06 英语学习调用外部模型 14 次，约 US$0.981；昨天除早课外还有多轮外部模型工作（点读 App/词义/朗读相关草稿与批量），用量偏大。反思：早课之外又反复调 draft/bulk 补 App 内容，轮次过多。整改：早课只保留 1 次 draft；点读 App 只跑 aux_build.py，不另开多轮 llm；失败只记一行原因，不手工重写脚本或连环重试。\u003c/p\u003e","blocks":["How about we...?","How about we + / ? ……","How about we meet on Thursday morning to go over the deal?","How about we have lunch near Raffles Place tomorrow?","That works for me. Thursday at 10? That works for me.","I'm tied up until... …… I'm tied up until 3 p.m. with an investor call.","Let me get back to you. Let me get back to you after I check my schedule.","push back Can we push back the meeting by an hour?","catch up over coffee How about we catch up over coffee in the afternoon?","A Mr. Tan Can we talk about the project today? B I'm tied up until 3 p.m. How about we meet at 4? A Sorry, 4 is difficult. How about tomorrow morning? B Let me get back to you in an hour. A Sure. That works for me.","A B 3 4 A 4 B A","2 3 I'm following up on...","4 1 I need to... confirm the time","2 3 I'm tied up until... How about we...?","How about we...?","SGT 11-06 14 US$0.981 App/ / draft/bulk App 1 draft App aux_build.py llm"],"audio":["audio/3477d0686af8.mp3","audio/6f5e77cf0587.mp3","audio/65933a64db0c.mp3","audio/dd4a419beade.mp3","audio/165b2240b087.mp3","audio/e3e26e95942c.mp3","audio/f0302ce6f8de.mp3","audio/6cdb961ab6be.mp3","audio/f5559d67b47e.mp3","audio/293cf4b706b1.mp3","audio/2b736e7b5337.mp3","audio/681f7528e99a.mp3","audio/07c4581d03b7.mp3","audio/345fa6425a90.mp3","audio/76e1d396dd36.mp3","audio/4aae9f983463.mp3"]},{"id":"2026-11-08","kind":"lesson","title":"第6课｜商务英语：开会表态","date":"2026-11-08","sort":"2026-11-08","html":"\u003ch1\u003e第6课｜商务英语：开会表态\u003c/h1\u003e\n\u003ch2\u003e1. 今天目标\u003c/h2\u003e\n\u003cp\u003e会议上能礼貌地说出\"我理解你的意思，但我有不同看法\"。\u003c/p\u003e\n\u003ch2\u003e2. 今日句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eI see your point, but + 你的看法.\u003c/strong\u003e 先肯定对方，再说自己的意见，语气不生硬。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eI see your point, but the timeline is too tight for us.\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eI see your point, but I'd like to run the numbers again first.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e3. 五个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eraise a concern about...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e提出对……的担忧\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI want to raise a concern about the budget.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003esee it differently\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e看法不同\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eOn the price, I see it differently.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ebe on the same page\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e想法一致\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eBefore we sign, let's make sure we're on the same page.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003erun the numbers\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e把数字算一遍\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet's run the numbers on the Johor project (举例) again.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003emove forward with...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e继续推进……\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe can move forward with the deal if the terms are clear.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e4. 场景包：开会表态3句万能句\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003eHere's where I stand.\u003c/strong\u003e（我的立场是这样的。）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eI see it a bit differently.\u003c/strong\u003e（我的看法稍有不同。）\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003eCan we agree on the next step?\u003c/strong\u003e（我们能确定下一步吗？）\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e5. 短对话\u003c/h2\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003eLim:\u003c/strong\u003e We should move forward with the project (举例) this quarter. 我们这个季度应该推进这个项目。\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003eWang:\u003c/strong\u003e I see your point, but I have a concern about the cost. 我理解你的意思，但我担心成本。\u003c/p\u003e\n\u003cp data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003eLim:\u003c/strong\u003e What worries you most? 你最担心什么？\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e\u003cstrong\u003eWang:\u003c/strong\u003e The budget is S$2 million (举例). Let's run the numbers again. 预算是200万新元（举例）。我们再算一遍数字。\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e\u003cstrong\u003eLim:\u003c/strong\u003e That works for me. Can we agree on the next step? 可以。我们能确定下一步吗？\u003c/p\u003e\n\u003ch2\u003e6. 回炉小测\u003c/h2\u003e\n\u003cp data-block=\"16\" class=\"speak-block\"\u003e\u003cstrong\u003e第5课（填空）：\u003c/strong\u003e I'm ______ until 3 p.m. Can we meet after that? \u003cstrong\u003e第3课（翻译）：\u003c/strong\u003e 这款产品的需求很强劲。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e答案：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"17\" class=\"speak-block\"\u003etied up（I'm tied up until 3 p.m.）\u003c/li\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003eThere is strong demand for this product.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e7. 开口练习\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e练习1：表达担忧\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"19\" class=\"speak-block\"\u003e跟读：I see your point, but I have a concern about the timeline.\u003c/li\u003e\u003cli data-block=\"20\" class=\"speak-block\"\u003e替换：把 timeline 换成 cost / risk / partner。\u003c/li\u003e\u003cli data-block=\"21\" class=\"speak-block\"\u003e开放问题：What is your biggest concern about a new investment?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e练习2：表达不同看法\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"22\" class=\"speak-block\"\u003e跟读：I see it a bit differently. Can we run the numbers again?\u003c/li\u003e\u003cli data-block=\"23\" class=\"speak-block\"\u003e替换：把 run the numbers again 换成 move forward / agree on the next step。\u003c/li\u003e\u003cli data-block=\"24\" class=\"speak-block\"\u003e开放问题：In a meeting, how do you say \"no\" politely?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e请用英文回复，哪怕只有两三句。你回复后，我会指出一两个最影响理解的地方，并给你更自然的说法。\u003c/p\u003e","blocks":["I see your point, but + .","I see your point, but the timeline is too tight for us.","I see your point, but I'd like to run the numbers again first.","raise a concern about... …… I want to raise a concern about the budget.","see it differently On the price, I see it differently.","be on the same page Before we sign, let's make sure we're on the same page.","run the numbers Let's run the numbers on the Johor project ( ) again.","move forward with... …… We can move forward with the deal if the terms are clear.","Here's where I stand.","I see it a bit differently.","Can we agree on the next step?","Lim: We should move forward with the project ( ) this quarter.","Wang: I see your point, but I have a concern about the cost.","Lim: What worries you most?","Wang: The budget is S$2 million ( ). Let's run the numbers again. 200","Lim: That works for me. Can we agree on the next step?","5 I'm ______ until 3 p.m. Can we meet after that? 3","tied up I'm tied up until 3 p.m.","There is strong demand for this product.","I see your point, but I have a concern about the timeline.","timeline cost / risk / partner","What is your biggest concern about a new investment?","I see it a bit differently. Can we run the numbers again?","run the numbers again move forward / agree on the next step","In a meeting, how do you say \"no\" politely?"],"audio":["audio/c748673d9fb8.mp3","audio/37d3e9aa8193.mp3","audio/3f05a0965ce6.mp3","audio/f8f716fca147.mp3","audio/a1ca4e2efa16.mp3","audio/1d530d7aefa6.mp3","audio/59550502707c.mp3","audio/546a70cd31bc.mp3","audio/ca6b9e3ce0c9.mp3","audio/c3267b4efc99.mp3","audio/6b082b1cc911.mp3","audio/ecca94c13868.mp3","audio/0b0f03cf37ff.mp3","audio/f15a3f49dc7e.mp3","audio/547189eb993a.mp3","audio/8ff9601de301.mp3","audio/03c20bbc5254.mp3","audio/f6c5a219ccc5.mp3","audio/3a889632ff27.mp3","audio/98908688b5db.mp3","audio/4fc562cfeb63.mp3","audio/0b498ad9c789.mp3","audio/74e519e263bb.mp3","audio/fcf7595185bb.mp3","audio/7cf2b284b2c9.mp3"]},{"id":"2026-11-09","kind":"lesson","title":"第7课｜商务英语：听读（听完读完，抓住重点）","date":"2026-11-09","sort":"2026-11-09","html":"\u003ch1\u003e第7课｜商务英语：听读（听完读完，抓住重点）\u003c/h1\u003e\n\u003ch2\u003e1. 今天目标\u003c/h2\u003e\n\u003cp\u003e听完或读完一段市场、生意内容后，能用一句英文说出重点。\u003c/p\u003e\n\u003ch2\u003e2. 今日句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eWhat really matters is ... / The key takeaway is that ...\u003c/strong\u003e 意思是\"真正重要的是……／最重要的结论是……\"。读完听完先说这一句，对方马上知道你抓住了重点。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eWhat really matters is the cash flow, not the headline number.\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eThe key takeaway is that the partner wants a lower price.\u003c/li\u003e\u003c/ul\u003e\n\u003cp data-block=\"3\" class=\"speak-block\"\u003e用法：What really matters is 后面接名词或短句；The key takeaway is that 后面接一个完整的句子。\u003c/p\u003e\n\u003ch2\u003e3. 五个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eget the main idea\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e抓住大意\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWhen I read a market report, I first try to get the main idea.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003epick up on...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e注意到、听出（细节或语气）\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eDid you pick up on the date he mentioned in the call?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eread between the lines\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e读出言外之意\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThe report sounds positive, but if you read between the lines, they are worried about costs.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003esum up\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e总结\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet me sum up the partner's offer in one sentence.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"8\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ekeep track of...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e持续跟踪、记录\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eOur target is S$500,000 (举例) this quarter, so let's keep track of sales every week.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e4. 场景包：听读后确认重点3句万能句\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eLet me make sure I heard that right.\u003c/strong\u003e（让我确认一下我听得对不对。）\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003eWhich figure are you referring to?\u003c/strong\u003e（你说的是哪个数字？）\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003eLet me put it in one sentence.\u003c/strong\u003e（让我用一句话说一下。）\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e5. 听读短文：市场小简报\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003e（示范短文，内容为虚构，不是真实新闻）\u003c/em\u003e\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003eHere is a quick market update. Last week, some investors were worried about higher costs. The key takeaway is that customer demand is still steady. What really matters now is how fast companies can control their costs. We will keep track of the numbers and update you next week.\u003c/p\u003e\n\u003cp\u003e这是一个简短的市场更新。上周，一些投资者担心成本上升。最重要的结论是，客户需求依然稳定。现在真正重要的是，公司能多快控制住成本。我们会持续跟踪数据，下周再向你更新。\u003c/p\u003e\n\u003cp data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003eParroto 用法（约5分钟）：\u003c/strong\u003e 请你自己打开 https://parroto.app，不用我替你注册。如果页面上能选难度，就从 A2 开始。\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e先听一遍，不看文字，只抓大意（get the main idea）。\u003c/li\u003e\u003cli\u003e再看文字，读一遍，标出你没听出来的词。\u003c/li\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003e再听一遍，这次注意数字和转折词，比如 but 和 now。\u003c/li\u003e\u003cli data-block=\"16\" class=\"speak-block\"\u003e合上文字，用今天的句型说一句重点：\u003cem\u003eThe key takeaway is that ...\u003c/em\u003e\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e6. 回炉小测\u003c/h2\u003e\n\u003cp data-block=\"17\" class=\"speak-block\"\u003e\u003cstrong\u003e第4课＋第6课（填空）：\u003c/strong\u003e Before we sign, let's ______ the risks and make sure we're on the same ______.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第2课＋第1课（翻译）：\u003c/strong\u003e 我想跟进一下上周的报告，您能再发我一次吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e答案：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003eassess; page（Before we sign, let's assess the risks and make sure we're on the same page.）\u003c/li\u003e\u003cli data-block=\"19\" class=\"speak-block\"\u003eI'd like to follow up on last week's report. Could you send it again?\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e7. 开口练习\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e练习1：说出听读后的重点\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"20\" class=\"speak-block\"\u003e跟读：The key takeaway is that the market is still stable.\u003c/li\u003e\u003cli data-block=\"21\" class=\"speak-block\"\u003e替换：把 the market is still stable 换成 demand is strong / costs are rising / the timeline is tight。\u003c/li\u003e\u003cli data-block=\"22\" class=\"speak-block\"\u003e开放问题：Think about the last report or news you read. What was the key takeaway?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e练习2：说出真正重要的事\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"23\" class=\"speak-block\"\u003e跟读：What really matters is the cash flow.\u003c/li\u003e\u003cli data-block=\"24\" class=\"speak-block\"\u003e替换：把 the cash flow 换成 the terms / the risks / the timing。\u003c/li\u003e\u003cli data-block=\"25\" class=\"speak-block\"\u003e开放问题：When you look at a new investment, what really matters to you?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e请用英文回复，哪怕只有两三句。你回复后，我会指出一两个最影响理解的地方，并给你更自然的说法。\u003c/p\u003e","blocks":["What really matters is ... / The key takeaway is that ... \" …… ……\"","What really matters is the cash flow, not the headline number.","The key takeaway is that the partner wants a lower price.","What really matters is The key takeaway is that","get the main idea When I read a market report, I first try to get the main idea.","pick up on... Did you pick up on the date he mentioned in the call?","read between the lines The report sounds positive, but if you read between the lines, they are worried about costs.","sum up Let me sum up the partner's offer in one sentence.","keep track of... Our target is S$500,000 ( ) this quarter, so let's keep track of sales every week.","Let me make sure I heard that right.","Which figure are you referring to?","Let me put it in one sentence.","Here is a quick market update. Last week, some investors were worried about higher costs. The key takeaway is that customer demand is still steady. What really matters now is how fast companies can control their costs. We will keep track of the numbers and update you next week.","Parroto 5 https://parroto.app A2","get the main idea","but now","The key takeaway is that ...","4 6 Before we sign, let's ______ the risks and make sure we're on the same ______.","assess; page Before we sign, let's assess the risks and make sure we're on the same page.","I'd like to follow up on last week's report. Could you send it again?","The key takeaway is that the market is still stable.","the market is still stable demand is strong / costs are rising / the timeline is tight","Think about the last report or news you read. What was the key takeaway?","What really matters is the cash flow.","the cash flow the terms / the risks / the timing","When you look at a new investment, what really matters to you?"],"audio":["audio/9d540947becb.mp3","audio/d7e7e74e6cee.mp3","audio/d943830e1f15.mp3","audio/859fc3872c08.mp3","audio/a4c06f5383ad.mp3","audio/72ad16b52048.mp3","audio/b9bbd4a1c2f7.mp3","audio/bafd37defbcc.mp3","audio/e3737e498141.mp3","audio/4bf35a45dc37.mp3","audio/5cb7db8425b1.mp3","audio/d996dc583439.mp3","audio/4f27d0738264.mp3","audio/7cb2559f8f1e.mp3","audio/66136fd3620f.mp3","audio/5c05397abc8a.mp3","audio/68ed0153d636.mp3","audio/7324d127524c.mp3","audio/443037268757.mp3","audio/89ddbacf3b3f.mp3","audio/689328014858.mp3","audio/7c02786a99bd.mp3","audio/8d275faba67e.mp3","audio/d8820f86a7dd.mp3","audio/e3de8c8bee39.mp3","audio/042d22b62c4b.mp3"]},{"id":"2026-11-10","kind":"lesson","title":"今天的15分钟英语课（第8课·词汇）","date":"2026-11-10","sort":"2026-11-10","html":"\u003ch1\u003e今天的15分钟英语课（第8课·词汇）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型说清楚风险。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eThe main risk is ___.\u003c/strong\u003e 主要风险是…… 例：The main risk is cash flow.（主要风险是现金流。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003ekeep ... under control\u003c/strong\u003e：把……控制住 We need to keep costs under control.（我们要控制好成本。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003ecash flow\u003c/strong\u003e：现金流 Cash flow is tight this quarter.（本季度现金流紧。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eexposure to\u003c/strong\u003e：对……的风险敞口 Our exposure to one market is high.（我们对单一市场的敞口偏高。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003edownside\u003c/strong\u003e：下行风险 What's the downside of this deal?（这笔交易的下行风险是什么？）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ehold off on\u003c/strong\u003e：暂缓 Let's hold off on the new office in Singapore.（我们先暂缓新加坡办公室的事。）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: What's the main risk in this deal?（这笔交易主要风险是什么？） B: The main risk is cash flow.（主要风险是现金流。） A: Can we keep costs under control?（我们能控制成本吗？） B: Yes, but let's hold off on new hiring.（可以，但先暂缓招人。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e第1课：Could you help me sort out this schedule? No worries, I'm on my way.（能帮我理一下日程吗？没问题，我在路上。）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e第5课：How about we meet Friday? I'm tied up until 3 pm (举例), so let me get back to you.（周五见如何？我到下午3点（举例）前有事，我回头答复你。）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e第7课：Let me sum up: I picked up on one risk.（我总结一下：我注意到一个风险。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e用 \u003cstrong\u003eThe main risk is...\u003c/strong\u003e 说你现在一个项目的风险。\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e用 \u003cstrong\u003ehold off on...\u003c/strong\u003e 说一件你想暂缓的事。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 The main risk is ___. …… The main risk is cash flow.","keep ... under control …… We need to keep costs under control.","cash flow Cash flow is tight this quarter.","exposure to …… Our exposure to one market is high.","downside What's the downside of this deal?","hold off on Let's hold off on the new office in Singapore.","💬 A: What's the main risk in this deal? B: The main risk is cash flow. A: Can we keep costs under control? B: Yes, but let's hold off on new hiring.","1 Could you help me sort out this schedule? No worries, I'm on my way.","5 How about we meet Friday? I'm tied up until 3 pm ( ), so let me get back to you. 3","7 Let me sum up: I picked up on one risk.","The main risk is...","hold off on..."],"audio":["audio/b1c93975c990.mp3","audio/73ff79a0727c.mp3","audio/c88d49325816.mp3","audio/b66a45d36cc8.mp3","audio/bbb52c3c2173.mp3","audio/bb8b83745d3b.mp3","audio/de15ddb3ebb8.mp3","audio/e359c0c2c01d.mp3","audio/923ffc0e449e.mp3","audio/071e56ee9f86.mp3","audio/dcd6ea909ec5.mp3","audio/147d0f273ec6.mp3"]},{"id":"2026-11-11","kind":"lesson","title":"今天的15分钟英语课（第9课·口语日常）","date":"2026-11-11","sort":"2026-11-11","html":"\u003ch1\u003e今天的15分钟英语课（第9课·口语日常）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型礼貌地请别人帮个小忙。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eWould you mind ___ing?\u003c/strong\u003e 你介意……吗？／麻烦你……可以吗？ 例：Would you mind sending me the file?（麻烦你把文件发给我可以吗？） 小提示：mind 后面接动词的 -ing 形式。如果你不介意，回答 \"Not at all.\" 或 \"Sure, no problem.\"。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003erunning late\u003c/strong\u003e：晚到、要迟到 Sorry, I'm running late. I'll be there in 10 minutes (举例).（抱歉，我要晚到了，10分钟（举例）后到。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003egive me a heads-up\u003c/strong\u003e：提前跟我说一声 Please give me a heads-up if the schedule changes.（日程有变的话，请提前跟我说一声。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eswing by\u003c/strong\u003e：顺路去一下、过去坐坐 I'll swing by your office after lunch.（午饭后我顺路去你办公室一趟。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003eno rush\u003c/strong\u003e：不急 No rush. Next Monday (举例) is fine.（不急，下周一（举例）就行。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003egrab a coffee\u003c/strong\u003e：喝杯咖啡（随意地） Let's grab a coffee before the meeting.（开会前我们喝杯咖啡吧。）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: Would you mind moving the meeting to 4 pm (举例)? I'm running late.（你介意把会议改到下午4点（举例）吗？我要晚到了。） B: Not at all. Just give me a heads-up next time.（不介意。下次提前跟我说一声就行。） A: Sure, thanks. I'll swing by your office after that.（好的，谢谢。之后我顺路去你办公室。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e第2课：As discussed, I'll follow up on the contract and circle back to you on Friday (举例).（正如我们讨论过的，我会跟进合同的事，周五（举例）再回复你。）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e第6课：I want to raise a concern about the timeline, and I hope we can be on the same page even if you see it differently.（我想就时间安排提出一个担忧，即使你看法不同，也希望我们能达成一致。）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e第8课：Our exposure to one client is high and cash flow is tight, so let's hold off on new hiring.（我们对单一客户的敞口偏高，现金流也紧，所以先暂缓招人。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e用 \u003cstrong\u003eWould you mind ...ing?\u003c/strong\u003e 向别人提一个小请求（比如请助理或合作方做一件事）。\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e用 \u003cstrong\u003erunning late\u003c/strong\u003e 或 \u003cstrong\u003egive me a heads-up\u003c/strong\u003e 说一个你今天或这周的真实情况。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 Would you mind ___ing? …… …… Would you mind sending me the file? mind -ing \"Not at all.\" \"Sure, no problem.\"","running late Sorry, I'm running late. I'll be there in 10 minutes ( ). 10","give me a heads-up Please give me a heads-up if the schedule changes.","swing by I'll swing by your office after lunch.","no rush No rush. Next Monday ( ) is fine.","grab a coffee Let's grab a coffee before the meeting.","💬 A: Would you mind moving the meeting to 4 pm ( )? I'm running late. 4 B: Not at all. Just give me a heads-up next time. A: Sure, thanks. I'll swing by your office after that.","2 As discussed, I'll follow up on the contract and circle back to you on Friday ( ).","6 I want to raise a concern about the timeline, and I hope we can be on the same page even if you see it differently.","8 Our exposure to one client is high and cash flow is tight, so let's hold off on new hiring.","Would you mind ...ing?","running late give me a heads-up"],"audio":["audio/cb26c051268b.mp3","audio/813a0bb573b2.mp3","audio/644fc175f46d.mp3","audio/c4149ec8cfa1.mp3","audio/1b27c0583f81.mp3","audio/449d08a5c8cd.mp3","audio/86994c2f953d.mp3","audio/d64928dae378.mp3","audio/3595decf0084.mp3","audio/55ff98617e54.mp3","audio/9098bfb45832.mp3","audio/a5a9f122fe1e.mp3"]},{"id":"2026-11-12","kind":"lesson","title":"今天的15分钟英语课（第10课·商务英语）","date":"2026-11-12","sort":"2026-11-12","html":"\u003ch1\u003e今天的15分钟英语课（第10课·商务英语）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型礼貌地拒绝对方，同时给出替代方案。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eI'm afraid we can't ___, but we could ___.\u003c/strong\u003e 恐怕我们不能……，不过我们可以…… 例：I'm afraid we can't invest that much now, but we could start smaller.（恐怕我们现在不能投那么多，不过可以先从小额开始。） 小提示：I'm afraid 在这里是\"恐怕、抱歉\"的意思，语气比直接说 \"No\" 柔和得多。后面的 but we could... 是关键，先说不行，再给一个能做的选择，对方更容易接受。两处都接动词原形（can't invest / could start）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003epass on\u003c/strong\u003e：婉拒、不参与 We'll have to pass on this deal, but thank you for thinking of us.（这个项目我们只能婉拒，但谢谢您想到我们。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003enot a good fit\u003c/strong\u003e：不太合适 This project is not a good fit for our current portfolio.（这个项目和我们目前的投资组合不太匹配。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eat this stage\u003c/strong\u003e：现阶段 We can't commit more than S$500,000 (举例) at this stage.（现阶段我们最多只能承诺50万新元（举例）。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003ekeep the door open\u003c/strong\u003e：保留以后合作的可能 We can't join this round, but let's keep the door open for the next one.（这一轮我们不能参与，但下一轮的门还开着。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003etake a rain check\u003c/strong\u003e：改天再约、下次再说 Can we take a rain check on the meeting this Friday (举例)?（周五（举例）的会可以改天再约吗？）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: Could you invest S$2 million (举例) in our new project?（你们能投200万新元（举例）到我们的新项目吗？） B: I'm afraid we can't invest that much at this stage, but we could start with S$500,000 (举例).（恐怕现阶段我们投不了这么多，不过可以先从50万新元（举例）开始。） A: I see. That's still helpful.（明白了，这样也有帮助。） B: Thanks. Let's keep the door open and talk again next quarter.（谢谢。我们保持联系，下个季度再谈。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e✨ 礼貌拒绝的3句万能句\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003eThank you for the offer. We really appreciate it.\u003c/strong\u003e（谢谢您的提议，我们很感激。）先表示感谢。\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm afraid we can't ..., but we could ...\u003c/strong\u003e（恐怕我们不能……，不过我们可以……）今天的核心句型，拒绝时给出替代方案。\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eLet's revisit this next quarter.\u003c/strong\u003e（我们下个季度再看看这件事。）把话题留到以后，关系不会僵。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e第9课：Would you mind giving me a heads-up if you're running late?（如果你要晚到，麻烦提前跟我说一声可以吗？）\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e第8课：The main risk is that cash flow is tight, so let's hold off on this deal.（主要风险是现金流紧张，所以这个项目先缓一缓。）\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e第3课：The main point is that demand is strong, so let's watch the market closely.（主要的一点是需求强劲，所以我们要密切关注市场。）\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e第1课：Could you sort this out for me? I'd like to finish it today (举例).（你能帮我处理一下吗？我想今天做完。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e想一个别人最近向你提出的要求（比如追加投资、降价、延期），用 \u003cstrong\u003eI'm afraid we can't ..., but we could ...\u003c/strong\u003e 礼貌地拒绝，并给出一个替代方案。\u003c/li\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003e可选：再加一句 \u003cstrong\u003ekeep the door open\u003c/strong\u003e 或 \u003cstrong\u003etake a rain check\u003c/strong\u003e，为以后留余地。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 I'm afraid we can't ___, but we could ___. …… …… I'm afraid we can't invest that much now, but we could start smaller. I'm afraid \" \" \"No\" but we could... can't invest / could start","pass on We'll have to pass on this deal, but thank you for thinking of us.","not a good fit This project is not a good fit for our current portfolio.","at this stage We can't commit more than S$500,000 ( ) at this stage. 50","keep the door open We can't join this round, but let's keep the door open for the next one.","take a rain check Can we take a rain check on the meeting this Friday ( )?","💬 A: Could you invest S$2 million ( ) in our new project? 200 B: I'm afraid we can't invest that much at this stage, but we could start with S$500,000 ( ). 50 A: I see. That's still helpful. B: Thanks. Let's keep the door open and talk again next quarter.","Thank you for the offer. We really appreciate it.","I'm afraid we can't ..., but we could ... …… ……","Let's revisit this next quarter.","9 Would you mind giving me a heads-up if you're running late?","8 The main risk is that cash flow is tight, so let's hold off on this deal.","3 The main point is that demand is strong, so let's watch the market closely.","1 Could you sort this out for me? I'd like to finish it today ( ).","I'm afraid we can't ..., but we could ...","keep the door open take a rain check"],"audio":["audio/37c95a24dcc8.mp3","audio/5908c8d1eba1.mp3","audio/c7c433b2526f.mp3","audio/cd28d0c5fc93.mp3","audio/cdc75091a049.mp3","audio/53f6572e0f27.mp3","audio/dbda903a9bcb.mp3","audio/da2d8a700131.mp3","audio/f313572be8ec.mp3","audio/bac9479df536.mp3","audio/fa44bbcf2eb2.mp3","audio/223c7280921b.mp3","audio/a0a0e027fa46.mp3","audio/07e329247d9c.mp3","audio/5d68a60a50af.mp3","audio/9f92ef7e3006.mp3"]},{"id":"2026-11-13","kind":"lesson","title":"今天的15分钟英语课（第11课·口语日常）","date":"2026-11-13","sort":"2026-11-13","html":"\u003ch1\u003e今天的15分钟英语课（第11课·口语日常）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型礼貌地征求对方同意，比如接电话、提前离开、借东西。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eWould it be OK if I ___?\u003c/strong\u003e 我……可以吗？ 例：Would it be OK if I took a call for a minute?（我接个电话可以吗？） 小提示：if 后面用过去式（took / left / joined），但意思是现在或马上要做的事，用过去式只是让语气更客气。口语里也可以说 Do you mind if I take a call?（这里 if 后面用动词原形）。注意，对 Do you mind...? 回答 \"No, go ahead.\" 或 \"Not at all.\" 才是同意。回答 \"Sure\" 也常见，意思同样是可以。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003estep out\u003c/strong\u003e：暂时离开一下 Would it be OK if I stepped out for a few minutes?（我出去几分钟可以吗？）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003etake a call\u003c/strong\u003e：接电话 I need to take a call from my banker. Would it be OK?（我要接一个银行经理的电话，可以吗？）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003ehead out early\u003c/strong\u003e：提前走 Would it be OK if I headed out early today? I have a dinner at 6:30 (举例).（我今天提前走可以吗？我6点半（举例）有个饭局。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003eGo ahead.\u003c/strong\u003e：请便、你做吧 A: Would it be OK if I opened the window?（我开一下窗可以吗？）B: Go ahead.（请开。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ehave a quick word\u003c/strong\u003e：简短说几句 Could I have a quick word with you after the meeting?（会后我能跟您简单说几句吗？）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: Would it be OK if I took a call for a minute? It's my banker.（我接个电话可以吗？是我的银行经理。） B: Sure, go ahead.（当然，请。） A: Thanks. Would it be OK if I headed out early today? I have a dinner at 6:30 (举例).（谢谢。我今天提前走可以吗？我6点半（举例）有个饭局。） B: No problem. Could I have a quick word before you leave?（没问题。你走之前我能简单说几句吗？）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e第1课：I'd like to step out for a minute. Would it be OK?（我想出去一下，可以吗？）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e第3课：There's strong demand for office space in Singapore. Would it be OK if I sent you a short report?（新加坡对办公空间的需求很强。我给您发一份简短的报告可以吗？）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e第6课：I see it differently. Would it be OK if I explained why?（我的看法不一样。我解释一下原因可以吗？）\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e第10课：Would it be OK if we took a rain check on lunch? I have a call at 12:30 (举例).（午饭我们改天再约可以吗？我12点半（举例）有个电话。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e想象你正在开会或见客人，用 \u003cstrong\u003eWould it be OK if I ...?\u003c/strong\u003e 写两句，分别提出两个小请求（比如接电话、提前走、拍一张白板的照片）。\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e可选：再加一句 \u003cstrong\u003eI see it differently.\u003c/strong\u003e，礼貌地表达你不同的看法，然后用 \u003cstrong\u003eWould it be OK if I ...?\u003c/strong\u003e 问对方能不能让你解释一下。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 Would it be OK if I ___? …… Would it be OK if I took a call for a minute? if took / left / joined Do you mind if I take a call? if Do you mind...? \"No, go ahead.\" \"Not at all.\" \"Sure\"","step out Would it be OK if I stepped out for a few minutes?","take a call I need to take a call from my banker. Would it be OK?","head out early Would it be OK if I headed out early today? I have a dinner at 6:30 ( ). 6","Go ahead. A: Would it be OK if I opened the window? B: Go ahead.","have a quick word Could I have a quick word with you after the meeting?","💬 A: Would it be OK if I took a call for a minute? It's my banker. B: Sure, go ahead. A: Thanks. Would it be OK if I headed out early today? I have a dinner at 6:30 ( ). 6 B: No problem. Could I have a quick word before you leave?","1 I'd like to step out for a minute. Would it be OK?","3 There's strong demand for office space in Singapore. Would it be OK if I sent you a short report?","6 I see it differently. Would it be OK if I explained why?","10 Would it be OK if we took a rain check on lunch? I have a call at 12:30 ( ). 12","Would it be OK if I ...?","I see it differently. Would it be OK if I ...?"],"audio":["audio/b49b4bbcf155.mp3","audio/c32bcbb8ddaf.mp3","audio/0dbe343dcced.mp3","audio/ddb287448de5.mp3","audio/4bb19dd7fb22.mp3","audio/32c93b44eccd.mp3","audio/9698c73c0320.mp3","audio/8c5c8eeb4645.mp3","audio/531fd2a07059.mp3","audio/10bc26685e73.mp3","audio/03d5f6cf7164.mp3","audio/3153401551a5.mp3","audio/6665b830efd7.mp3"]},{"id":"reading-1-4","kind":"reading","title":"A Day in Singapore｜新加坡商务人士的一天","date":"2026-11-06","sort":1793966198.176157,"html":"\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"0\"\u003eMr. Lim works in investment in Singapore. Every morning, he goes to a small coffee shop near his office. The shop is busy, but the people are friendly. Today he is a little late, so he sends a message to his partner, Ms. Chen: \"I'm \u003cstrong class=\"reading-emphasis\"\u003eon my way\u003c/strong\u003e.\" She replies, \"\u003cstrong class=\"reading-emphasis\"\u003eNo worries\u003c/strong\u003e. See you at eleven.\" At the shop, Mr. Lim smiles at the owner. \"\u003cstrong class=\"reading-emphasis\"\u003eI'd like to\u003c/strong\u003e have a coffee, please. \u003cstrong class=\"reading-emphasis\"\u003eCould you\u003c/strong\u003e add a little milk?\" \"Of course,\" says the owner.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-0\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-0\" hidden\u003e林先生在新加坡从事投资工作。每天早上，他都会去办公室附近的一家小咖啡店。店里很忙，但大家都很友好。今天他有点晚了，所以给合伙人陈女士发了条消息：\"我在路上了。\"她回复：\"没关系，十一点见。\"在咖啡店里，林先生对店主笑了笑：\"我想要一杯咖啡，谢谢。你能加一点牛奶吗？\"\"当然可以，\"店主说。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"1\"\u003eMr. Lim sits down and opens his laptop. First, he writes an email to Mr. Tan, a client. \"Dear Mr. Tan, \u003cstrong class=\"reading-emphasis\"\u003eI'm following up on\u003c/strong\u003e our call last week. \u003cstrong class=\"reading-emphasis\"\u003eAs discussed\u003c/strong\u003e, \u003cstrong class=\"reading-emphasis\"\u003ecould you\u003c/strong\u003e send the revised proposal \u003cstrong class=\"reading-emphasis\"\u003eat your earliest convenience\u003c/strong\u003e? I \u003cstrong class=\"reading-emphasis\"\u003elook forward to\u003c/strong\u003e your reply. Best regards, Lim.\" He plans to \u003cstrong class=\"reading-emphasis\"\u003efollow up on\u003c/strong\u003e it again on Friday. If Mr. Tan is busy, they can \u003cstrong class=\"reading-emphasis\"\u003ecircle back\u003c/strong\u003e next week.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-1\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-1\" hidden\u003e林先生坐下来，打开笔记本电脑。首先，他给客户谭先生写了一封邮件。\"亲爱的谭先生：我想跟进一下我们上周的通话。如之前所谈，您方便时能尽快把修改后的方案发给我吗？期待您的回复。此致，林。\"他打算周五再跟进一次。如果谭先生很忙，他们可以下周再谈。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"2\"\u003eAfter coffee, Mr. Lim goes to his office and reads a short market report. The report is made up for this story, so the numbers are not real. He underlines the key words with a pen. \u003cstrong class=\"reading-emphasis\"\u003eAccording to the report\u003c/strong\u003e, there is \u003cstrong class=\"reading-emphasis\"\u003estrong demand for\u003c/strong\u003e office space in Singapore. The bank may \u003cstrong class=\"reading-emphasis\"\u003eraise interest rates\u003c/strong\u003e next year. Many companies want to \u003cstrong class=\"reading-emphasis\"\u003ecut costs\u003c/strong\u003e. \u003cstrong class=\"reading-emphasis\"\u003eThe main point is that\u003c/strong\u003e the market is changing. Mr. Lim thinks, \"Investors should \u003cstrong class=\"reading-emphasis\"\u003ewatch the market closely\u003c/strong\u003e.\"\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-2\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-2\" hidden\u003e喝完咖啡，林先生去办公室，读一份简短的市场报告。这份报告是为这个故事虚构的，所以数字都不是真实的。他用笔把关键词划出来。根据报告，新加坡对办公空间的需求强劲。银行明年可能会加息。很多公司想削减成本。主要意思是：市场正在变化。林先生心想：\"投资者应该密切关注市场。\"\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"3\"\u003eBefore the meeting, Mr. Lim makes a short list. \"\u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003echeck the figures\u003c/strong\u003e in the investment report. Then \u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003eassess the risks\u003c/strong\u003e.\" He opens the report again and reads every number slowly. The numbers look fine, but one risk is clear: costs may go up. Mr. Lim writes a note beside it and feels ready.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-3\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-3\" hidden\u003e开会前，林先生列了一份简短的清单。\"我需要核对投资报告里的数据。然后我需要评估风险。\"他再次打开报告，慢慢读每一个数字。数字看起来没问题，但有一个风险很明显：成本可能会上升。林先生在旁边写了一条备注，觉得准备好了。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"4\"\u003eAt eleven, Ms. Chen arrives. They \u003cstrong class=\"reading-emphasis\"\u003ediscuss the terms\u003c/strong\u003e of a small project. Then they \u003cstrong class=\"reading-emphasis\"\u003ereview progress\u003c/strong\u003e on the work so far. Ms. Chen asks, \"\u003cstrong class=\"reading-emphasis\"\u003eCould you\u003c/strong\u003e help \u003cstrong class=\"reading-emphasis\"\u003esort out\u003c/strong\u003e the payment schedule for next week?\" \"Sure,\" says Mr. Lim. \"\u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003econfirm the time\u003c/strong\u003e of our next meeting, too. Is Tuesday good?\" \"Tuesday is fine,\" she says. Everyone agrees. The meeting ends at noon.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-4\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-4\" hidden\u003e十一点，陈女士到了。他们商讨一个小项目的条款，然后查看到目前为止的工作进展。陈女士问：\"你能帮忙理清下周的付款安排吗？\"\"没问题，\"林先生说，\"我也需要确认下次会议的时间。周二可以吗？\"\"周二可以，\"她说。大家都同意了。会议在中午结束。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"5\"\u003eOn the way home, Mr. Lim thinks about his day. It was busy, but he feels calm and happy. He asked for help, wrote a clear email, read a report, and planned his next steps. \"\u003cstrong class=\"reading-emphasis\"\u003eI'd like to\u003c/strong\u003e do this every day,\" he thinks. \"Small steps make a big difference.\"\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-5\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-5\" hidden\u003e回家的路上，林先生回想这一天。这一天很忙，但他觉得平静又开心。他请别人帮忙，写了一封清楚的邮件，读了一份报告，还安排好了下一步。\"我想每天都这样做，\"他想，\"小步骤能带来大不同。\"\u003c/div\u003e\n\u003c/section\u003e","blocks":["Mr. Lim works in investment in Singapore. Every morning, he goes to a small coffee shop near his office. The shop is busy, but the people are friendly. Today he is a little late, so he sends a message to his partner, Ms. Chen: \"I'm on my way.\" She replies, \"No worries. See you at eleven.\" At the shop, Mr. Lim smiles at the owner. \"I'd like to have a coffee, please. Could you add a little milk?\" \"Of course,\" says the owner.","Mr. Lim sits down and opens his laptop. First, he writes an email to Mr. Tan, a client. \"Dear Mr. Tan, I'm following up on our call last week. As discussed, could you send the revised proposal at your earliest convenience? I look forward to your reply. Best regards, Lim.\" He plans to follow up on it again on Friday. If Mr. Tan is busy, they can circle back next week.","After coffee, Mr. Lim goes to his office and reads a short market report. The report is made up for this story, so the numbers are not real. He underlines the key words with a pen. According to the report, there is strong demand for office space in Singapore. The bank may raise interest rates next year. Many companies want to cut costs. The main point is that the market is changing. Mr. Lim thinks, \"Investors should watch the market closely.\"","Before the meeting, Mr. Lim makes a short list. \"I need to check the figures in the investment report. Then I need to assess the risks.\" He opens the report again and reads every number slowly. The numbers look fine, but one risk is clear: costs may go up. Mr. Lim writes a note beside it and feels ready.","At eleven, Ms. Chen arrives. They discuss the terms of a small project. Then they review progress on the work so far. Ms. Chen asks, \"Could you help sort out the payment schedule for next week?\" \"Sure,\" says Mr. Lim. \"I need to confirm the time of our next meeting, too. Is Tuesday good?\" \"Tuesday is fine,\" she says. Everyone agrees. The meeting ends at noon.","On the way home, Mr. Lim thinks about his day. It was busy, but he feels calm and happy. He asked for help, wrote a clear email, read a report, and planned his next steps. \"I'd like to do this every day,\" he thinks. \"Small steps make a big difference.\""],"audio":["audio/b3a2c99516a4.mp3","audio/19da99ddb128.mp3","audio/4fe24adb38ef.mp3","audio/fbde467f619e.mp3","audio/eafcb15c782c.mp3","audio/9a8a04e7a839.mp3"]}],"glossary":{"i'd":{"ipa":"/aɪd/","zh":"我想要（I would 的缩写）","pos":"pron."},"like":{"ipa":"/laɪk/","zh":"想要，希望","pos":"v."},"to":{"ipa":"/tuː/","zh":"（动词不定式符号）","pos":"part."},"could":{"ipa":"/kʊd/","zh":"能，可以（表示礼貌请求）","pos":"modal v."},"you":{"ipa":"/juː/","zh":"你，您","pos":"pron."
