<style>
:root {

* { box-sizing:border-box }
body {

button { cursor:pointer }
a { color:var(--accent) }
button:focus-visible,a:focus-visible,select:focus-visible,.w:focus-visible {
  outline:3px solid var(--accent); outline-offset:3px;
}
[hidden] { display:none !important }
.site-header {
  padding:18px 18px 14px; padding-top:max(18px,env(safe-area-inset-top));

.card-word { font-size:23px; line-height:1.3; font-weight:750; overflow-wrap:anywhere; flex:1 }
.card-speak,.card-close {

.card-close { background:var(--bg); color:var(--muted) }
.card-ipa { color:var(--muted); font-size:16px; margin-top:9px; white-space:pre-wrap }

"use strict";
const DATA = {"entries":[{"id":"2026-11-03","kind":"lesson","title":"第1课｜口语日常（11-03）","date":"2026-11-03","sort":"2026-11-03","html":"\u003ch1\u003e第1课｜口语日常（11-03）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e用礼貌的口语句型提出需求、请对方帮忙。（本课完整讲义未收录，以下依据课程索引整理。）\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003eI'd like to ... ／ Could you ...? （我想要……／你能……吗？）\u003c/p\u003e\n\u003ch2\u003e5个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"1\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eI'd like to\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我想要……\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e（回炉题）用 I'd like to… 口头说一个今天的需求。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"2\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eCould you...?\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e你能……吗？\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eCould you help sort out ______?（第2课回炉：请合作方理清下周付款安排）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003esort out\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e理清、处理好\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eCould you help sort out the payment schedule for next week?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eon my way\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e在路上\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e索引中未收录例句\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eno worries\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e没关系、不用担心\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e索引中未收录例句\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短对话\u003c/h2\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e索引中未收录本课对话；复习时重点记住两个开头：\u003cstrong\u003eI'd like to ...\u003c/strong\u003e 表达自己想做的事，\u003cstrong\u003eCould you ...?\u003c/strong\u003e 礼貌地请别人做事。\u003c/p\u003e","blocks":["I'd like to ... Could you ...? …… ……","I'd like to …… I'd like to…","Could you...? …… Could you help sort out ______? 2","sort out Could you help sort out the payment schedule for next week?","on my way","no worries","I'd like to ... Could you ...?"],"audio":["audio/63e223fb9cba.mp3","audio/f05a47d22a07.mp3","audio/9a5f6634f9fc.mp3","audio/820abccffe0f.mp3","audio/37976624e1b7.mp3","audio/48295fd28a6a.mp3","audio/8313eed381b3.mp3"]},{"id":"2026-11-04","kind":"lesson","title":"第2课｜商务英语：跟进邮件","date":"2026-11-04","sort":"2026-11-04","html":"\u003ch1\u003e第2课｜商务英语：跟进邮件\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 学会用一个句型，礼貌地催进度、跟进事情。\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm following up on + 事情.\u003c/strong\u003e （我想跟进一下……）\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eI'm following up on \u003cstrong\u003ethe draft agreement\u003c/strong\u003e.\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eI'm following up on \u003cstrong\u003eour call last week\u003c/strong\u003e.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5个商务词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003efollow up on\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e跟进\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI'm following up on the term sheet we sent.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ecircle back\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e回头再谈\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet's circle back after your board meeting.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eas discussed\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e如之前所谈\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eAs discussed, we'll review the project timeline.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eat your earliest convenience\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e您方便时尽快\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003ePlease send the update at your earliest convenience.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003elook forward to\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e期待\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI look forward to your reply.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短邮件示例（人名、公司、日期、数字均为举例）\u003c/h2\u003e\n\u003cblockquote data-block=\"8\" class=\"speak-block\"\u003e\u003cp\u003eDear Mr. Tan, I'm following up on our call on 3 November. As discussed, could you send the revised proposal at your earliest convenience? I look forward to your reply. Best regards, Gang\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003e中文：\u003c/strong\u003e 谭先生您好： 我想跟进一下我们11月3日的通话。如之前所谈，您方便时能否尽快发来修改后的方案？期待您的回复。 此致， Gang\u003c/p\u003e\n\u003ch2\u003e回炉（第1课）\u003c/h2\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e用 \u003cstrong\u003eCould you ...?\u003c/strong\u003e 或 \u003cstrong\u003esort out\u003c/strong\u003e 写一句话：请合作方理清下周付款安排。 提示：Could you help sort out ______?\u003c/p\u003e\n\u003ch2\u003e开口练习\u003c/h2\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e1. 替换练习：\u003c/strong\u003e 把画线部分换成别的事情，各说一句。 I'm following up on \u003cstrong\u003ethe draft agreement\u003c/strong\u003e. → the site visit / the payment schedule / the project update\u003c/p\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e2. 开放题：\u003c/strong\u003e 用 \u003cem\u003eI'm following up on ...\u003c/em\u003e 说一句你现在真实要跟进的事（投资、合作方或项目都可以）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e你回复后，我只纠正一两个最影响理解的地方，并给你更自然的说法。\u003c/strong\u003e\u003c/p\u003e","blocks":["I'm following up on + . ……","I'm following up on the draft agreement.","I'm following up on our call last week.","follow up on I'm following up on the term sheet we sent.","circle back Let's circle back after your board meeting.","as discussed As discussed, we'll review the project timeline.","at your earliest convenience Please send the update at your earliest convenience.","look forward to I look forward to your reply.","Dear Mr. Tan, I'm following up on our call on 3 November. As discussed, could you send the revised proposal at your earliest convenience? I look forward to your reply. Best regards, Gang","Could you ...? sort out Could you help sort out ______?","1. I'm following up on the draft agreement. → the site visit / the payment schedule / the project update","2. I'm following up on ..."],"audio":["audio/70df87fd1ae5.mp3","audio/6f825358da8a.mp3","audio/c74b57e566f0.mp3","audio/a2f2abba0332.mp3","audio/a0d1ecff09a7.mp3","audio/90f09cb590bc.mp3","audio/c2aec295757c.mp3","audio/b3c9e3996577.mp3","audio/8dbd72393cd3.mp3","audio/b03db67aed18.mp3","audio/6d8ae8957482.mp3","audio/e869398b1906.mp3"]},{"id":"2026-11-05","kind":"lesson","title":"第3课｜听读｜抓要点，再转述","date":"2026-11-05","sort":"2026-11-05","html":"\u003ch1\u003e第3课｜听读｜抓要点，再转述\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 听或读一段商业内容后，能用一句英文说出要点。\u003c/p\u003e\n\u003ch2\u003e1. 今天的句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eThe main point is that ...\u003c/strong\u003e（主要意思是……） 例：The main point is that demand is rising.\u003c/p\u003e\n\u003ch2\u003e2. 5 个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"1\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eaccording to the report\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e根据报告\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eAccording to the report, costs are going up.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"2\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003estrong demand for\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e对……需求强劲\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThere is strong demand for office space in Singapore.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eraise interest rates\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e加息\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThe bank may raise interest rates next year.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ecut costs\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e削减成本\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe need to cut costs in this business.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ewatch the market closely\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e密切关注市场\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eInvestors should watch the market closely.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e3. 短文\u003c/h2\u003e\n\u003cblockquote data-block=\"6\" class=\"speak-block\"\u003e\u003cp\u003eAccording to a market update, demand for office space in Singapore is rising. Example Capital (举例公司) says rents may go up next year. Banks may also raise interest rates. Investors should watch the market closely. We look forward to the full report next week.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e（练习用虚构短文，不是真实市场数据。）\u003c/p\u003e\n\u003cp data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003e中文：\u003c/strong\u003e 根据一份市场简报，新加坡的办公空间需求正在上升。Example Capital（举例公司）表示，明年租金可能上涨。银行也可能加息。投资者应密切关注市场。我们期待下周的完整报告。\u003c/p\u003e\n\u003ch2\u003e4. 回炉（第2课）\u003c/h2\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003e选词填空：follow up on / look forward to\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003eI will ______ the contract details after the meeting.\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003eWe ______ meeting your team next week.\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e答案在最后。\u003c/p\u003e\n\u003ch2\u003e5. 听读练习：Parroto\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e打开 https://parroto.app，自己注册或登录（我不替你注册）。\u003c/li\u003e\u003cli\u003e选 \u003cstrong\u003eA2\u003c/strong\u003e 材料，先听写一句，再对照原文，标出听错的词。\u003c/li\u003e\u003cli\u003e跟读这一句 2 遍，注意连读和语调。\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e6. 开口练习\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e读完短文，用 \u003cstrong\u003eThe main point is that ...\u003c/strong\u003e 说出要点，写 2 句英文即可，文字或语音都行。\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e选做：用 \u003cstrong\u003efollow up on\u003c/strong\u003e 说一句你本周的真实工作。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠最影响理解的 1–2 个错，并给你更自然的说法。\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e回炉答案：1. follow up on；2. look forward to\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e昨日自查（SGT）：11-04 英语学习调用外部模型 1 次，约 US$0.014；昨天除早课外没有额外的 Grok Bot 工作，用量正常。\u003c/p\u003e","blocks":["The main point is that ... …… The main point is that demand is rising.","according to the report According to the report, costs are going up.","strong demand for …… There is strong demand for office space in Singapore.","raise interest rates The bank may raise interest rates next year.","cut costs We need to cut costs in this business.","watch the market closely Investors should watch the market closely.","According to a market update, demand for office space in Singapore is rising. Example Capital ( ) says rents may go up next year. Banks may also raise interest rates. Investors should watch the market closely. We look forward to the full report next week.","Example Capital","follow up on / look forward to","I will ______ the contract details after the meeting.","We ______ meeting your team next week.","https://parroto.app","The main point is that ... 2","follow up on","1. follow up on 2. look forward to","SGT 11-04 1 US$0.014 Grok Bot"],"audio":["audio/d88a6cacd8dc.mp3","audio/127af9889d9e.mp3","audio/8c022618b5d7.mp3","audio/8a8952f4e8a3.mp3","audio/a992a5e9b2c3.mp3","audio/499530b7c8eb.mp3","audio/72a3939f538e.mp3","audio/b3acf46025c9.mp3","audio/8acee487ae55.mp3","audio/817ffb010dab.mp3","audio/1b6cffe6d4e0.mp3","audio/9b7d63e87265.mp3","audio/d92421397063.mp3","audio/c087d4c2af66.mp3","audio/c927ede9670b.mp3","audio/956febf8985b.mp3"]},{"id":"2026-11-06","kind":"lesson","title":"第4课｜词汇：说清下一步要做什么","date":"2026-11-06","sort":"2026-11-06","html":"\u003ch1\u003e第4课｜词汇：说清下一步要做什么\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 用一个句型搭配5个词块，说清投资、合作或日常安排中的下一步行动。（2026-11-06 SGT｜约15分钟）\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eI need to + 动作…\u003c/strong\u003e （我需要……）\u003c/p\u003e\n\u003cp\u003e把它当作一个完整开头，后面换上不同的动作词块即可。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eI need to check the figures before the meeting.   我需要在开会前核对数据。\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eI need to confirm the time with our partner.   我需要和合作方确认时间。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5个词块\u003c/h2\u003e\n\u003cp\u003e以下均为通用场景举例，不代表你实际做过的事。练习时整块读，不拆成单词背。\u003c/p\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003echeck the figures\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e核对数据\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to check the figures in the investment report.（我需要核对投资报告中的数据。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eassess the risks\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e评估风险\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to assess the risks before investing.（我需要在投资前评估风险。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ediscuss the terms\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e商讨条款\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to discuss the terms with our partner.（我需要和合作方商讨条款。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ereview progress\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e查看进展\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to review progress on the project this week.（我需要本周查看项目进展。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003econfirm the time\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e确认时间\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to confirm the time of my appointment at the clinic in Singapore.（我需要确认在新加坡诊所的预约时间。）\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短对话或短文（注明举例）\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e举例：两位同事准备与合作方开会，人物和情境均为虚构。\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003eA: I need to check the figures before our meeting. B: I need to assess the risks too. A: I need to discuss the terms with our partner. B: I need to confirm the time with them first.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e中文：\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003eA：我需要在开会前核对数据。 B：我也需要评估风险。 A：我需要和合作方商讨条款。 B：我需要先和他们确认时间。\u003c/p\u003e\n\u003ch2\u003e回炉\u003c/h2\u003e\n\u003cul\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e第1课（11-03｜第3天回炉）：\u003c/strong\u003e 用 \u003cstrong\u003eI'd like to…\u003c/strong\u003e 口头说一个今天的需求。\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e第3课（11-05｜第1天回炉）：\u003c/strong\u003e 用 \u003cstrong\u003eThe main point is that…\u003c/strong\u003e 口头概括一条你今天关注的信息。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e错题本目前为空；练习中出现的错点会记入，并按第1、3、7、14天回炉。\u003c/p\u003e\n\u003ch2\u003e开口练习\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e替换说三句：\u003c/strong\u003e 假设你要准备一次投资会议，用 \u003cstrong\u003eI need to…\u003c/strong\u003e 分别说“核对数据”“评估风险”“商讨条款”。先看词块说，再遮住英文说一遍。\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003e联系自己的安排：\u003c/strong\u003e 选今天最可能用到的两个词块，各说一句 \u003cstrong\u003eI need to…\u003c/strong\u003e；不方便谈真实业务时，可以使用假设场景。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e文字或语音都行。你回复后，我只纠最影响理解的 1–2 个错，并给你更自然的说法。\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e昨日自查（SGT）：11-05 英语学习调用外部模型 1 次，约 US$0.019；昨天除早课外没有额外的 Grok Bot 工作，用量正常。\u003c/p\u003e","blocks":["I need to + … ……","I need to check the figures before the meeting.","I need to confirm the time with our partner.","check the figures I need to check the figures in the investment report.","assess the risks I need to assess the risks before investing.","discuss the terms I need to discuss the terms with our partner.","review progress I need to review progress on the project this week.","confirm the time I need to confirm the time of my appointment at the clinic in Singapore.","A: I need to check the figures before our meeting. B: I need to assess the risks too. A: I need to discuss the terms with our partner. B: I need to confirm the time with them first.","A B A B","1 11-03 3 I'd like to…","3 11-05 1 The main point is that…","I need to… “ ”“ ”“ ”","I need to…","SGT 11-05 1 US$0.019 Grok Bot"],"audio":["audio/d20cb4213135.mp3","audio/3fd5c3d963c9.mp3","audio/09ef864bfe4c.mp3","audio/e92dbae861dd.mp3","audio/b6c420330cf4.mp3","audio/1aa36448741a.mp3","audio/1494e3954eaa.mp3","audio/9473fdafb9f3.mp3","audio/027fbab8995a.mp3","audio/fff1c6e39f14.mp3","audio/0156ebc5b08b.mp3","audio/fff2902a72d8.mp3","audio/50dad04464ef.mp3","audio/1c099300d66c.mp3","audio/fb4bec50b2b3.mp3"]},{"id":"2026-11-07","kind":"lesson","title":"第5课｜口语日常：约时间，礼貌提议","date":"2026-11-07","sort":"2026-11-07","html":"\u003ch1\u003e第5课｜口语日常：约时间，礼貌提议\u003c/h1\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 学会用 How about we...? 轻松、礼貌地提议时间或安排。\u003c/p\u003e\n\u003ch2\u003e核心句型\u003c/h2\u003e\n\u003cp data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eHow about we + 动作/时间?\u003c/strong\u003e （中文意思：我们……怎么样？用来提议、商量安排）\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eHow about we meet on Thursday morning to go over the deal? （我们周四早上碰一下，过一遍这个项目怎么样？）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003eHow about we have lunch near Raffles Place tomorrow? （我们明天在莱佛士坊附近吃午饭怎么样？）\u003cem\u003e（地点为举例）\u003c/em\u003e\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eThat works for me.\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我这边可以。\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThursday at 10? That works for me.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eI'm tied up until...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我到……都走不开。\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI'm tied up until 3 p.m. with an investor call.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eLet me get back to you.\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e我晚点回复你。\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet me get back to you after I check my schedule.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003epush back\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e往后推、延后\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eCan we push back the meeting by an hour?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"8\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ecatch up over coffee\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e喝杯咖啡聊聊近况\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eHow about we catch up over coffee in the afternoon?\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e短对话（举例，人名为虚构）\u003c/h2\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eA（合作方 Mr. Tan，举例）：\u003c/strong\u003e Can we talk about the project today? \u003cstrong\u003eB（你）：\u003c/strong\u003e I'm tied up until 3 p.m. How about we meet at 4? \u003cstrong\u003eA：\u003c/strong\u003e Sorry, 4 is difficult. How about tomorrow morning? \u003cstrong\u003eB：\u003c/strong\u003e Let me get back to you in an hour. \u003cstrong\u003eA：\u003c/strong\u003e Sure. That works for me.\u003c/p\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e中文翻译：\u003c/strong\u003e \u003cstrong\u003eA：\u003c/strong\u003e 我们今天能聊聊项目吗？ \u003cstrong\u003eB：\u003c/strong\u003e 我到下午3点前都走不开。我们4点见怎么样？ \u003cstrong\u003eA：\u003c/strong\u003e 抱歉，4点不太方便。明天早上怎么样？ \u003cstrong\u003eB：\u003c/strong\u003e 我一小时后回复你。 \u003cstrong\u003eA：\u003c/strong\u003e 好的，我这边可以。\u003c/p\u003e\n\u003ch2\u003e回炉\u003c/h2\u003e\n\u003cul\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e第2课（第3天复习）：\u003c/strong\u003e 想一想，怎么说「我想跟进一下上次的会议」？提示：I'm following up on...\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e第4课（第1天复习）：\u003c/strong\u003e 用 I need to... 说一句：我需要确认时间。提示：confirm the time。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e开口练习\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e你的合作方想今天下午2点开会，但你到3点前都在忙。请用 \u003cstrong\u003eI'm tied up until...\u003c/strong\u003e 和 \u003cstrong\u003eHow about we...?\u003c/strong\u003e 各说一句回复他。\u003c/li\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e请用 \u003cstrong\u003eHow about we...?\u003c/strong\u003e 向一位朋友或合作方提议下周的一个时间，一起吃饭或喝咖啡（时间、地点自己定）。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e文字或语音都行。你回复后，我只纠最影响理解的 1–2 个错，并给你更自然的说法。\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e昨日自查（SGT）：11-06 英语学习调用外部模型 14 次，约 US$0.981；昨天除早课外还有多轮外部模型工作（点读 App/词义/朗读相关草稿与批量），用量偏大。反思：早课之外又反复调 draft/bulk 补 App 内容，轮次过多。整改：早课只保留 1 次 draft；点读 App 只跑 aux_build.py，不另开多轮 llm；失败只记一行原因，不手工重写脚本或连环重试。\u003c/p\u003e","blocks":["How about we...?","How about we + / ? ……","How about we meet on Thursday morning to go over the deal?","How about we have lunch near Raffles Place tomorrow?","That works for me. Thursday at 10? That works for me.","I'm tied up until... …… I'm tied up until 3 p.m. with an investor call.","Let me get back to you. Let me get back to you after I check my schedule.","push back Can we push back the meeting by an hour?","catch up over coffee How about we catch up over coffee in the afternoon?","A Mr. Tan Can we talk about the project today? B I'm tied up until 3 p.m. How about we meet at 4? A Sorry, 4 is difficult. How about tomorrow morning? B Let me get back to you in an hour. A Sure. That works for me.","A B 3 4 A 4 B A","2 3 I'm following up on...","4 1 I need to... confirm the time","2 3 I'm tied up until... How about we...?","How about we...?","SGT 11-06 14 US$0.981 App/ / draft/bulk App 1 draft App aux_build.py llm"],"audio":["audio/2c079321d61e.mp3","audio/d1aed5305c19.mp3","audio/8775ded16359.mp3","audio/e61fb838ab23.mp3","audio/f4608a10304d.mp3","audio/b01718427394.mp3","audio/01e6cb7c81bb.mp3","audio/cca0a9ba1d6a.mp3","audio/cb117225b608.mp3","audio/542c8fe1f27c.mp3","audio/dd0d883537cc.mp3","audio/36c01ac83489.mp3","audio/6074c1a4d843.mp3","audio/3b664e400720.mp3","audio/fe5ba82a415a.mp3","audio/d0a8104017ef.mp3"]},{"id":"2026-11-08","kind":"lesson","title":"第6课｜商务英语：开会表态","date":"2026-11-08","sort":"2026-11-08","html":"\u003ch1\u003e第6课｜商务英语：开会表态\u003c/h1\u003e\n\u003ch2\u003e1. 今天目标\u003c/h2\u003e\n\u003cp\u003e会议上能礼貌地说出\"我理解你的意思，但我有不同看法\"。\u003c/p\u003e\n\u003ch2\u003e2. 今日句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eI see your point, but + 你的看法.\u003c/strong\u003e 先肯定对方，再说自己的意见，语气不生硬。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eI see your point, but the timeline is too tight for us.\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eI see your point, but I'd like to run the numbers again first.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e3. 五个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eraise a concern about...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e提出对……的担忧\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI want to raise a concern about the budget.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003esee it differently\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e看法不同\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eOn the price, I see it differently.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ebe on the same page\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e想法一致\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eBefore we sign, let's make sure we're on the same page.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003erun the numbers\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e把数字算一遍\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet's run the numbers on the Johor project (举例) again.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003emove forward with...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e继续推进……\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe can move forward with the deal if the terms are clear.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e4. 场景包：开会表态3句万能句\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003eHere's where I stand.\u003c/strong\u003e（我的立场是这样的。）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eI see it a bit differently.\u003c/strong\u003e（我的看法稍有不同。）\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003eCan we agree on the next step?\u003c/strong\u003e（我们能确定下一步吗？）\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e5. 短对话\u003c/h2\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003eLim:\u003c/strong\u003e We should move forward with the project (举例) this quarter. 我们这个季度应该推进这个项目。\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003eWang:\u003c/strong\u003e I see your point, but I have a concern about the cost. 我理解你的意思，但我担心成本。\u003c/p\u003e\n\u003cp data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003eLim:\u003c/strong\u003e What worries you most? 你最担心什么？\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e\u003cstrong\u003eWang:\u003c/strong\u003e The budget is S$2 million (举例). Let's run the numbers again. 预算是200万新元（举例）。我们再算一遍数字。\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e\u003cstrong\u003eLim:\u003c/strong\u003e That works for me. Can we agree on the next step? 可以。我们能确定下一步吗？\u003c/p\u003e\n\u003ch2\u003e6. 回炉小测\u003c/h2\u003e\n\u003cp data-block=\"16\" class=\"speak-block\"\u003e\u003cstrong\u003e第5课（填空）：\u003c/strong\u003e I'm ______ until 3 p.m. Can we meet after that? \u003cstrong\u003e第3课（翻译）：\u003c/strong\u003e 这款产品的需求很强劲。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e答案：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"17\" class=\"speak-block\"\u003etied up（I'm tied up until 3 p.m.）\u003c/li\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003eThere is strong demand for this product.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e7. 开口练习\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e练习1：表达担忧\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"19\" class=\"speak-block\"\u003e跟读：I see your point, but I have a concern about the timeline.\u003c/li\u003e\u003cli data-block=\"20\" class=\"speak-block\"\u003e替换：把 timeline 换成 cost / risk / partner。\u003c/li\u003e\u003cli data-block=\"21\" class=\"speak-block\"\u003e开放问题：What is your biggest concern about a new investment?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e练习2：表达不同看法\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"22\" class=\"speak-block\"\u003e跟读：I see it a bit differently. Can we run the numbers again?\u003c/li\u003e\u003cli data-block=\"23\" class=\"speak-block\"\u003e替换：把 run the numbers again 换成 move forward / agree on the next step。\u003c/li\u003e\u003cli data-block=\"24\" class=\"speak-block\"\u003e开放问题：In a meeting, how do you say \"no\" politely?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e请用英文回复，哪怕只有两三句。你回复后，我会指出一两个最影响理解的地方，并给你更自然的说法。\u003c/p\u003e","blocks":["I see your point, but + .","I see your point, but the timeline is too tight for us.","I see your point, but I'd like to run the numbers again first.","raise a concern about... …… I want to raise a concern about the budget.","see it differently On the price, I see it differently.","be on the same page Before we sign, let's make sure we're on the same page.","run the numbers Let's run the numbers on the Johor project ( ) again.","move forward with... …… We can move forward with the deal if the terms are clear.","Here's where I stand.","I see it a bit differently.","Can we agree on the next step?","Lim: We should move forward with the project ( ) this quarter.","Wang: I see your point, but I have a concern about the cost.","Lim: What worries you most?","Wang: The budget is S$2 million ( ). Let's run the numbers again. 200","Lim: That works for me. Can we agree on the next step?","5 I'm ______ until 3 p.m. Can we meet after that? 3","tied up I'm tied up until 3 p.m.","There is strong demand for this product.","I see your point, but I have a concern about the timeline.","timeline cost / risk / partner","What is your biggest concern about a new investment?","I see it a bit differently. Can we run the numbers again?","run the numbers again move forward / agree on the next step","In a meeting, how do you say \"no\" politely?"],"audio":["audio/275a9faaf0cc.mp3","audio/2c884114310b.mp3","audio/f0067e3bb67b.mp3","audio/82b36f15e769.mp3","audio/7de0aad0223f.mp3","audio/bf9f0ed38411.mp3","audio/f26dd42d49bb.mp3","audio/77f5f3df6d37.mp3","audio/b4f60212c4dc.mp3","audio/2745cd61c6a4.mp3","audio/7eee2e7fa641.mp3","audio/65ec652a734f.mp3","audio/2550a822503a.mp3","audio/77eb521050ad.mp3","audio/214cb010a616.mp3","audio/c21ec4f23d17.mp3","audio/8260eb2c7d21.mp3","audio/b973d1023fd9.mp3","audio/3d1c0ad36b2d.mp3","audio/bed7ce12cd9d.mp3","audio/5fd243c13cf8.mp3","audio/10b68fae1b5f.mp3","audio/63483035b0b0.mp3","audio/b223fb423965.mp3","audio/1ff15d9ebb99.mp3"]},{"id":"2026-11-09","kind":"lesson","title":"第7课｜商务英语：听读（听完读完，抓住重点）","date":"2026-11-09","sort":"2026-11-09","html":"\u003ch1\u003e第7课｜商务英语：听读（听完读完，抓住重点）\u003c/h1\u003e\n\u003ch2\u003e1. 今天目标\u003c/h2\u003e\n\u003cp\u003e听完或读完一段市场、生意内容后，能用一句英文说出重点。\u003c/p\u003e\n\u003ch2\u003e2. 今日句型\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eWhat really matters is ... / The key takeaway is that ...\u003c/strong\u003e 意思是\"真正重要的是……／最重要的结论是……\"。读完听完先说这一句，对方马上知道你抓住了重点。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003eWhat really matters is the cash flow, not the headline number.\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003eThe key takeaway is that the partner wants a lower price.\u003c/li\u003e\u003c/ul\u003e\n\u003cp data-block=\"3\" class=\"speak-block\"\u003e用法：What really matters is 后面接名词或短句；The key takeaway is that 后面接一个完整的句子。\u003c/p\u003e\n\u003ch2\u003e3. 五个词块\u003c/h2\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eget the main idea\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e抓住大意\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWhen I read a market report, I first try to get the main idea.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003epick up on...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e注意到、听出（细节或语气）\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eDid you pick up on the date he mentioned in the call?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003eread between the lines\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e读出言外之意\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThe report sounds positive, but if you read between the lines, they are worried about costs.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003esum up\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e总结\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet me sum up the partner's offer in one sentence.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"8\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003ekeep track of...\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e持续跟踪、记录\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eOur target is S$500,000 (举例) this quarter, so let's keep track of sales every week.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e4. 场景包：听读后确认重点3句万能句\u003c/h2\u003e\n\u003col\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eLet me make sure I heard that right.\u003c/strong\u003e（让我确认一下我听得对不对。）\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003eWhich figure are you referring to?\u003c/strong\u003e（你说的是哪个数字？）\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003eLet me put it in one sentence.\u003c/strong\u003e（让我用一句话说一下。）\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e5. 听读短文：市场小简报\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003e（示范短文，内容为虚构，不是真实新闻）\u003c/em\u003e\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003eHere is a quick market update. Last week, some investors were worried about higher costs. The key takeaway is that customer demand is still steady. What really matters now is how fast companies can control their costs. We will keep track of the numbers and update you next week.\u003c/p\u003e\n\u003cp\u003e这是一个简短的市场更新。上周，一些投资者担心成本上升。最重要的结论是，客户需求依然稳定。现在真正重要的是，公司能多快控制住成本。我们会持续跟踪数据，下周再向你更新。\u003c/p\u003e\n\u003cp data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003eParroto 用法（约5分钟）：\u003c/strong\u003e 请你自己打开 https://parroto.app，不用我替你注册。如果页面上能选难度，就从 A2 开始。\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e先听一遍，不看文字，只抓大意（get the main idea）。\u003c/li\u003e\u003cli\u003e再看文字，读一遍，标出你没听出来的词。\u003c/li\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003e再听一遍，这次注意数字和转折词，比如 but 和 now。\u003c/li\u003e\u003cli data-block=\"16\" class=\"speak-block\"\u003e合上文字，用今天的句型说一句重点：\u003cem\u003eThe key takeaway is that ...\u003c/em\u003e\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e6. 回炉小测\u003c/h2\u003e\n\u003cp data-block=\"17\" class=\"speak-block\"\u003e\u003cstrong\u003e第4课＋第6课（填空）：\u003c/strong\u003e Before we sign, let's ______ the risks and make sure we're on the same ______.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e第2课＋第1课（翻译）：\u003c/strong\u003e 我想跟进一下上周的报告，您能再发我一次吗？\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e答案：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003eassess; page（Before we sign, let's assess the risks and make sure we're on the same page.）\u003c/li\u003e\u003cli data-block=\"19\" class=\"speak-block\"\u003eI'd like to follow up on last week's report. Could you send it again?\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e7. 开口练习\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e练习1：说出听读后的重点\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"20\" class=\"speak-block\"\u003e跟读：The key takeaway is that the market is still stable.\u003c/li\u003e\u003cli data-block=\"21\" class=\"speak-block\"\u003e替换：把 the market is still stable 换成 demand is strong / costs are rising / the timeline is tight。\u003c/li\u003e\u003cli data-block=\"22\" class=\"speak-block\"\u003e开放问题：Think about the last report or news you read. What was the key takeaway?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e练习2：说出真正重要的事\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"23\" class=\"speak-block\"\u003e跟读：What really matters is the cash flow.\u003c/li\u003e\u003cli data-block=\"24\" class=\"speak-block\"\u003e替换：把 the cash flow 换成 the terms / the risks / the timing。\u003c/li\u003e\u003cli data-block=\"25\" class=\"speak-block\"\u003e开放问题：When you look at a new investment, what really matters to you?\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e请用英文回复，哪怕只有两三句。你回复后，我会指出一两个最影响理解的地方，并给你更自然的说法。\u003c/p\u003e","blocks":["What really matters is ... / The key takeaway is that ... \" …… ……\"","What really matters is the cash flow, not the headline number.","The key takeaway is that the partner wants a lower price.","What really matters is The key takeaway is that","get the main idea When I read a market report, I first try to get the main idea.","pick up on... Did you pick up on the date he mentioned in the call?","read between the lines The report sounds positive, but if you read between the lines, they are worried about costs.","sum up Let me sum up the partner's offer in one sentence.","keep track of... Our target is S$500,000 ( ) this quarter, so let's keep track of sales every week.","Let me make sure I heard that right.","Which figure are you referring to?","Let me put it in one sentence.","Here is a quick market update. Last week, some investors were worried about higher costs. The key takeaway is that customer demand is still steady. What really matters now is how fast companies can control their costs. We will keep track of the numbers and update you next week.","Parroto 5 https://parroto.app A2","get the main idea","but now","The key takeaway is that ...","4 6 Before we sign, let's ______ the risks and make sure we're on the same ______.","assess; page Before we sign, let's assess the risks and make sure we're on the same page.","I'd like to follow up on last week's report. Could you send it again?","The key takeaway is that the market is still stable.","the market is still stable demand is strong / costs are rising / the timeline is tight","Think about the last report or news you read. What was the key takeaway?","What really matters is the cash flow.","the cash flow the terms / the risks / the timing","When you look at a new investment, what really matters to you?"],"audio":["audio/121a410c59ee.mp3","audio/c20372aa563b.mp3","audio/f9c149ed87a8.mp3","audio/26383d4837ec.mp3","audio/e7f6f4b1285d.mp3","audio/5257ee48ae12.mp3","audio/a5d72c3644c5.mp3","audio/74c15ba2e750.mp3","audio/81546286d010.mp3","audio/80b8bd80d128.mp3","audio/98303fb93046.mp3","audio/a096165a0027.mp3","audio/9df75b96ba7f.mp3","audio/9735ff4915f7.mp3","audio/2f4411831da6.mp3","audio/0ce320fc9d0f.mp3","audio/bd2753237378.mp3","audio/320d951edaa2.mp3","audio/2f31144b023d.mp3","audio/a724a0a31f4d.mp3","audio/0f256c459459.mp3","audio/e611e84e8518.mp3","audio/6b32af78781a.mp3","audio/07de6262eca2.mp3","audio/d36ed64b2779.mp3","audio/1fac3c936641.mp3"]},{"id":"2026-11-10","kind":"lesson","title":"今天的15分钟英语课（第8课·词汇）","date":"2026-11-10","sort":"2026-11-10","html":"\u003ch1\u003e今天的15分钟英语课（第8课·词汇）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型说清楚风险。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eThe main risk is ___.\u003c/strong\u003e 主要风险是…… 例：The main risk is cash flow.（主要风险是现金流。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003ekeep ... under control\u003c/strong\u003e：把……控制住 We need to keep costs under control.（我们要控制好成本。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003ecash flow\u003c/strong\u003e：现金流 Cash flow is tight this quarter.（本季度现金流紧。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eexposure to\u003c/strong\u003e：对……的风险敞口 Our exposure to one market is high.（我们对单一市场的敞口偏高。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003edownside\u003c/strong\u003e：下行风险 What's the downside of this deal?（这笔交易的下行风险是什么？）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ehold off on\u003c/strong\u003e：暂缓 Let's hold off on the new office in Singapore.（我们先暂缓新加坡办公室的事。）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: What's the main risk in this deal?（这笔交易主要风险是什么？） B: The main risk is cash flow.（主要风险是现金流。） A: Can we keep costs under control?（我们能控制成本吗？） B: Yes, but let's hold off on new hiring.（可以，但先暂缓招人。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e第1课：Could you help me sort out this schedule? No worries, I'm on my way.（能帮我理一下日程吗？没问题，我在路上。）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e第5课：How about we meet Friday? I'm tied up until 3 pm (举例), so let me get back to you.（周五见如何？我到下午3点（举例）前有事，我回头答复你。）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e第7课：Let me sum up: I picked up on one risk.（我总结一下：我注意到一个风险。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e用 \u003cstrong\u003eThe main risk is...\u003c/strong\u003e 说你现在一个项目的风险。\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e用 \u003cstrong\u003ehold off on...\u003c/strong\u003e 说一件你想暂缓的事。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 The main risk is ___. …… The main risk is cash flow.","keep ... under control …… We need to keep costs under control.","cash flow Cash flow is tight this quarter.","exposure to …… Our exposure to one market is high.","downside What's the downside of this deal?","hold off on Let's hold off on the new office in Singapore.","💬 A: What's the main risk in this deal? B: The main risk is cash flow. A: Can we keep costs under control? B: Yes, but let's hold off on new hiring.","1 Could you help me sort out this schedule? No worries, I'm on my way.","5 How about we meet Friday? I'm tied up until 3 pm ( ), so let me get back to you. 3","7 Let me sum up: I picked up on one risk.","The main risk is...","hold off on..."],"audio":["audio/cc24f429c89e.mp3","audio/ec0b052f0877.mp3","audio/0d08b7ad9296.mp3","audio/9455f8055b6a.mp3","audio/4ad7775ba6e5.mp3","audio/5e8a1982cf41.mp3","audio/3aab9a8f07e8.mp3","audio/1a60383fc901.mp3","audio/a407cf250a54.mp3","audio/d21761fbb969.mp3","audio/4eb3d4ab3d14.mp3","audio/e1cc750f3d44.mp3"]},{"id":"2026-11-11","kind":"lesson","title":"今天的15分钟英语课（第9课·口语日常）","date":"2026-11-11","sort":"2026-11-11","html":"\u003ch1\u003e今天的15分钟英语课（第9课·口语日常）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型礼貌地请别人帮个小忙。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eWould you mind ___ing?\u003c/strong\u003e 你介意……吗？／麻烦你……可以吗？ 例：Would you mind sending me the file?（麻烦你把文件发给我可以吗？） 小提示：mind 后面接动词的 -ing 形式。如果你不介意，回答 \"Not at all.\" 或 \"Sure, no problem.\"。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003erunning late\u003c/strong\u003e：晚到、要迟到 Sorry, I'm running late. I'll be there in 10 minutes (举例).（抱歉，我要晚到了，10分钟（举例）后到。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003egive me a heads-up\u003c/strong\u003e：提前跟我说一声 Please give me a heads-up if the schedule changes.（日程有变的话，请提前跟我说一声。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eswing by\u003c/strong\u003e：顺路去一下、过去坐坐 I'll swing by your office after lunch.（午饭后我顺路去你办公室一趟。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003eno rush\u003c/strong\u003e：不急 No rush. Next Monday (举例) is fine.（不急，下周一（举例）就行。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003egrab a coffee\u003c/strong\u003e：喝杯咖啡（随意地） Let's grab a coffee before the meeting.（开会前我们喝杯咖啡吧。）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: Would you mind moving the meeting to 4 pm (举例)? I'm running late.（你介意把会议改到下午4点（举例）吗？我要晚到了。） B: Not at all. Just give me a heads-up next time.（不介意。下次提前跟我说一声就行。） A: Sure, thanks. I'll swing by your office after that.（好的，谢谢。之后我顺路去你办公室。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e第2课：As discussed, I'll follow up on the contract and circle back to you on Friday (举例).（正如我们讨论过的，我会跟进合同的事，周五（举例）再回复你。）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e第6课：I want to raise a concern about the timeline, and I hope we can be on the same page even if you see it differently.（我想就时间安排提出一个担忧，即使你看法不同，也希望我们能达成一致。）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e第8课：Our exposure to one client is high and cash flow is tight, so let's hold off on new hiring.（我们对单一客户的敞口偏高，现金流也紧，所以先暂缓招人。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e用 \u003cstrong\u003eWould you mind ...ing?\u003c/strong\u003e 向别人提一个小请求（比如请助理或合作方做一件事）。\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e用 \u003cstrong\u003erunning late\u003c/strong\u003e 或 \u003cstrong\u003egive me a heads-up\u003c/strong\u003e 说一个你今天或这周的真实情况。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 Would you mind ___ing? …… …… Would you mind sending me the file? mind -ing \"Not at all.\" \"Sure, no problem.\"","running late Sorry, I'm running late. I'll be there in 10 minutes ( ). 10","give me a heads-up Please give me a heads-up if the schedule changes.","swing by I'll swing by your office after lunch.","no rush No rush. Next Monday ( ) is fine.","grab a coffee Let's grab a coffee before the meeting.","💬 A: Would you mind moving the meeting to 4 pm ( )? I'm running late. 4 B: Not at all. Just give me a heads-up next time. A: Sure, thanks. I'll swing by your office after that.","2 As discussed, I'll follow up on the contract and circle back to you on Friday ( ).","6 I want to raise a concern about the timeline, and I hope we can be on the same page even if you see it differently.","8 Our exposure to one client is high and cash flow is tight, so let's hold off on new hiring.","Would you mind ...ing?","running late give me a heads-up"],"audio":["audio/38cd6c77da09.mp3","audio/39e6d45fca2b.mp3","audio/bf810ef49b17.mp3","audio/85623296b16d.mp3","audio/b28f22aa95d7.mp3","audio/4ce600dc6352.mp3","audio/3a072eec399f.mp3","audio/c56e395f4971.mp3","audio/d9a7d4a872ef.mp3","audio/55dc7b8017ef.mp3","audio/b401b1ea414e.mp3","audio/2a4d94de3e08.mp3"]},{"id":"2026-11-12","kind":"lesson","title":"今天的15分钟英语课（第10课·商务英语）","date":"2026-11-12","sort":"2026-11-12","html":"\u003ch1\u003e今天的15分钟英语课（第10课·商务英语）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型礼貌地拒绝对方，同时给出替代方案。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eI'm afraid we can't ___, but we could ___.\u003c/strong\u003e 恐怕我们不能……，不过我们可以…… 例：I'm afraid we can't invest that much now, but we could start smaller.（恐怕我们现在不能投那么多，不过可以先从小额开始。） 小提示：I'm afraid 在这里是\"恐怕、抱歉\"的意思，语气比直接说 \"No\" 柔和得多。后面的 but we could... 是关键，先说不行，再给一个能做的选择，对方更容易接受。两处都接动词原形（can't invest / could start）。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003epass on\u003c/strong\u003e：婉拒、不参与 We'll have to pass on this deal, but thank you for thinking of us.（这个项目我们只能婉拒，但谢谢您想到我们。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003enot a good fit\u003c/strong\u003e：不太合适 This project is not a good fit for our current portfolio.（这个项目和我们目前的投资组合不太匹配。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eat this stage\u003c/strong\u003e：现阶段 We can't commit more than S$500,000 (举例) at this stage.（现阶段我们最多只能承诺50万新元（举例）。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003ekeep the door open\u003c/strong\u003e：保留以后合作的可能 We can't join this round, but let's keep the door open for the next one.（这一轮我们不能参与，但下一轮的门还开着。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003etake a rain check\u003c/strong\u003e：改天再约、下次再说 Can we take a rain check on the meeting this Friday (举例)?（周五（举例）的会可以改天再约吗？）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: Could you invest S$2 million (举例) in our new project?（你们能投200万新元（举例）到我们的新项目吗？） B: I'm afraid we can't invest that much at this stage, but we could start with S$500,000 (举例).（恐怕现阶段我们投不了这么多，不过可以先从50万新元（举例）开始。） A: I see. That's still helpful.（明白了，这样也有帮助。） B: Thanks. Let's keep the door open and talk again next quarter.（谢谢。我们保持联系，下个季度再谈。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e✨ 礼貌拒绝的3句万能句\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003eThank you for the offer. We really appreciate it.\u003c/strong\u003e（谢谢您的提议，我们很感激。）先表示感谢。\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm afraid we can't ..., but we could ...\u003c/strong\u003e（恐怕我们不能……，不过我们可以……）今天的核心句型，拒绝时给出替代方案。\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eLet's revisit this next quarter.\u003c/strong\u003e（我们下个季度再看看这件事。）把话题留到以后，关系不会僵。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e第9课：Would you mind giving me a heads-up if you're running late?（如果你要晚到，麻烦提前跟我说一声可以吗？）\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e第8课：The main risk is that cash flow is tight, so let's hold off on this deal.（主要风险是现金流紧张，所以这个项目先缓一缓。）\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e第3课：The main point is that demand is strong, so let's watch the market closely.（主要的一点是需求强劲，所以我们要密切关注市场。）\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e第1课：Could you sort this out for me? I'd like to finish it today (举例).（你能帮我处理一下吗？我想今天做完。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e想一个别人最近向你提出的要求（比如追加投资、降价、延期），用 \u003cstrong\u003eI'm afraid we can't ..., but we could ...\u003c/strong\u003e 礼貌地拒绝，并给出一个替代方案。\u003c/li\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003e可选：再加一句 \u003cstrong\u003ekeep the door open\u003c/strong\u003e 或 \u003cstrong\u003etake a rain check\u003c/strong\u003e，为以后留余地。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 I'm afraid we can't ___, but we could ___. …… …… I'm afraid we can't invest that much now, but we could start smaller. I'm afraid \" \" \"No\" but we could... can't invest / could start","pass on We'll have to pass on this deal, but thank you for thinking of us.","not a good fit This project is not a good fit for our current portfolio.","at this stage We can't commit more than S$500,000 ( ) at this stage. 50","keep the door open We can't join this round, but let's keep the door open for the next one.","take a rain check Can we take a rain check on the meeting this Friday ( )?","💬 A: Could you invest S$2 million ( ) in our new project? 200 B: I'm afraid we can't invest that much at this stage, but we could start with S$500,000 ( ). 50 A: I see. That's still helpful. B: Thanks. Let's keep the door open and talk again next quarter.","Thank you for the offer. We really appreciate it.","I'm afraid we can't ..., but we could ... …… ……","Let's revisit this next quarter.","9 Would you mind giving me a heads-up if you're running late?","8 The main risk is that cash flow is tight, so let's hold off on this deal.","3 The main point is that demand is strong, so let's watch the market closely.","1 Could you sort this out for me? I'd like to finish it today ( ).","I'm afraid we can't ..., but we could ...","keep the door open take a rain check"],"audio":["audio/7decd84e3980.mp3","audio/a2f5bd412dd2.mp3","audio/0175069923b1.mp3","audio/540b663d5e4c.mp3","audio/5308c3a61f7a.mp3","audio/b489667f3761.mp3","audio/106202e188a0.mp3","audio/940720e87870.mp3","audio/94a1718901ba.mp3","audio/353b4bcf0437.mp3","audio/c610fa1819d5.mp3","audio/84c81c526755.mp3","audio/3b69d65caa3f.mp3","audio/d52d4f3df27c.mp3","audio/f3064e25f69f.mp3","audio/1bdc13f64636.mp3"]},{"id":"2026-11-13","kind":"lesson","title":"今天的15分钟英语课（第11课·口语日常）","date":"2026-11-13","sort":"2026-11-13","html":"\u003ch1\u003e今天的15分钟英语课（第11课·口语日常）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：用一个句型礼貌地征求对方同意，比如接电话、提前离开、借东西。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eWould it be OK if I ___?\u003c/strong\u003e 我……可以吗？ 例：Would it be OK if I took a call for a minute?（我接个电话可以吗？） 小提示：if 后面用过去式（took / left / joined），但意思是现在或马上要做的事，用过去式只是让语气更客气。口语里也可以说 Do you mind if I take a call?（这里 if 后面用动词原形）。注意，对 Do you mind...? 回答 \"No, go ahead.\" 或 \"Not at all.\" 才是同意。回答 \"Sure\" 也常见，意思同样是可以。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003estep out\u003c/strong\u003e：暂时离开一下 Would it be OK if I stepped out for a few minutes?（我出去几分钟可以吗？）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003etake a call\u003c/strong\u003e：接电话 I need to take a call from my banker. Would it be OK?（我要接一个银行经理的电话，可以吗？）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003ehead out early\u003c/strong\u003e：提前走 Would it be OK if I headed out early today? I have a dinner at 6:30 (举例).（我今天提前走可以吗？我6点半（举例）有个饭局。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003eGo ahead.\u003c/strong\u003e：请便、你做吧 A: Would it be OK if I opened the window?（我开一下窗可以吗？）B: Go ahead.（请开。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ehave a quick word\u003c/strong\u003e：简短说几句 Could I have a quick word with you after the meeting?（会后我能跟您简单说几句吗？）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e A: Would it be OK if I took a call for a minute? It's my banker.（我接个电话可以吗？是我的银行经理。） B: Sure, go ahead.（当然，请。） A: Thanks. Would it be OK if I headed out early today? I have a dinner at 6:30 (举例).（谢谢。我今天提前走可以吗？我6点半（举例）有个饭局。） B: No problem. Could I have a quick word before you leave?（没问题。你走之前我能简单说几句吗？）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e第1课：I'd like to step out for a minute. Would it be OK?（我想出去一下，可以吗？）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e第3课：There's strong demand for office space in Singapore. Would it be OK if I sent you a short report?（新加坡对办公空间的需求很强。我给您发一份简短的报告可以吗？）\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e第6课：I see it differently. Would it be OK if I explained why?（我的看法不一样。我解释一下原因可以吗？）\u003c/li\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e第10课：Would it be OK if we took a rain check on lunch? I have a call at 12:30 (举例).（午饭我们改天再约可以吗？我12点半（举例）有个电话。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e想象你正在开会或见客人，用 \u003cstrong\u003eWould it be OK if I ...?\u003c/strong\u003e 写两句，分别提出两个小请求（比如接电话、提前走、拍一张白板的照片）。\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e可选：再加一句 \u003cstrong\u003eI see it differently.\u003c/strong\u003e，礼貌地表达你不同的看法，然后用 \u003cstrong\u003eWould it be OK if I ...?\u003c/strong\u003e 问对方能不能让你解释一下。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e","blocks":["📌 Would it be OK if I ___? …… Would it be OK if I took a call for a minute? if took / left / joined Do you mind if I take a call? if Do you mind...? \"No, go ahead.\" \"Not at all.\" \"Sure\"","step out Would it be OK if I stepped out for a few minutes?","take a call I need to take a call from my banker. Would it be OK?","head out early Would it be OK if I headed out early today? I have a dinner at 6:30 ( ). 6","Go ahead. A: Would it be OK if I opened the window? B: Go ahead.","have a quick word Could I have a quick word with you after the meeting?","💬 A: Would it be OK if I took a call for a minute? It's my banker. B: Sure, go ahead. A: Thanks. Would it be OK if I headed out early today? I have a dinner at 6:30 ( ). 6 B: No problem. Could I have a quick word before you leave?","1 I'd like to step out for a minute. Would it be OK?","3 There's strong demand for office space in Singapore. Would it be OK if I sent you a short report?","6 I see it differently. Would it be OK if I explained why?","10 Would it be OK if we took a rain check on lunch? I have a call at 12:30 ( ). 12","Would it be OK if I ...?","I see it differently. Would it be OK if I ...?"],"audio":["audio/9c61b96444fe.mp3","audio/7b75e5e3226e.mp3","audio/afa8287d38fb.mp3","audio/915f30e49e6d.mp3","audio/798aeec73d9d.mp3","audio/f49b5e37ec83.mp3","audio/c46b2e0519bd.mp3","audio/b08f4dc88061.mp3","audio/ec6637611f29.mp3","audio/1973466e38ae.mp3","audio/288671d0a414.mp3","audio/e46cc666d26a.mp3","audio/5febb6474c5a.mp3"]},{"id":"2026-11-14","kind":"lesson","title":"今天的15分钟英语课（第12课·听读）","date":"2026-11-14","sort":"2026-11-14","html":"\u003ch1\u003e今天的15分钟英语课（第12课·听读）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：读数据或新闻时，用一个句型说出你的判断，比如需求在回升，或者增长在放缓。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e \u003cstrong\u003eIt looks like ___. / It seems that ___.\u003c/strong\u003e 看起来……；似乎…… 例：It looks like demand is picking up.（看起来需求在回升。） 例：It seems that growth is slowing down.（似乎增长在放缓。） 小提示：后面接一个完整的句子，有主语和动词，不要说 It looks like demand picking up。这个句型表示\"根据现有信息的判断\"，不是百分之百确定，所以读数据、读新闻时很好用。It seems that 比 It looks like 稍正式一点，两个都可以。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eyear over year\u003c/strong\u003e：同比（和去年同期比） Revenue is up 8% year over year (举例).（收入同比增长8%（举例）。）\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003epick up\u003c/strong\u003e：回升、变好 It looks like demand for rental apartments is starting to pick up.（看起来租赁公寓的需求开始回升了。）\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eslow down\u003c/strong\u003e：放缓 It seems that growth is slowing down this quarter.（这个季度增长似乎在放缓。）\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003estay flat\u003c/strong\u003e：保持持平 Sales stayed flat last month at about 200 units (举例).（上个月销量基本持平，大约200件（举例）。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ea sign of\u003c/strong\u003e：……的迹象 Higher orders could be a sign of a recovery.（订单增加可能是复苏的迹象。）\u003c/li\u003e\u003c/ol\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e💬 短简报（先听，再读）\u003c/strong\u003e Here's a quick update on our Singapore business. Sales are up 6% year over year (举例), but it looks like growth is slowing down. Last month stayed flat at about 200 units (举例). It seems that some clients are waiting before they decide. That could be a sign that demand will pick up next quarter, but we need more data. （给您简单汇报一下我们新加坡业务的情况。销售额同比增长6%（举例），但看起来增长在放缓。上个月基本持平，大约200件（举例）。似乎有些客户在观望，还没决定。这可能是下个季度需求回升的迹象，但我们还需要更多数据。） \u003cem\u003e数字只是举例，不是真实数据。\u003c/em\u003e\u003c/p\u003e\n\u003cp data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003e🎧 Parroto 用法\u003c/strong\u003e（https://parroto.app，你已注册，直接登录即可） 今天从 A2 难度开始，大约10分钟：\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003e听写\u003c/strong\u003e：选一段 A2 的短材料，先不看文字，听一句写一句。听不清可以重复，最多3遍。\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003e对答案\u003c/strong\u003e：看原文，把写错或漏掉的词标出来，重点看数字和 -ing / -ed 结尾。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e跟读\u003c/strong\u003e：同一段材料，模仿语速和停顿再读一遍，不用追求完美。\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003e回到本课\u003c/strong\u003e：把上面的短简报大声读两遍，注意 year over year 和 pick up 的连读。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e 第11课（第1天）：\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003estep out：It looks like the meeting will run long. Would it be OK if I stepped out for a minute?（看起来会议会拖长。我出去一下可以吗？）\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003etake a call：It seems that my banker is calling. I need to take a call.（似乎是我的银行经理打来的。我要接个电话。）\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003ehead out early：It looks like the traffic will be bad, so I'll head out early.（看起来路上会堵，所以我提前走。）\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003eGo ahead.：A: It looks like the numbers are ready. Can I start?（看起来数字准备好了。我可以开始吗？）B: Go ahead.（请。）\u003c/li\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003ehave a quick word：Could I have a quick word? It seems that one number is off.（我能简单说几句吗？似乎有一个数字不对。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e第9课（第3天）：\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003erunning late：It looks like I'm running late. I'll be there in 15 minutes (举例).（看起来我要迟到了。我15分钟（举例）后到。）\u003c/li\u003e\u003cli data-block=\"16\" class=\"speak-block\"\u003egive me a heads-up：If it seems that the schedule will change, please give me a heads-up.（如果日程似乎要变，请提前告诉我一声。）\u003c/li\u003e\u003cli data-block=\"17\" class=\"speak-block\"\u003eswing by：I'll swing by your office after lunch.（午饭后我顺路去您办公室。）\u003c/li\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003eno rush：No rush on the report. Friday is fine.（报告不急，周五给我就行。）\u003c/li\u003e\u003cli data-block=\"19\" class=\"speak-block\"\u003egrab a coffee：Let's grab a coffee and look at the numbers.（我们喝杯咖啡，看看数字。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"20\" class=\"speak-block\"\u003e假设有这三条信息（数字为举例）：新订单比上季度增加 5%；成本持平；客户回复变慢。请用 \u003cstrong\u003eIt looks like ...\u003c/strong\u003e 或 \u003cstrong\u003eIt seems that ...\u003c/strong\u003e 写两句判断。\u003c/li\u003e\u003cli data-block=\"21\" class=\"speak-block\"\u003e可选：用你自己的一个业务或投资信息（数字可以编一个，标上\"举例\"），写一句 \u003cstrong\u003eIt looks like ...\u003c/strong\u003e，再加上 \u003cstrong\u003eyear over year\u003c/strong\u003e、\u003cstrong\u003epick up\u003c/strong\u003e、\u003cstrong\u003eslow down\u003c/strong\u003e 中的一个。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e你回复后，我只纠正一两个最影响理解的错误。\u003c/p\u003e\n\u003cp\u003e2026-11-14｜第12课｜听读｜句型｜5个词块｜待复习日(11-15, 11-17, 11-21, 11-28)\u003c/p\u003e","blocks":["📌 It looks like ___. / It seems that ___. …… …… It looks like demand is picking up. It seems that growth is slowing down. It looks like demand picking up \" \" It seems that It looks like","year over year Revenue is up 8% year over year ( ). 8%","pick up It looks like demand for rental apartments is starting to pick up.","slow down It seems that growth is slowing down this quarter.","stay flat Sales stayed flat last month at about 200 units ( ). 200","a sign of …… Higher orders could be a sign of a recovery.","💬 Here's a quick update on our Singapore business. Sales are up 6% year over year ( ), but it looks like growth is slowing down. Last month stayed flat at about 200 units ( ). It seems that some clients are waiting before they decide. That could be a sign that demand will pick up next quarter, but we need more data. 6% 200","🎧 Parroto https://parroto.app A2 10","-ing / -ed","year over year pick up","step out It looks like the meeting will run long. Would it be OK if I stepped out for a minute?","take a call It seems that my banker is calling. I need to take a call.","head out early It looks like the traffic will be bad, so I'll head out early.","Go ahead. A: It looks like the numbers are ready. Can I start? B: Go ahead.","have a quick word Could I have a quick word? It seems that one number is off.","running late It looks like I'm running late. I'll be there in 15 minutes ( ). 15","give me a heads-up If it seems that the schedule will change, please give me a heads-up.","swing by I'll swing by your office after lunch.","no rush No rush on the report. Friday is fine.","grab a coffee Let's grab a coffee and look at the numbers.","5% It looks like ... It seems that ...","\" \" It looks like ... year over year pick up slow down"],"audio":["audio/585edd6bd1ab.mp3","audio/9ebfb38c46b8.mp3","audio/4936da301413.mp3","audio/5d142e771156.mp3","audio/a4b8dbb79984.mp3","audio/0526598b26bb.mp3","audio/d088ef0c31c7.mp3","audio/21a978b1f9ca.mp3","audio/77299b54091d.mp3","audio/891c4f48facc.mp3","audio/f52b4f773c56.mp3","audio/c2e0aeda38a9.mp3","audio/e48584fec147.mp3","audio/c1e7e97be889.mp3","audio/7fbeadfb0dbd.mp3","audio/4797c5afc12c.mp3","audio/388bd4bff56d.mp3","audio/85623296b16d.mp3","audio/cd9cf93a9ed8.mp3","audio/13eb9ab942e8.mp3","audio/623507ddbe5c.mp3","audio/0a86df0b95db.mp3"]},{"id":"2026-11-15","kind":"lesson","title":"今天的15分钟英语课（第13课·商务英语：谈价格）","date":"2026-11-15","sort":"2026-11-15","html":"\u003ch1\u003e今天的15分钟英语课（第13课·商务英语：谈价格）\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003e🎯 今天目标\u003c/strong\u003e：谈采购价、服务费或项目报价时，不只说“可以便宜”，而是用一句话把\u003cstrong\u003e价格和条件一起谈\u003c/strong\u003e。\u003c/p\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e📌 今日句型\u003c/strong\u003e（2分钟） \u003cstrong\u003eWe can do ___ if ___.\u003c/strong\u003e 如果……，我们可以接受／做到……。\u003c/p\u003e\n\u003cp data-block=\"1\" class=\"speak-block\"\u003e例：We can do SGD 95 per unit (举例) if you order 100 units (举例). （如果您订100件（举例），我们可以做到每件95新元（举例）。）\u003c/p\u003e\n\u003cp data-block=\"2\" class=\"speak-block\"\u003e例：We can do a lower price if you pay upfront. （如果您预付款，我们可以给更低的价格。）\u003c/p\u003e\n\u003cp data-block=\"3\" class=\"speak-block\"\u003e小提示：\u003cstrong\u003edo 后面放价格或方案，if 后面放交换条件\u003c/strong\u003e。这样不是单方面让步，而是“您给一个条件，我们给一个优惠”。if 后面用一般现在时：\u003cstrong\u003eif you order\u003c/strong\u003e，不要说 \u003cem\u003eif you will order\u003c/em\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🧩 5个词块\u003c/strong\u003e（4分钟）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003etarget price\u003c/strong\u003e：目标价格   Our target price is SGD 95 per unit (举例). （我们的目标价格是每件95新元（举例）。）\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003eplace a bulk order\u003c/strong\u003e：下大批量订单   We can do a lower price if you place a bulk order. （如果您下大批量订单，我们可以给更低的价格。）\u003c/li\u003e\u003cli data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003epay upfront\u003c/strong\u003e：预付款   We can do SGD 900 a month (举例) if you pay upfront for the year. （如果您预付全年费用，我们可以做到每月900新元（举例）。）\u003c/li\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003epayment terms\u003c/strong\u003e：付款条件   Let's discuss the payment terms before we confirm the price. （确认价格之前，我们先谈谈付款条件。）\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003eclose the deal\u003c/strong\u003e：达成交易、敲定合作   We can close the deal today if you agree to these terms. （如果您同意这些条件，我们今天就可以敲定合作。）\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e💬 短对话\u003c/strong\u003e（3分钟，先读一遍，再扮演供应商） \u003cem\u003e场景：为新加坡的一项业务采购设备，金额和数量均为举例。\u003c/em\u003e\u003c/p\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003e采购方：\u003c/strong\u003e Your price is a little high for us. （您的价格对我们来说有点高。）\u003c/p\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e供应商：\u003c/strong\u003e We can do SGD 95 per unit (举例) if you order 100 units (举例). （如果您订100件（举例），我们可以做到每件95新元（举例）。）\u003c/p\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e采购方：\u003c/strong\u003e That works for us, and we can pay upfront. （这个方案我们可以接受，而且我们可以预付款。）\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e供应商：\u003c/strong\u003e Great. Let's confirm the payment terms and close the deal. （好，那我们确认一下付款条件，把合作敲定。）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e🔁 回炉\u003c/strong\u003e（3分钟） 第6课（第7天）：把“礼貌表达不同意见”用到谈价格里。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003eI see your point, but ... / raise a concern about\u003c/strong\u003e   I see your point, but I'd like to raise a concern about the price. （我理解您的意思，但我想就价格提一个顾虑。）\u003c/li\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e\u003cstrong\u003esee it differently / be on the same page\u003c/strong\u003e   We see it differently, but we're on the same page about quality. （我们的看法不同，但在质量上意见一致。）\u003c/li\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003e\u003cstrong\u003erun the numbers / move forward with\u003c/strong\u003e   Let's run the numbers before we move forward with this order. （推进这笔订单之前，我们先算算账。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e顺带复习第10、12课：\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"16\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm afraid we can't ..., but we could ...\u003c/strong\u003e   I'm afraid we can't lower the price, but we could offer free delivery. （恐怕我们不能降价，但可以提供免费配送。）\u003c/li\u003e\u003cli data-block=\"17\" class=\"speak-block\"\u003e\u003cstrong\u003eIt looks like ...\u003c/strong\u003e   It looks like there's room to negotiate. （看起来还有谈的空间。）\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e🗣️ 开口练习\u003c/strong\u003e（3分钟，直接用英文回复我）\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003e您是服务供应商：如果客户预付全年费用，您可以做到\u003cstrong\u003e每月900新元（举例）\u003c/strong\u003e。请用 \u003cstrong\u003eWe can do ... if ...\u003c/strong\u003e 报价。\u003c/li\u003e\u003cli\u003e换成您自己的一个业务：您愿意给什么价格或优惠？对方需要满足什么条件？用同一句型说一句。数字可编，请标“举例”。\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e您回复后，我会只纠正一两个最影响理解或谈判语气的问题。\u003c/p\u003e","blocks":["📌 2 We can do ___ if ___. …… ……","We can do SGD 95 per unit ( ) if you order 100 units ( ). 100 95","We can do a lower price if you pay upfront.","do if “ ” if if you order if you will order","target price Our target price is SGD 95 per unit ( ). 95","place a bulk order We can do a lower price if you place a bulk order.","pay upfront We can do SGD 900 a month ( ) if you pay upfront for the year. 900","payment terms Let's discuss the payment terms before we confirm the price.","close the deal We can close the deal today if you agree to these terms.","Your price is a little high for us.","We can do SGD 95 per unit ( ) if you order 100 units ( ). 100 95","That works for us, and we can pay upfront.","Great. Let's confirm the payment terms and close the deal.","I see your point, but ... / raise a concern about I see your point, but I'd like to raise a concern about the price.","see it differently / be on the same page We see it differently, but we're on the same page about quality.","run the numbers / move forward with Let's run the numbers before we move forward with this order.","I'm afraid we can't ..., but we could ... I'm afraid we can't lower the price, but we could offer free delivery.","It looks like ... It looks like there's room to negotiate.","900 We can do ... if ..."],"audio":["audio/81b938e08767.mp3","audio/ce019ccb6a34.mp3","audio/82906121c8a3.mp3","audio/ec7855911a57.mp3","audio/0676fc2783da.mp3","audio/04fbd5af4e43.mp3","audio/d334e54dc897.mp3","audio/de69ebdb8f83.mp3","audio/ea65c0fde8a6.mp3","audio/b79cd89f3920.mp3","audio/26547d3d27c1.mp3","audio/8099ba240cd9.mp3","audio/0c85ec9a7b19.mp3","audio/b7e57f0fea6a.mp3","audio/8e229d89df67.mp3","audio/a568c698b491.mp3","audio/e0e3b01f01ef.mp3","audio/6174ccc38b0b.mp3","audio/44a1be800711.mp3"]},{"id":"2026-11-16","kind":"lesson","title":"今天的15分钟英语课（第14课·词汇：投资与多业务管理）","date":"2026-11-16","sort":"2026-11-16","html":"\u003ch1\u003e今天的15分钟英语课（第14课·词汇：投资与多业务管理）\u003c/h1\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e🎯 \u003cstrong\u003e今天目标一句话\u003c/strong\u003e 用 \u003cstrong\u003eI’m responsible for ...\u003c/strong\u003e 搭配5个投资与业务词块，介绍自己负责什么。\u003c/p\u003e\n\u003ch2\u003e📌 今日句型（2分钟）\u003c/h2\u003e\n\u003ch3\u003e\u003cstrong\u003eI’m responsible for ...\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e我负责……\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e后面可以接\u003cstrong\u003e名词\u003c/strong\u003e，也可以接\u003cstrong\u003e动词-ing形式\u003c/strong\u003e。\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eI’m responsible for this project.\u003c/strong\u003e   我负责这个项目。\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003eI’m responsible for managing several businesses.\u003
