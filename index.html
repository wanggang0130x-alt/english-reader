const entries = DATA.entries;
const glossary = DATA.glossary;
const entryMap = new Map(entries.map(entry => [entry.kind + "/" + entry.id, entry]));
const main = document.getElementById("main");
const backButton = document.getElementById("back");
const speedControl = document.getElementById("speed");
const card = document.getElementById("word-card");
const synth = window.speechSynthesis;
let currentEntry = null;
let currentWord = "";
let voices = [];
let voicesInitialized = false;
let savedSpeed = "";
let toastTimer = null;
let playerToken = 0;
let player = null;
let utteranceReference = null;
let markedBlock = null;

try {
  const value = localStorage.getItem("english-reading-speed");
  if (value === "0.7" || value === "0.9") savedSpeed = value;
} catch (_) {}
speedControl.value = savedSpeed;

function notify(message) {
  const element = document.getElementById("toast");
  clearTimeout(toastTimer);
  element.textContent = message;
  element.hidden = false;
  toastTimer = setTimeout(() => { element.hidden = true; }, 2600);
}

function refreshVoices() {
  if (!synth) return;
  try { voices = synth.getVoices() || []; } catch (_) { voices = []; }
}

function initVoices() {
  // 必须由首次真实点击同步调用，不能等待 Promise 或 voiceschanged。
  if (!voicesInitialized) {
    voicesInitialized = true;
    refreshVoices();
  }
}

if (synth) {
  if (typeof synth.addEventListener === "function") {
    synth.addEventListener("voiceschanged", refreshVoices);
  } else {
    synth.onvoiceschanged = refreshVoices;
  }
}
document.addEventListener("click", initVoices, true);

function preferredVoice() {
  refreshVoices();
  const us = voices.filter(voice => voice.lang === "en-US");
  return us.find(voice => /Samantha|Alex|Google US English|Aaron|Nicky/i.test(voice.name))
    || us[0] || null;
}

function speechRate(base) {
  return savedSpeed ? Number(savedSpeed) : base;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function closeCard() {
  card.hidden = true;
  document.body.classList.remove("card-open");
}

function normalizeKey(value) {
  return value.toLowerCase().trim().replace(/\s+/g, " ");
}

function findDefinition(value) {
  const key = normalizeKey(value);
  const candidates = [];
  function add(word) {
    if (word && !candidates.includes(word)) candidates.push(word);
  }
  add(key);
  add(key.replace(/’/g, "'"));
  const seeds = candidates.slice();
  for (const seed of seeds) {
    if (/['’]s$/.test(seed)) add(seed.slice(0, -2));
    for (const suffix of ["s", "es", "ed", "ing", "ly"]) {
      if (seed.endsWith(suffix) && seed.length > suffix.length + 1) {
        const stem = seed.slice(0, -suffix.length);
        add(stem);
        if (suffix === "ed" || suffix === "ing") {
          add(stem + "e");
          if (/([a-z])\1$/.test(stem)) add(stem.slice(0, -1));
        }
        if ((suffix === "es" || suffix === "ed" || suffix === "ly") && stem.endsWith("i")) {
          add(stem.slice(0, -1) + "y");
        }
      }
    }
  }
  for (const candidate of candidates) {
    if (Object.prototype.hasOwnProperty.call(glossary, candidate)) return glossary[candidate];
  }
  return null;
}

function showCard(value) {
  currentWord = value;
  const definition = findDefinition(value);
  document.getElementById("card-word").textContent = value;
  for (const [id, field] of [["card-ipa","ipa"],["card-pos","pos"],["card-zh","zh"]]) {
    const element = document.getElementById(id);
    const text = definition ? definition[field] || "" : "";
    element.textContent = text;
    element.hidden = !text;
  }
  card.hidden = false;
  document.body.classList.add("card-open");
}

function clearBlockMark() {
  if (markedBlock) {
    markedBlock.classList.remove("playing");
    const button = markedBlock.querySelector(".play-block");
    if (button) {
      button.textContent = "▶";
      button.setAttribute("aria-label", "朗读本段");
    }
  }
  markedBlock = null;
}

function syncFullButton() {
  const button = document.getElementById("read-all");
  if (!button) return;
  if (player && player.mode === "full") {
    button.textContent = player.paused ? "▶ 继续全文朗读" : "Ⅱ 暂停全文朗读";
    button.setAttribute("aria-pressed", player.paused ? "false" : "true");
  } else {
    button.textContent = "▶ 全文朗读";
    button.setAttribute("aria-pressed", "false");
  }
}

function stopPlayback() {
  playerToken++;
  const previous = player;
  player = null;
  if (previous && previous.audio) {
    previous.audio.onended = null;
    previous.audio.onerror = null;
    previous.audio.pause();
    try { previous.audio.currentTime = 0; } catch (_) {}
    previous.audio.removeAttribute("src");
    try { previous.audio.load(); } catch (_) {}
  }
  if (synth) {
    try { synth.cancel(); } catch (_) {}
  }
  utteranceReference = null;
  clearBlockMark();
  syncFullButton();
}

function say(text, baseRate, token, onend) {
  if (!synth || typeof window.SpeechSynthesisUtterance === "undefined") {
    notify("此浏览器暂不支持系统朗读");
    if (onend) setTimeout(onend, 0);
    return;
  }
  initVoices();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = speechRate(baseRate);
  utterance.pitch = 1;
  const voice = preferredVoice();
  if (voice) utterance.voice = voice;
  utteranceReference = utterance;
  utterance.onend = () => {
    if (token !== playerToken) return;
    utteranceReference = null;
    if (onend) onend();
  };
  utterance.onerror = event => {
    if (token !== playerToken) return;
    if (event.error !== "canceled" && event.error !== "interrupted") {
      notify("系统朗读不可用，请检查设备英语语音");
    }
    if (onend) onend();
  };
  try {
    // 同步执行，保证 iPhone Safari 的第一次 speak 位于用户点击事件中。
    synth.speak(utterance);
  } catch (_) {
    notify("无法启动系统朗读");
    if (onend) onend();
  }
}

function readWord(text) {
  stopPlayback();
  say(text, 0.8, playerToken, null);
}

function markBlock(index, scroll) {
  clearBlockMark();
  const block = main.querySelector('[data-block="' + index + '"]');
  if (!block) return;
  markedBlock = block;
  block.classList.add("playing");
  const button = block.querySelector(".play-block");
  if (button) {
    button.textContent = "■";
    button.setAttribute("aria-label", "停止本段朗读");
  }
  if (scroll) {
    const rect = block.getBoundingClientRect();
    const bottomSpace = card.hidden ? 30 : card.getBoundingClientRect().height + 28;
    if (rect.top < 20 || rect.bottom > window.innerHeight - bottomSpace) {
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try {
        block.scrollIntoView({behavior:reduced ? "auto" : "smooth", block:"center"});
      } catch (_) {
        block.scrollIntoView();
      }
    }
  }
}

function finishCurrentBlock(state, token) {
  if (player !== state || token !== playerToken) return;
  state.audio = null;
  state.completed = true;
  if (state.paused) return;
  if (state.mode === "full" && state.index + 1 < currentEntry.blocks.length) {
    state.index++;
    playCurrentBlock(state, token);
  } else {
    stopPlayback();
  }
}

function playCurrentBlock(state, token) {
  if (player !== state || token !== playerToken || !currentEntry) return;
  state.completed = false;
  markBlock(state.index, state.mode === "full");
  syncFullButton();
  const text = currentEntry.blocks[state.index] || "";
  const uri = currentEntry.audio && currentEntry.audio[state.index];
  let fallbackStarted = false;

  function fallback() {
    if (player !== state || token !== playerToken || fallbackStarted) return;
    fallbackStarted = true;
    if (state.audio) {
      state.audio.onended = null;
      state.audio.onerror = null;
      state.audio.pause();
      state.audio = null;
    }
    if (!text || !/[A-Za-z]/.test(text)) {
      setTimeout(() => finishCurrentBlock(state, token), 0);
      return;
    }
    say(text, 0.85, token, () => finishCurrentBlock(state, token));
  }

  if (uri) {
    const audio = new Audio(uri);
    state.audio = audio;
    audio.preload = "auto";
    audio.playbackRate = savedSpeed ? Number(savedSpeed) : 1;
    audio.onended = () => finishCurrentBlock(state, token);
    audio.onerror = fallback;
    try {
      const result = audio.play();
      if (result && typeof result.catch === "function") result.catch(fallback);
    } catch (_) {
      fallback();
    }
  } else {
    fallback();
  }
}

function playBlock(index) {
  if (player && player.index === index && !player.paused) {
    stopPlayback();
    return;
  }
  stopPlayback();
  const state = {mode:"block", index:index, paused:false, audio:null, completed:false};
  player = state;
  playCurrentBlock(state, playerToken);
}

function toggleFullReading() {
  if (!currentEntry || !currentEntry.blocks.length) {
    notify("没有可朗读的段落");
    return;
  }
  if (player && player.mode === "full") {
    const state = player;
    if (!state.paused) {
      state.paused = true;
      if (state.audio) state.audio.pause();
      else if (synth) synth.pause();
      syncFullButton();
      return;
    }
    state.paused = false;
    if (state.completed) {
      finishCurrentBlock(state, playerToken);
    } else if (state.audio) {
      const token = playerToken;
      try {
        const result = state.audio.play();
        if (result && typeof result.catch === "function") {
          result.catch(() => {
            if (player === state && token === playerToken) {
              notify("请再点一次段落播放按钮");
              stopPlayback();
            }
          });
        }
      } catch (_) { stopPlayback(); }
    } else if (synth) {
      synth.resume();
    }
    syncFullButton();
    return;
  }
  stopPlayback();
  const state = {mode:"full", index:0, paused:false, audio:null, completed:false};
  player = state;
  playCurrentBlock(state, playerToken);
}

speedControl.addEventListener("change", () => {
  savedSpeed = speedControl.value;
  try { localStorage.setItem("english-reading-speed", savedSpeed); } catch (_) {}
  if (player && player.audio) {
    player.audio.playbackRate = savedSpeed ? Number(savedSpeed) : 1;
  } else if (player && !player.paused) {
    const mode = player.mode;
    const index = player.index;
    stopPlayback();
    const state = {mode:mode, index:index, paused:false, audio:null, completed:false};
    player = state;
    playCurrentBlock(state, playerToken);
  }
});

const englishPattern = /[A-Za-z]+(?:['’\-][A-Za-z]+)*/g;
const phraseBuckets = new Map();
for (const key of Object.keys(glossary)) {
  const words = key.match(/[A-Za-z]+(?:['’\-][A-Za-z]+)*/g);
  if (!words || words.length < 2) continue;
  // 多词短语只接受英文单词和空格，避免误匹配中文或任意正则。
  const normalized = normalizeKey(key).replace(/’/g, "'");
  if (!/^[a-z]+(?:['\-][a-z]+)*(?:\s+[a-z]+(?:['\-][a-z]+)*)+$/.test(normalized)) continue;
  const tokens = normalized.split(/\s+/);
  const bucket = phraseBuckets.get(tokens[0]) || [];
  bucket.push({tokens:tokens, key:key});
  phraseBuckets.set(tokens[0], bucket);
}
for (const bucket of phraseBuckets.values()) {
  bucket.sort((a,b) => b.tokens.length - a.tokens.length || b.key.length - a.key.length);
}

function wrappingGroups(root) {
  // 内联标签不截断分组，因此 follow <b>up</b> on 仍可整体匹配。
  // 段落/单元格/换行截断分组，短语不会跨到下一段。
  const blockTags = new Set([
    "P","DIV","SECTION","ARTICLE","BLOCKQUOTE","LI","UL","OL","TABLE",
    "THEAD","TBODY","TFOOT","TR","TD","TH","H1","H2","H3","H4","H5","H6"
  ]);
  const groups = [];
  let group = [];
  function flush() {
    if (group.length) groups.push(group);
    group = [];
  }
  function visit(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (node.nodeValue) group.push(node);
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (node.matches("button,script,style,.translation,.w,[hidden]")) {
      flush();
      return;
    }
    if (node.tagName === "BR") {
      flush();
      return;
    }
    const boundary = blockTags.has(node.tagName);
    if (boundary) flush();
    for (const child of Array.from(node.childNodes)) visit(child);
    if (boundary) flush();
  }
  visit(root);
  flush();
  return groups;
}

function wrapGroup(nodes) {
  const records = [];
  let text = "";
  for (const node of nodes) {
    records.push({node:node, start:text.length, end:text.length + node.nodeValue.length});
    text += node.nodeValue;
  }
  const words = [];
  englishPattern.lastIndex = 0;
  let match;
  while ((match = englishPattern.exec(text)) !== null) {
    words.push({
      start:match.index, end:match.index + match[0].length,
      normalized:match[0].toLowerCase().replace(/’/g, "'")
    });
  }
  const spans = [];
  let i = 0;
  while (i < words.length) {
    let found = null;
    const candidates = phraseBuckets.get(words[i].normalized) || [];
    for (const candidate of candidates) {
      if (i + candidate.tokens.length > words.length) continue;
      let matches = true;
      for (let j = 0; j < candidate.tokens.length; j++) {
        if (words[i+j].normalized !== candidate.tokens[j]) {
          matches = false;
          break;
        }
        if (j > 0 && !/^\s+$/.test(text.slice(words[i+j-1].end, words[i+j].start))) {
          matches = false;
          break;
        }
      }
      if (matches) { found = candidate; break; }
    }
    const count = found ? found.tokens.length : 1;
    const start = words[i].start;
    const end = words[i + count - 1].end;
    spans.push({start:start, end:end, phrase:!!found, value:text.slice(start,end)});
    i += count;
  }

  // 从后往前使用 Range，保持尚未处理的文本节点偏移不变。
  for (let n = spans.length - 1; n >= 0; n--) {
    const item = spans[n];
    const first = records.find(record => item.start >= record.start && item.start < record.end);
    const last = records.find(record => item.end > record.start && item.end <= record.end);
    if (!first || !last) continue;
    const range = document.createRange();
    try {
      range.setStart(first.node, item.start - first.start);
      range.setEnd(last.node, item.end - last.start);
      const span = document.createElement("span");
      span.className = item.phrase ? "w phrase" : "w";
      span.setAttribute("role", "button");
      span.setAttribute("tabindex", "0");
      span.setAttribute("aria-label", "朗读并查看释义：" + item.value);
      span.dataset.word = item.value;
      span.appendChild(range.extractContents());
      range.insertNode(span);
    } finally {
      range.detach();
    }
  }
}

function decorateBody(body) {
  for (const group of wrappingGroups(body)) wrapGroup(group);
  for (const block of body.querySelectorAll("[data-block]")) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "play-block";
    button.textContent = "▶";
    button.setAttribute("aria-label", "朗读本段");
    if (block.tagName === "TR") {
      const cell = block.querySelector("th,td");
      if (cell) cell.insertBefore(button, cell.firstChild);
    } else {
      block.insertBefore(button, block.firstChild);
    }
  }
}

function homeSection(kind, title) {
  const list = entries.filter(entry => entry.kind === kind).slice();
  list.sort((a,b) => {
    if (a.sort < b.sort) return 1;
    if (a.sort > b.sort) return -1;
    return b.id.localeCompare(a.id, undefined, {numeric:true});
  });
  let contents = '<section><h2 class="home-heading">' + title + " · " + list.length + "</h2>";
  if (!list.length) return contents + '<p class="empty">暂无' + title + "内容。</p></section>";
  contents += '<ul class="entry-list">';
  for (const entry of list) {
    const route = "#/" + kind + "/" + encodeURIComponent(entry.id);
    contents += '<li><a class="entry-link" href="' + route + '"><strong>'
      + escapeHTML(entry.title) + '</strong><span class="entry-meta">'
      + escapeHTML(entry.date) + " · " + entry.blocks.length
      + " 个朗读块</span></a></li>";
  }
  return contents + "</ul></section>";
}

function showHome() {
  currentEntry = null;
  backButton.hidden = true;
  document.title = "王总英语点读";
  main.innerHTML =
    '<p class="home-intro">点英文单词或下划线词块，立即听发音、看释义。段落左侧 ▶ 可朗读整段；阅读中的中文翻译默认收起。首次使用系统朗读时，设备需已安装英语语音。</p>'
    + homeSection("reading", "阅读")
    + homeSection("lesson", "课程");
}

function route() {
  stopPlayback();
  closeCard();
  let path;
  try { path = decodeURIComponent(location.hash.replace(/^#\/?/, "")); }
  catch (_) { path = ""; }
  const entry = entryMap.get(path);
  if (!entry) {
    showHome();
    if (path) notify("没有找到这个条目");
  } else {
    currentEntry = entry;
    backButton.hidden = false;
    document.title = entry.title + " · 王总英语点读";
    main.innerHTML = '<article><h1 class="article-title">' + escapeHTML(entry.title)
      + '</h1><div class="article-meta">' + (entry.kind === "reading" ? "阅读" : "课程")
      + " · " + escapeHTML(entry.date) + "</div>"
      + (entry.kind === "reading" ? '<div class="article-actions"><button type="button" class="action" id="read-all" aria-pressed="false">▶ 全文朗读</button></div>' : "")
      + '<div class="body" id="article-body">' + entry.html + "</div></article>";
    decorateBody(document.getElementById("article-body"));
  }
  window.scrollTo(0,0);
}

backButton.addEventListener("click", () => {
  // 首页与正文都是 hash 历史项；正文按钮始终回首页，浏览器返回仍正常工作。
  location.hash = "#/";
});
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", stopPlayback);

document.addEventListener("click", event => {
  const target = event.target instanceof Element ? event.target : event.target.parentElement;
  if (!target) return;

  const word = target.closest(".w");
  if (word && main.contains(word)) {
    event.preventDefault();
    const value = word.dataset.word || word.textContent;
    showCard(value);
    word.classList.add("word-active");
    setTimeout(() => word.classList.remove("word-active"), 1000);
    readWord(value);
    return;
  }

  if (target.closest("#card-speak")) {
    readWord(currentWord);
    return;
  }
  if (target.closest("#card-close")) {
    closeCard();
    return;
  }
  if (card.contains(target)) return;
  closeCard();

  const play = target.closest(".play-block");
  if (play) {
    event.preventDefault();
    const block = play.closest("[data-block]");
    if (block) playBlock(Number(block.dataset.block));
    return;
  }

  if (target.closest("#read-all")) {
    toggleFullReading();
    return;
  }

  const translation = target.closest(".translation-toggle");
  if (translation) {
    const panel = document.getElementById(translation.getAttribute("aria-controls"));
    if (panel) {
      panel.hidden = !panel.hidden;
      translation.setAttribute("aria-expanded", String(!panel.hidden));
      translation.textContent = panel.hidden ? "中文" : "收起中文";
    }
    return;
  }

  const reference = target.closest(".reference-link");
  if (reference) {
    event.preventDefault();
    const url = reference.dataset.url;
    notify(url ? "离线链接：" + url : "离线模式下不打开外部链接");
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeCard();
    return;
  }
  const target = event.target;
  if ((event.key === "Enter" || event.key === " ") && target instanceof Element && target.matches(".w")) {
    event.preventDefault();
    target.click();
  }
});

route();
</script>
