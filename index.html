c/strong\u003e   我负责管理几项业务。\u003c/li\u003e\u003c/ul\u003e\n\u003cp data-block=\"3\" class=\"speak-block\"\u003e💡 注意：不能说 \u003cem\u003eI’m responsible for manage ...\u003c/em\u003e，要说 \u003cstrong\u003eI’m responsible for managing ...\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003e以下例句和对话均为练习情景，不代表您的实际业务情况。\u003c/em\u003e\u003c/p\u003e\n\u003ch2\u003e🧩 5个词块（5分钟）\u003c/h2\u003e\n\u003ch3\u003e1. \u003cstrong\u003ereview the numbers\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e查看、核查财务或经营数据\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"4\" class=\"speak-block\"\u003e这里的 \u003cstrong\u003ethe numbers\u003c/strong\u003e 通常指收入、成本、利润等数据，不只是泛指“数字”。\u003c/p\u003e\n\u003cp data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003eI’m responsible for reviewing the numbers before we invest.\u003c/strong\u003e 我负责在我们投资前核查相关数据。\u003c/p\u003e\n\u003ch3\u003e2. \u003cstrong\u003eassess risk\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e评估风险\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003eWe need to assess risk before making a decision.\u003c/strong\u003e 我们需要先评估风险，再作决定。\u003c/p\u003e\n\u003ch3\u003e3. \u003cstrong\u003eallocate funds\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e分配资金\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003eI’m responsible for allocating funds to different projects.\u003c/strong\u003e 我负责给不同项目分配资金。\u003c/p\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003e💡 常用搭配：\u003cstrong\u003eallocate funds to + 项目／业务\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e4. \u003cstrong\u003emonitor performance\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e持续关注、监测表现\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e可以指投资表现，也可以指业务表现。\u003c/p\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eWe monitor the performance of each business every month.\u003c/strong\u003e 我们每个月都会监测各项业务的表现。\u003c/p\u003e\n\u003ch3\u003e5. \u003cstrong\u003emanage day-to-day operations\u003c/strong\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e管理日常运营\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003eMy partner manages day-to-day operations, and I assess risk.\u003c/strong\u003e 我的合伙人管理日常运营，我负责评估风险。\u003c/p\u003e\n\u003cp\u003e💡 \u003cstrong\u003eday-to-day\u003c/strong\u003e 在这里表示“日常的”，不是“每天都变化的”。\u003c/p\u003e\n\u003ch2\u003e💬 短对话（2分钟）\u003c/h2\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003eA: What are you responsible for?\u003c/strong\u003e 你负责哪些工作？\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003eB: I’m responsible for reviewing the numbers and allocating funds.\u003c/strong\u003e 我负责核查数据和分配资金。\u003c/p\u003e\n\u003cp data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003eA: Do you also manage day-to-day operations?\u003c/strong\u003e 你也管理日常运营吗？\u003c/p\u003e\n\u003cp data-block=\"14\" class=\"speak-block\"\u003e\u003cstrong\u003eB: No, my partner does. I assess risk and monitor performance.\u003c/strong\u003e 不，我的合伙人负责日常运营。我评估风险，并持续关注表现。\u003c/p\u003e\n\u003ch2\u003e🔁 回炉（3分钟）\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e先看中文，试着说英文，再核对。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e第11课｜第5天回顾：礼貌提出请求\u003c/h3\u003e\n\u003cul\u003e\u003cli data-block=\"15\" class=\"speak-block\"\u003e我可以出去一下，接个电话吗？   \u003cstrong\u003eWould it be OK if I step out to take a call?\u003c/strong\u003e\u003c/li\u003e\u003cli data-block=\"16\" class=\"speak-block\"\u003e可以，去吧。   \u003cstrong\u003eGo ahead.\u003c/strong\u003e\u003c/li\u003e\u003cli data-block=\"17\" class=\"speak-block\"\u003e我可以提前离开吗？   \u003cstrong\u003eWould it be OK if I head out early?\u003c/strong\u003e\u003c/li\u003e\u003cli data-block=\"18\" class=\"speak-block\"\u003e我能和你简短聊两句吗？   \u003cstrong\u003eCould I have a quick word with you?\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\n\u003cp data-block=\"19\" class=\"speak-block\"\u003e重点唤醒：\u003cstrong\u003estep out\u003c/strong\u003e 出去一下；\u003cstrong\u003etake a call\u003c/strong\u003e 接电话；\u003cstrong\u003ehead out early\u003c/strong\u003e 提前离开；\u003cstrong\u003eGo ahead\u003c/strong\u003e 可以，请便；\u003cstrong\u003ehave a quick word\u003c/strong\u003e 简短聊几句。\u003c/p\u003e\n\u003ch3\u003e第7课｜第14天回顾：理解与总结\u003c/h3\u003e\n\u003cul\u003e\u003cli data-block=\"20\" class=\"speak-block\"\u003e\u003cstrong\u003eFirst, get the main idea. Then read between the lines.\u003c/strong\u003e   先抓住大意，再理解言外之意。\u003c/li\u003e\u003cli data-block=\"21\" class=\"speak-block\"\u003e\u003cstrong\u003eLet me sum up. The key takeaway is that we need to assess risk first.\u003c/strong\u003e   我来总结一下。最重要的一点是，我们需要先评估风险。\u003c/li\u003e\u003cli data-block=\"22\" class=\"speak-block\"\u003e\u003cstrong\u003eWe need to keep track of our spending.\u003c/strong\u003e   我们需要持续掌握支出情况。\u003c/li\u003e\u003c/ul\u003e\n\u003cp data-block=\"23\" class=\"speak-block\"\u003e💡 \u003cstrong\u003ekeep track of\u003c/strong\u003e 强调持续记录、掌握情况；今天的 \u003cstrong\u003emonitor performance\u003c/strong\u003e 更强调监测表现好不好。\u003c/p\u003e\n\u003ch2\u003e🗣️ 开口练习（3分钟）\u003c/h2\u003e\n\u003ch3\u003e练习1｜介绍你的职责\u003c/h3\u003e\n\u003cp\u003e用今天的句型，说一句符合你实际情况的话：\u003c/p\u003e\n\u003cp data-block=\"24\" class=\"speak-block\"\u003e\u003cstrong\u003eI’m responsible for ______ and ______.\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"25\" class=\"speak-block\"\u003e可以从今天的词块里选两个，记得把动词改成 \u003cstrong\u003e-ing\u003c/strong\u003e： \u003cstrong\u003ereviewing / assessing / allocating / monitoring / managing\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e练习2｜区分你和团队的分工\u003c/h3\u003e\n\u003cp\u003e假设有人问：\u003c/p\u003e\n\u003cp data-block=\"26\" class=\"speak-block\"\u003e\u003cstrong\u003eDo you manage day-to-day operations?\u003c/strong\u003e 你管理日常运营吗？\u003c/p\u003e\n\u003cp\u003e用两句英文回答：先说明谁负责日常运营，再说你负责什么。可以按实际情况作答，也可以模拟一个业务场景。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e你回复后，我会只纠正一两个最影响理解的错误，并给你一个更自然、方便直接使用的版本。\u003c/strong\u003e\u003c/p\u003e","blocks":["🎯 I’m responsible for ... 5","I’m responsible for this project.","I’m responsible for managing several businesses.","💡 I’m responsible for manage ... I’m responsible for managing ...","the numbers “ ”","I’m responsible for reviewing the numbers before we invest.","We need to assess risk before making a decision.","I’m responsible for allocating funds to different projects.","💡 allocate funds to +","We monitor the performance of each business every month.","My partner manages day-to-day operations, and I assess risk.","A: What are you responsible for?","B: I’m responsible for reviewing the numbers and allocating funds.","A: Do you also manage day-to-day operations?","B: No, my partner does. I assess risk and monitor performance.","Would it be OK if I step out to take a call?","Go ahead.","Would it be OK if I head out early?","Could I have a quick word with you?","step out take a call head out early Go ahead have a quick word","First, get the main idea. Then read between the lines.","Let me sum up. The key takeaway is that we need to assess risk first.","We need to keep track of our spending.","💡 keep track of monitor performance","I’m responsible for ______ and ______.","-ing reviewing / assessing / allocating / monitoring / managing","Do you manage day-to-day operations?"],"audio":["audio/18501a134ff3.mp3","audio/1a57adcbf291.mp3","audio/d370384f188c.mp3","audio/eece52dea224.mp3","audio/8a04cde1b4a4.mp3","audio/52152982b527.mp3","audio/1b59f1f487b8.mp3","audio/4a0708903424.mp3","audio/bbdfc9c29a93.mp3","audio/4ffb7c9f9c0a.mp3","audio/7fd709374ed1.mp3","audio/4942be544f1a.mp3","audio/395811c640e1.mp3","audio/6f2755010d3b.mp3","audio/e06032d585ba.mp3","audio/5bdf5cacbd53.mp3","audio/114ab9b4c047.mp3","audio/3141082c97d4.mp3","audio/7209a67e0f67.mp3","audio/52bdd669ed23.mp3","audio/6ea186cb24ec.mp3","audio/3ca469ed2e1e.mp3","audio/ecbb6d04e88b.mp3","audio/b42ccf14344c.mp3","audio/a5e2ad86fc24.mp3","audio/b6de859a9b15.mp3","audio/47cb8218129f.mp3"]},{"id":"2026-11-17","kind":"lesson","title":"第15课｜日常口语：说说你的初步打算","date":"2026-11-17","sort":"2026-11-17","html":"\u003ch1\u003e第15课｜日常口语：说说你的初步打算\u003c/h1\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e2026年11月17日 · 周二｜15分钟｜王总 A2→B1\u003c/strong\u003e\u003c/p\u003e\n\u003ch2\u003e① 今天目标（1分钟）\u003c/h2\u003e\n\u003cp data-block=\"1\" class=\"speak-block\"\u003e用 \u003cstrong\u003eI was thinking of + 动词-ing\u003c/strong\u003e，自然地说出一个还没定下来的计划。\u003c/p\u003e\n\u003cp\u003e意思是：\u003cstrong\u003e“我在考虑……”\u003c/strong\u003e 虽然用了 \u003cem\u003ewas\u003c/em\u003e，这里通常不是强调过去，而是让语气更委婉，给自己和对方留点商量空间。\u003c/p\u003e\n\u003cblockquote data-block=\"2\" class=\"speak-block\"\u003e\u003cp\u003eI was thinking of starting small. 我在考虑先小规模试一试。\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e今天只练这一个句型。以下场景均为练习假设，不代表您的实际安排。\u003c/p\u003e\n\u003ch2\u003e② 五个词块（5分钟）\u003c/h2\u003e\n\u003cp data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003e1. reviewing the numbers｜复核数据\u003c/strong\u003e I was thinking of reviewing the numbers tonight. 我在考虑今晚复核一下数据。\u003c/p\u003e\n\u003cp data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003e2. checking the cash flow｜查看现金流情况\u003c/strong\u003e I was thinking of checking the cash flow first. 我在考虑先看看现金流情况。\u003c/p\u003e\n\u003cp data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003e3. meeting the team｜和团队碰面\u003c/strong\u003e I was thinking of meeting the team tomorrow. 我在考虑明天和团队碰个面。\u003c/p\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003e4. moving the meeting to Friday｜把会议改到周五\u003c/strong\u003e I was thinking of moving the meeting to Friday. 我在考虑把会议改到周五。\u003c/p\u003e\n\u003cp data-block=\"7\" class=\"speak-block\"\u003e\u003cstrong\u003e5. starting small｜先小规模尝试\u003c/strong\u003e I was thinking of starting small with this project. 这个项目，我在考虑先小规模试一试。\u003c/p\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003e跟读提醒：\u003c/strong\u003e先连贯说出 \u003cstrong\u003eI was thinking of\u003c/strong\u003e，再接具体打算。 注意是 \u003cstrong\u003ethinking of meeting\u003c/strong\u003e，不是 \u003cem\u003ethinking of meet\u003c/em\u003e。\u003c/p\u003e\n\u003ch2\u003e③ 四句短对话（3分钟）\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003e场景：您和同事商量一个新项目。\u003c/em\u003e\u003c/p\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003e同事：\u003c/strong\u003e What’s your plan for this project? 这个项目，您有什么打算？\u003c/p\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e您：\u003c/strong\u003e I was thinking of starting small. 我在考虑先小规模试一试。\u003c/p\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e同事：\u003c/strong\u003e What would you like to do first? 您想先做什么？\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e您：\u003c/strong\u003e I was thinking of reviewing the numbers with the team. 我在考虑先和团队一起复核数据。\u003c/p\u003e\n\u003cp\u003e读两遍：第一遍看中文理解，第二遍只看英文读出声。\u003c/p\u003e\n\u003ch2\u003e④ 轮到您开口（3分钟）\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003e练习1｜补完一句\u003c/strong\u003e 假设您想明天和团队碰面，请说：\u003c/p\u003e\n\u003cblockquote data-block=\"13\" class=\"speak-block\"\u003e\u003cp\u003eI was thinking of ________ tomorrow.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003e练习2｜换成您的真实打算\u003c/strong\u003e 这周，您在考虑做什么？工作或生活都可以，用今天的句型说一句。暂时没有真实计划，也可以用假设场景。\u003c/p\u003e\n\u003cblockquote data-block=\"14\" class=\"speak-block\"\u003e\u003cp\u003eI was thinking of …\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e您回复后，我会只挑 \u003cstrong\u003e1–2个最影响理解的错误\u003c/strong\u003e纠正，再请您重说一遍，不逐字挑错。\u003c/p\u003e\n\u003ch2\u003e⑤ 间隔回炉（3分钟）\u003c/h2\u003e\n\u003cp\u003e每组只做一个小题，不必把所有词都用上；卡住时看提示。\u003c/p\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e\u003cstrong\u003e隔14天｜回炉第1课\u003c/strong\u003e 词块：\u003cstrong\u003eI’d like to\u003c/strong\u003e（我想……）／\u003cstrong\u003eCould you\u003c/strong\u003e（能请您……吗）／\u003cstrong\u003esort out\u003c/strong\u003e（处理好）／\u003cstrong\u003eon my way\u003c/strong\u003e（在路上）／\u003cstrong\u003eno worries\u003c/strong\u003e（没问题、别客气）\u003c/p\u003e\n\u003cp data-block=\"16\" class=\"speak-block\"\u003e小题：用 \u003cstrong\u003eCould you + sort out\u003c/strong\u003e 说：“能请您处理一下这个问题吗？”\u003c/p\u003e\n\u003cp data-block=\"17\" class=\"speak-block\"\u003e\u003cstrong\u003e隔7天｜回炉第8课\u003c/strong\u003e 词块：\u003cstrong\u003ekeep … under control\u003c/strong\u003e（控制住……）／\u003cstrong\u003ecash flow\u003c/strong\u003e（现金流）／\u003cstrong\u003eexposure to\u003c/strong\u003e（对……的风险敞口）／\u003cstrong\u003edownside\u003c/strong\u003e（下行风险、不利面）／\u003cstrong\u003ehold off on\u003c/strong\u003e（暂缓……）\u003c/p\u003e\n\u003cp data-block=\"18\" class=\"speak-block\"\u003e小题：用 \u003cstrong\u003ehold off on\u003c/strong\u003e 说：“我们先暂缓这笔投资吧。”\u003c/p\u003e\n\u003cp data-block=\"19\" class=\"speak-block\"\u003e\u003cstrong\u003e隔3天｜回炉第12课\u003c/strong\u003e 词块：\u003cstrong\u003eyear over year\u003c/strong\u003e（同比）／\u003cstrong\u003epick up\u003c/strong\u003e（回升、好转）／\u003cstrong\u003eslow down\u003c/strong\u003e（放缓）／\u003cstrong\u003estay flat\u003c/strong\u003e（保持不变）／\u003cstrong\u003ea sign of\u003c/strong\u003e（……的迹象）\u003c/p\u003e\n\u003cp data-block=\"20\" class=\"speak-block\"\u003e小题：假设销售额同比没有变化，补空： Sales stayed flat ________.\u003c/p\u003e\n\u003cp data-block=\"21\" class=\"speak-block\"\u003e\u003cstrong\u003e隔1天｜回炉第14课\u003c/strong\u003e 词块：\u003cstrong\u003ereview the numbers\u003c/strong\u003e（复核数据）／\u003cstrong\u003eassess risk\u003c/strong\u003e（评估风险）／\u003cstrong\u003eallocate funds\u003c/strong\u003e（分配资金）／\u003cstrong\u003emonitor performance\u003c/strong\u003e（跟踪表现）／\u003cstrong\u003emanage day-to-day operations\u003c/strong\u003e（管理日常运营）\u003c/p\u003e\n\u003cp\u003e小题：用今天的句型说：“我在考虑先评估一下风险。”\u003c/p\u003e\n\u003cp\u003e---\u003c/p\u003e","blocks":["2026 11 17 · 15 A2→B1","I was thinking of + -ing","I was thinking of starting small.","1. reviewing the numbers I was thinking of reviewing the numbers tonight.","2. checking the cash flow I was thinking of checking the cash flow first.","3. meeting the team I was thinking of meeting the team tomorrow.","4. moving the meeting to Friday I was thinking of moving the meeting to Friday.","5. starting small I was thinking of starting small with this project.","I was thinking of thinking of meeting thinking of meet","What’s your plan for this project?","I was thinking of starting small.","What would you like to do first?","I was thinking of reviewing the numbers with the team.","I was thinking of ________ tomorrow.","I was thinking of …","14 1 I’d like to …… Could you …… sort out on my way no worries","Could you + sort out “ ”","7 8 keep … under control …… cash flow exposure to …… downside hold off on ……","hold off on “ ”","3 12 year over year pick up slow down stay flat a sign of ……","Sales stayed flat ________.","1 14 review the numbers assess risk allocate funds monitor performance manage day-to-day operations"],"audio":["audio/1d7b8074e093.mp3","audio/e1228421e37e.mp3","audio/120b6d809268.mp3","audio/18149e7b12c2.mp3","audio/0e527dfa1d50.mp3","audio/ab5010b59c5f.mp3","audio/d40222308a0a.mp3","audio/bad588a50ea7.mp3","audio/0675e3a0dc80.mp3","audio/0d474d182b1e.mp3","audio/120b6d809268.mp3","audio/de0213eebc37.mp3","audio/df86355a8c02.mp3","audio/9232d2e2da1e.mp3","audio/a0f29202d9ec.mp3","audio/39fa7d9a9f4b.mp3","audio/0acfe1dd20ec.mp3","audio/f797fee79f6b.mp3","audio/4cf9a99a3ecc.mp3","audio/96269f6a5a9b.mp3","audio/017e7fa9e0d8.mp3","audio/3b536243e8e9.mp3"]},{"id":"2026-11-18","kind":"lesson","title":"2026-11-18","date":"2026-11-18","sort":"2026-11-18","html":"\u003ch2\u003e第16课｜商务邮件：开头与结尾\u003c/h2\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e2026-11-18（周三）｜15分钟｜王总 · A2→B1\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e能用一句话说明来意，再用一句话请对方回复。 今天只练“开头＋结尾”这套框架，不扩展新句型。以下情境均为练习假设。\u003c/p\u003e\n\u003ch3\u003e① 5个词块｜4分钟\u003c/h3\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eThank you for the update.\u003c/strong\u003e 谢谢更新。   \u003cem\u003eThank you for the update on the investment.\u003c/em\u003e 谢谢提供投资项目的最新情况。\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003eThank you for your time.\u003c/strong\u003e 感谢您抽出时间。   \u003cem\u003eThank you for your time today.\u003c/em\u003e 感谢您今天抽空。\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm writing to confirm ...\u003c/strong\u003e 我写信是想确认……   \u003cem\u003eI'm writing to confirm our meeting time.\u003c/em\u003e 我写信确认我们的会议时间。\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003eI'm writing to discuss ...\u003c/strong\u003e 我写信是想讨论……   \u003cem\u003eI'm writing to discuss the payment terms.\u003c/em\u003e 我写信想讨论付款条件。\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ePlease let me know if ...\u003c/strong\u003e 如果……，请告诉我。   \u003cem\u003ePlease let me know if you need the cash flow report.\u003c/em\u003e 如果您需要现金流报告，请告诉我。\u003c/li\u003e\u003c/ol\u003e\n\u003ch3\u003e② 短邮件＋3句万能句｜4分钟\u003c/h3\u003e\n\u003cblockquote data-block=\"6\" class=\"speak-block\"\u003e\u003cp\u003eThank you for the update. I'm writing to confirm our meeting on Friday. Please let me know if 10 a.m. works for you.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e谢谢更新。我写信确认我们周五的会议。请告诉我上午10点是否方便。（时间为举例）\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e可直接套用：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e致谢开头：\u003cstrong\u003eThank you for + 名词／动词-ing.\u003c/strong\u003e\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e来意开头：\u003cstrong\u003eI'm writing to + 动词原形.\u003c/strong\u003e\u003c/li\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e礼貌结尾：\u003cstrong\u003ePlease let me know if + 完整句子.\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e一封短邮件可选一种开头，也可先致谢、再说明来意。\u003c/p\u003e\n\u003ch3\u003e③ 开口练习｜3分钟\u003c/h3\u003e\n\u003cp\u003e用英语说两句： “我写信想讨论付款条件。如果您需要更多信息，请告诉我。”\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e您回复后，我会只纠正1–2处最影响理解的错误，再请您重说一遍。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e④ 回炉区：先答再看｜4分钟\u003c/h3\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e第1天回炉｜第15课\u003c/strong\u003e “我在考虑核对一下数字。” 答：\u003cstrong\u003eI was thinking of reviewing the numbers.\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e第3天回炉｜第13课\u003c/strong\u003e “如果您预付款，我们可以按目标价成交。” 答：\u003cstrong\u003eWe can do the deal at your target price if you pay upfront.\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e第7天回炉｜第9课\u003c/strong\u003e “如果您要迟到，可以提前告诉我一声吗？” 答：\u003cstrong\u003eWould you mind giving me a heads-up if you're running late?\u003c/strong\u003e\u003c/p\u003e\n\u003cp data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003e第14天回炉｜第2课\u003c/strong\u003e “我写信跟进一下我们讨论过的付款条件。” 答：\u003cstrong\u003eI'm following up on the payment terms we discussed.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e错题本：\u003c/strong\u003e目前为空。\u003c/p\u003e","blocks":["2026-11-18 15 · A2→B1","Thank you for the update. Thank you for the update on the investment.","Thank you for your time. Thank you for your time today.","I'm writing to confirm ... …… I'm writing to confirm our meeting time.","I'm writing to discuss ... …… I'm writing to discuss the payment terms.","Please let me know if ... …… Please let me know if you need the cash flow report.","Thank you for the update. I'm writing to confirm our meeting on Friday. Please let me know if 10 a.m. works for you.","Thank you for + -ing.","I'm writing to + .","Please let me know if + .","1 15 “ ” I was thinking of reviewing the numbers.","3 13 “ ” We can do the deal at your target price if you pay upfront.","7 9 “ ” Would you mind giving me a heads-up if you're running late?","14 2 “ ” I'm following up on the payment terms we discussed."],"audio":["audio/3681706b3b80.mp3","audio/fedfee9eb71d.mp3","audio/2a67202c9d9e.mp3","audio/ae400e49b088.mp3","audio/1c9dd721e239.mp3","audio/6080550d63c8.mp3","audio/830dfc8440b9.mp3","audio/b8ea77ad9dac.mp3","audio/e1b732c1dfc1.mp3","audio/074c8058c0ba.mp3","audio/8211e578fa7f.mp3","audio/4593dd177f47.mp3","audio/98aa70c6520e.mp3","audio/cbc9e422e7b9.mp3"]},{"id":"2026-11-19","kind":"lesson","title":"王总｜第17课：听读商务更新","date":"2026-11-19","sort":"2026-11-19","html":"\u003ch1\u003e王总｜第17课：听读商务更新\u003c/h1\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e2026-11-19｜听读日｜A2 → B1｜15分钟\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 听完并读懂一则简短的商务更新后，用一句英文复述最重要的信息。\u003c/p\u003e\n\u003ch2\u003e1｜今天只练一个句型（2分钟）\u003c/h2\u003e\n\u003cp data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eThe [信息来源] says that [关键信息].\u003c/strong\u003e 意思是：“这份……说／提到……” 听完一段录音或读完一份报告，用它转述重点，不必逐字复述。\u003c/p\u003e\n\u003cp data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003eThe update says that costs are higher than expected.\u003c/strong\u003e 这则更新提到，成本高于预期。\u003c/p\u003e\n\u003ch2\u003e2｜5个商务词块（3分钟）\u003c/h2\u003e\n\u003cp\u003e以下例句和短文均为虚构练习，不代表你的实际业务情况。\u003c/p\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文词块\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e商务例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003eweekly update\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e每周简报\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThe weekly update is ready. 每周简报准备好了。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003esales figures\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e销售数据\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eThe sales figures are in the report. 销售数据在报告里。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003ehigher than expected\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e高于预期\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eDelivery costs are higher than expected. 配送成本高于预期。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003echeck with the supplier\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e跟供应商确认\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe need to check with the supplier before we pay. 付款前，我们需要跟供应商确认一下。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003ehold off on the order\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e暂缓下单\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet’s hold off on the order until Monday. 我们先不下单，等到周一再说。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e3｜先听，再读（3分钟）\u003c/h2\u003e\n\u003cp\u003e先不看原文，用手机的英文朗读功能听一遍，只抓两个信息：\u003cstrong\u003e哪项成本出了变化？团队决定先不做什么？\u003c/strong\u003e 再看原文核对。\u003c/p\u003e\n\u003cblockquote data-block=\"8\" class=\"speak-block\"\u003e\u003cp\u003eThis is the weekly update for our online store. The sales figures look good, but delivery costs are higher than expected. The team will check with the supplier on Friday. For now, the team will hold off on the order.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003e这是我们网店的每周简报。销售数据不错，但配送成本高于预期。团队会在周五跟供应商确认。眼下，团队会暂缓下单。\u003c/p\u003e\n\u003ch2\u003e4｜Parroto：A2听写＋跟读（3分钟）\u003c/h2\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e打开 \u003ca class=\"reference-link\" href=\"#\" data-url=\"https://parroto.app\" title=\"https://parroto.app\"\u003eParroto\u003c/a\u003e，从 \u003cstrong\u003eA2\u003c/strong\u003e 难度开始，选一段短音频。若页面没有标注级别，就选语速较慢、每句较短的材料。如需账号，由你自行注册。\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003e听写：\u003c/strong\u003e 只听一句，先写下听到的关键词；再听一遍，补全句子。如果有原文，最后再对照。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e跟读：\u003c/strong\u003e 用同一句，听完暂停，跟读两遍。第一遍读清楚，第二遍尽量跟上原音的停顿和重音。\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003e5｜开口练习（2分钟）\u003c/h2\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e合上原文，用 \u003cstrong\u003eThe update says that ...\u003c/strong\u003e 开头，一句话告诉同事：\u003cstrong\u003e团队接下来会暂缓什么？\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e回复语音或发出你刚才说的英文句子。我会帮你纠正措辞和语法；如果发语音，我也会指出需要调整的发音或重音。\u003c/p\u003e\n\u003ch2\u003e6｜回炉快答（2分钟）\u003c/h2\u003e\n\u003cul\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e第10课｜第7天：\u003c/strong\u003e 一个项目目前不合适，你想礼貌婉拒，但保留以后合作的机会。你会怎么用 \u003cstrong\u003epass on / not a good fit / at this stage / keep the door open / take a rain check\u003c/strong\u003e 中的两个词块表达？\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e第14课｜第3天：\u003c/strong\u003e 决定是否为新项目拨款前，你要先看数据、评估风险。\u003cstrong\u003ereview the numbers\u003c/strong\u003e 和 \u003cstrong\u003eassess risk\u003c/strong\u003e 哪个对应哪个动作？\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003e第16课｜第1天：\u003c/strong\u003e 你已收到供应商的新报价，现在要回邮件确认收到了。\u003cstrong\u003eThank you for the update / I’m writing to confirm... / Please let me know if...\u003c/strong\u003e 中，哪一个最直接表达“我写信是为了确认……”？\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e错题本：\u003c/strong\u003e 暂无错点。\u003c/p\u003e","blocks":["2026-11-19 A2 → B1 15","The [ ] says that [ ]. “ …… ……”","The update says that costs are higher than expected.","weekly update The weekly update is ready.","sales figures The sales figures are in the report.","higher than expected Delivery costs are higher than expected.","check with the supplier We need to check with the supplier before we pay.","hold off on the order Let’s hold off on the order until Monday.","This is the weekly update for our online store. The sales figures look good, but delivery costs are higher than expected. The team will check with the supplier on Friday. For now, the team will hold off on the order.","Parroto A2","The update says that ...","10 7 pass on / not a good fit / at this stage / keep the door open / take a rain check","14 3 review the numbers assess risk","16 1 Thank you for the update / I’m writing to confirm... / Please let me know if... “ ……”"],"audio":["audio/0a1ab6f85c0a.mp3","audio/e1e5f712f2c6.mp3","audio/1e8394fc88e9.mp3","audio/02c39ebcd750.mp3","audio/5839db4d940f.mp3","audio/49516dd52df5.mp3","audio/9a5e3db0fec5.mp3","audio/bbcf338a71de.mp3","audio/267043271f31.mp3","audio/55b92562ad10.mp3","audio/6f53edd210bb.mp3","audio/9ed64d308835.mp3","audio/ad84b4d16210.mp3","audio/a6b639bb8c0e.mp3"]},{"id":"2026-11-20","kind":"lesson","title":"王总｜第18课：决策与跟进核心词汇","date":"2026-11-20","sort":"2026-11-20","html":"\u003ch1\u003e王总｜第18课：决策与跟进核心词汇\u003c/h1\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003e2026-11-20｜词汇日｜A2 → B1｜15分钟\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e今天目标：\u003c/strong\u003e 掌握5个“决策与跟进”相关的商务词汇，并能用一句英文表达投资或业务决策的前提条件。\u003c/p\u003e\n\u003ch2\u003e1｜今天只练一个句型（2分钟）\u003c/h2\u003e\n\u003cp data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003eIt depends on [前提条件].\u003c/strong\u003e 意思是：“这取决于……” 在投资或业务中，当你不能马上给出绝对的“是”或“否”，需要根据某个条件来判断时，这个句型非常实用。\u003c/p\u003e\n\u003cp data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003eIt depends on the new data.\u003c/strong\u003e 这取决于新数据。\u003c/p\u003e\n\u003ch2\u003e2｜5个商务词块（3分钟）\u003c/h2\u003e\n\u003cp\u003e这些词块常用于判断风险、决定是否下单或投资的场景。\u003c/p\u003e\n\u003cdiv class=\"table-scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\n\u003cth style=\"text-align:left\"\u003e英文词块\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e中文\u003c/th\u003e\n\u003cth style=\"text-align:left\"\u003e商务例句\u003c/th\u003e\n\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr data-block=\"3\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003emake a move\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e采取行动 / 出手\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe are not ready to make a move yet. 我们还没准备好出手。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"4\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003ewait and see\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e观望\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eLet's wait and see for another week. 我们再观望一周吧。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"5\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003elook into the details\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e研究细节 / 调查\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI need to look into the details first. 我需要先研究一下细节。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"6\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003emove forward with the deal\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e推进交易 / 推进合作\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eWe decided to move forward with the deal. 我们决定推进这笔交易。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr data-block=\"7\" class=\"speak-block\"\u003e\n\u003ctd style=\"text-align:left\"\u003e\u003cstrong\u003eget back to you\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003e给你回复\u003c/td\u003e\n\u003ctd style=\"text-align:left\"\u003eI will get back to you tomorrow. 我明天给你回复。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e3｜短对话：决定是否出手（3分钟）\u003c/h2\u003e\n\u003cp\u003e试着朗读以下对话，体会今天词汇和句型的实际用法：\u003c/p\u003e\n\u003cp data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003eA: Are we going to move forward with the deal?\u003c/strong\u003e 我们要推进这笔交易吗？\u003c/p\u003e\n\u003cp data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003eB: It depends on the new data. I need to look into the details.\u003c/strong\u003e 这取决于新数据。我需要研究一下细节。\u003c/p\u003e\n\u003cp data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003eA: Should we make a move now?\u003c/strong\u003e 我们现在该出手吗？\u003c/p\u003e\n\u003cp data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003eB: No, let's wait and see. I'll get back to you on Friday.\u003c/strong\u003e 不，先观望一下。我周五给你回复。\u003c/p\u003e\n\u003ch2\u003e4｜回炉快答（4分钟）\u003c/h2\u003e\n\u003cp\u003e今天是以下内容的复习日，请试着在脑海中快速拼出答案：\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e第11课｜第7天：\u003c/strong\u003e 假设你要提早下班（\u003cstrong\u003ehead out early\u003c/strong\u003e），并且现在需要出去接个电话（\u003cstrong\u003estep out / take a call\u003c/strong\u003e）。同事正好说想找你简单聊两句（\u003cstrong\u003ehave a quick word\u003c/strong\u003e），你让他直接说（\u003cstrong\u003eGo ahead.\u003c/strong\u003e），你会怎么把这几个动作串起来表达？\u003c/li\u003e\u003cli data-block=\"13\" class=\"speak-block\"\u003e\u003cstrong\u003e第15课｜第3天：\u003c/strong\u003e 你正考虑在新加坡投资一个新业务，用 \u003cstrong\u003eI was thinking of ...ing\u003c/strong\u003e 该怎么开头？（提示：investing in...）\u003c/li\u003e\u003cli data-block=\"14\" class=\"speak-block\"\u003e\u003cstrong\u003e第17课｜第1天：\u003c/strong\u003e 昨天的听读中，简报提到成本变高了，团队决定暂缓下单。请用 \u003cstrong\u003eThe update says that...\u003c/strong\u003e 转述简报内容，并用 \u003cstrong\u003ehold off on the order\u003c/strong\u003e 表达暂缓下单。\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5｜开口练习（3分钟）\u003c/h2\u003e\n\u003cp data-block=\"15\" class=\"speak-block\"\u003e假设我向你推荐了一个新加坡的投资项目，我问你： \u003cem\u003e\"When will you make a move on this project?\"\u003c/em\u003e (你打算什么时候在这个项目上出手？)\u003c/p\u003e\n\u003cp data-block=\"16\" class=\"speak-block\"\u003e请结合今天的句型和词汇回复我。 \u003cstrong\u003e参考思路：\u003c/strong\u003e “这取决于（It depends on...）市场反馈，我需要先观望一下（wait and see）。”\u003c/p\u003e\n\u003cp\u003e发语音或文字回复你的英文句子。我会重点挑出一两个最影响理解的语法或发音错误进行纠正，不用担心犯错，大胆开口！\u003c/p\u003e\n\u003cp\u003e--- \u003cstrong\u003e错题本：\u003c/strong\u003e 暂无记录。\u003c/p\u003e","blocks":["2026-11-20 A2 → B1 15","It depends on [ ]. “ ……” “ ” “ ”","It depends on the new data.","make a move / We are not ready to make a move yet.","wait and see Let's wait and see for another week.","look into the details / I need to look into the details first.","move forward with the deal / We decided to move forward with the deal.","get back to you I will get back to you tomorrow.","A: Are we going to move forward with the deal?","B: It depends on the new data. I need to look into the details.","A: Should we make a move now?","B: No, let's wait and see. I'll get back to you on Friday.","11 7 head out early step out / take a call have a quick word Go ahead.","15 3 I was thinking of ...ing investing in...","17 1 The update says that... hold off on the order","\"When will you make a move on this project?\" ( )","“ It depends on... wait and see ”"],"audio":["audio/d09b6e6b3c2f.mp3","audio/d16f944d4722.mp3","audio/eb3275c9a027.mp3","audio/9b2fa520f837.mp3","audio/eb6ab75eba1f.mp3","audio/8a6891f03b2d.mp3","audio/a23c0bbd1ce6.mp3","audio/7c709038ae48.mp3","audio/2f69f3bc3b31.mp3","audio/0466d4b826ab.mp3","audio/945f48507908.mp3","audio/18b905b4c45b.mp3","audio/c66078366bf1.mp3","audio/a13bd0c8ebe2.mp3","audio/3b267470f931.mp3","audio/a18ae1668fac.mp3","audio/c430e21dcc0f.mp3"]},{"id":"2026-11-21","kind":"lesson","title":"2026-11-21","date":"2026-11-21","sort":"2026-11-21","html":"\u003cp\u003e\u003cstrong\u003e今日目标：\u003c/strong\u003e 掌握一个地道提议句型并积累5个高频口语词块，搞定轻松的商务邀约与日常提议。\u003c/p\u003e\n\u003ch3\u003e1. 核心迁移句型\u003c/h3\u003e\n\u003cp data-block=\"0\" class=\"speak-block\"\u003e\u003cstrong\u003eWhy don't we + 动词原形...?\u003c/strong\u003e （不如我们……？/ 我们为什么不……？） \u003cem\u003e用法解析：\u003c/em\u003e 在口语中，当你想要提出建议或邀约时，这个句型比直接说 \"Let's...\" 更加委婉、有商量的余地，非常适合在新加坡跟合作伙伴或朋友轻松沟通。\u003c/p\u003e\n\u003ch3\u003e2. 核心词块 (5个)\u003c/h3\u003e\n\u003col\u003e\u003cli data-block=\"1\" class=\"speak-block\"\u003e\u003cstrong\u003egrab a coffee\u003c/strong\u003e：喝杯咖啡（口语中非常常用的约见理由）\u003cul\u003e\u003cli\u003e\u003cem\u003e例句：\u003c/em\u003e Why don't we \u003cstrong\u003egrab a coffee\u003c/strong\u003e at Marina Bay Sands (\u003cem\u003e举例地名\u003c/em\u003e) this afternoon? (不如我们今天下午去滨海湾金沙喝杯咖啡？)\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli data-block=\"2\" class=\"speak-block\"\u003e\u003cstrong\u003ecatch up on\u003c/strong\u003e：交流/了解...的最新情况（老朋友或工作伙伴叙旧、同步信息）\u003cul\u003e\u003cli\u003e\u003cem\u003e例句：\u003c/em\u003e Let's \u003cstrong\u003ecatch up on\u003c/strong\u003e the new tech project. (我们交流一下那个新科技项目的最新进展吧。)\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli data-block=\"3\" class=\"speak-block\"\u003e\u003cstrong\u003ego over the numbers\u003c/strong\u003e：过一遍数据/看一看财务状况\u003cul\u003e\u003cli\u003e\u003cem\u003e例句：\u003c/em\u003e Why don't we \u003cstrong\u003ego over the numbers\u003c/strong\u003e before making a decision? (不如我们在做决定前先过一遍数据？)\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli data-block=\"4\" class=\"speak-block\"\u003e\u003cstrong\u003erun an idea by you\u003c/strong\u003e：跟你说个想法（让你参谋参谋/听听你的意见）\u003cul\u003e\u003cli\u003e\u003cem\u003e例句：\u003c/em\u003e I want to \u003cstrong\u003erun an investment idea by you\u003c/strong\u003e. (我想跟你说个投资的想法，让你参谋参谋。)\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli data-block=\"5\" class=\"speak-block\"\u003e\u003cstrong\u003ecall it a day\u003c/strong\u003e：今天就到这里 / 收工（开会或工作结束时常用）\u003cul\u003e\u003cli\u003e\u003cem\u003e例句：\u003c/em\u003e It's getting late. Why don't we \u003cstrong\u003ecall it a day\u003c/strong\u003e? (时间不早了。不如我们今天就先到这里？)\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ol\u003e\n\u003ch3\u003e3. 实战短对话\u003c/h3\u003e\n\u003cp data-block=\"6\" class=\"speak-block\"\u003e\u003cstrong\u003eA:\u003c/strong\u003e Gang, I want to \u003cstrong\u003erun a new investment idea by you\u003c/strong\u003e. \u003cem\u003e(Gang，我想跟你说个新的投资想法，让你参谋参谋。)\u003c/em\u003e \u003cstrong\u003eB:\u003c/strong\u003e Sounds good. \u003cstrong\u003eWhy don't we grab a coffee\u003c/strong\u003e and \u003cstrong\u003ego over the numbers\u003c/strong\u003e? \u003cem\u003e(听起来不错。不如我们去喝杯咖啡，顺便过一遍数据？)\u003c/em\u003e \u003cstrong\u003eA:\u003c/strong\u003e Great. Let's meet on Thursday at 3 PM (\u003cem\u003e举例时间\u003c/em\u003e). \u003cem\u003e(太好了。我们周四下午3点见吧。)\u003c/em\u003e \u003cstrong\u003eB:\u003c/strong\u003e Perfect. See you then. \u003cem\u003e(完美。到时候见。)\u003c/em\u003e\u003c/p\u003e\n\u003ch3\u003e4. 开口练习\u003c/h3\u003e\n\u003cp\u003e\u003cem\u003e(请按步骤完成并发语音给我。收到你的回复后，我只会纠正一两个最影响理解的错误，不用担心犯错，大胆开口！)\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e步骤一：模仿与替换\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"7\" class=\"speak-block\"\u003e原句：Why don't we \u003cstrong\u003egrab a coffee\u003c/strong\u003e and \u003cstrong\u003ego over the numbers\u003c/strong\u003e?\u003c/li\u003e\u003cli data-block=\"8\" class=\"speak-block\"\u003e\u003cstrong\u003e请替换：\u003c/strong\u003e 请把后半部分替换为“交流一下项目的最新情况 (catch up on the project)”，用英文把这句完整提议说出来。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e步骤二：自由表达\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\u003cli data-block=\"9\" class=\"speak-block\"\u003e\u003cstrong\u003e场景：\u003c/strong\u003e 你今天打算约一位新加坡的创业者碰面，想向他提议：\u003cstrong\u003e“不如我们下午去乌节路 (\u003cem\u003eOrchard Road，举例\u003c/em\u003e) 喝杯咖啡？我想跟你说个想法让你参谋一下 (run an idea by you)。”\u003c/strong\u003e 请用语音发给我你的完整英文表达。\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e---\u003c/p\u003e\n\u003ch3\u003e5. 记忆回炉 (复习)\u003c/h3\u003e\n\u003cp\u003e\u003cem\u003e(请尝试用之前学过的词块简答，巩固记忆)\u003c/em\u003e\u003c/p\u003e\n\u003col\u003e\u003cli data-block=\"10\" class=\"speak-block\"\u003e\u003cstrong\u003e[第12课回炉]\u003c/strong\u003e 结合您看财报的场景，想表达“利润同比 (\u003cem\u003eyear over year\u003c/em\u003e) 持平 (\u003cem\u003estay flat\u003c/em\u003e)”，这句英文该怎么说？\u003c/li\u003e\u003cli data-block=\"11\" class=\"speak-block\"\u003e\u003cstrong\u003e[第16课回炉]\u003c/strong\u003e 在写英文邮件时，想在开头表达“写这封信是为了确认会议时间”，英文怎么写？ (提示: I'm writing to...)\u003c/li\u003e\u003cli data-block=\"12\" class=\"speak-block\"\u003e\u003cstrong\u003e[第18课回炉]\u003c/strong\u003e 如果你觉得现在的市场情况还不清晰，想跟合伙人说“我们先观望一下 (\u003cem\u003ewait and see\u003c/em\u003e)”，这句英文该怎么表达？\u003c/li\u003e\u003c/ol\u003e","blocks":["Why don't we + ...? …… / …… \"Let's...\"","grab a coffee Why don't we grab a coffee at Marina Bay Sands ( ) this afternoon? ( )","catch up on / ... Let's catch up on the new tech project. ( )","go over the numbers / Why don't we go over the numbers before making a decision? ( )","run an idea by you / I want to run an investment idea by you. ( )","call it a day / It's getting late. Why don't we call it a day? ( )","A: Gang, I want to run a new investment idea by you. (Gang ) B: Sounds good. Why don't we grab a coffee and go over the numbers? ( ) A: Great. Let's meet on Thursday at 3 PM ( ). ( 3 ) B: Perfect. See you then. ( )","Why don't we grab a coffee and go over the numbers?","“ (catch up on the project)”","“ (Orchard Road ) (run an idea by you) ”","[ 12 ] “ (year over year) (stay flat)”","[ 16 ] “ ” ( : I'm writing to...)","[ 18 ] “ (wait and see)”"],"audio":["audio/b7711c269f00.mp3","audio/6b0d14fa5368.mp3","audio/2c3a83ee72fc.mp3","audio/f66bc5c0c215.mp3","audio/69d9ea7c2901.mp3","audio/d4c5b135ad3e.mp3","audio/b92d6017403b.mp3","audio/8d140c3ddabf.mp3","audio/cd8c819ba823.mp3","audio/45d2f7835360.mp3","audio/797478bd74ab.mp3","audio/2110b4ee4d41.mp3","audio/40fd51ad67b0.mp3"]},{"id":"reading-1-4-ipa","kind":"reading","title":"A Day in Singapore｜新加坡商务人士的一天","date":"2026-11-19","sort":1795091718.156195,"html":"\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"0\"\u003eMr. Lim works in investment/ɪnˈvestmənt/ in Singapore. Every morning/ˈmɔːrnɪŋ/, he goes to a small coffee/ˈkɔːfi/ shop near his office. The shop is busy, but the people are friendly/ˈfrɛndli/. Today he is a little late, so he sends a message/ˈmɛsɪdʒ/ to his partner/ˈpɑːrtnər/, Ms. Chen: \"I'm \u003cstrong class=\"reading-emphasis\"\u003eon my way\u003c/strong\u003e.\" She replies/rɪˈplaɪz/, \"\u003cstrong class=\"reading-emphasis\"\u003eNo worries/ˈwɜːriz/\u003c/strong\u003e. See you at eleven/ɪˈlɛvən/.\" At the shop, Mr. Lim smiles/smaɪlz/ at the owner. \"\u003cstrong class=\"reading-emphasis\"\u003eI'd like to\u003c/strong\u003e have a coffee/ˈkɔːfi/, please/pliːz/. \u003cstrong class=\"reading-emphasis\"\u003eCould you\u003c/strong\u003e add a little milk?\" \"Of course/kɔrs/,\" says the owner.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-0\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-0\" hidden\u003e林先生在新加坡从事投资工作。每天早上，他都会去办公室附近的一家小咖啡店。店里很忙，但大家都很友好。今天他有点晚了，所以给合伙人陈女士发了条消息：\"我在路上了。\"她回复：\"没关系，十一点见。\"在咖啡店里，林先生对店主笑了笑：\"我想要一杯咖啡，谢谢。你能加一点牛奶吗？\"\"当然可以，\"店主说。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"1\"\u003eMr. Lim sits down and opens his laptop/ˈlæpˌtɑp/. First, he writes/raɪts/ an email to Mr. Tan, a client/ˈklaɪənt/. \"Dear Mr. Tan, \u003cstrong class=\"reading-emphasis\"\u003eI'm following/ˈfɑːloʊɪŋ/ up on\u003c/strong\u003e our call last week. \u003cstrong class=\"reading-emphasis\"\u003eAs discussed/dɪˈskʌst/\u003c/strong\u003e, \u003cstrong class=\"reading-emphasis\"\u003ecould you\u003c/strong\u003e send the revised/rɪˈvaɪzd/ proposal/prəˈpoʊzl/ \u003cstrong class=\"reading-emphasis\"\u003eat your earliest/ˈɜːrliɪst/ convenience/kənˈviːniəns/\u003c/strong\u003e? I \u003cstrong class=\"reading-emphasis\"\u003elook forward/ˈfɔːrwərd/ to\u003c/strong\u003e your reply. Best regards/rɪˈɡɑːrdz/, Lim.\" He plans to \u003cstrong class=\"reading-emphasis\"\u003efollow/ˈfɑːloʊ/ up on\u003c/strong\u003e it again on Friday/ˈfraɪdeɪ/. If Mr. Tan is busy, they can \u003cstrong class=\"reading-emphasis\"\u003ecircle/ˈsɜːrkl/ back\u003c/strong\u003e next week.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-1\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-1\" hidden\u003e林先生坐下来，打开笔记本电脑。首先，他给客户谭先生写了一封邮件。\"亲爱的谭先生：我想跟进一下我们上周的通话。如之前所谈，您方便时能尽快把修改后的方案发给我吗？期待您的回复。此致，林。\"他打算周五再跟进一次。如果谭先生很忙，他们可以下周再谈。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"2\"\u003eAfter coffee/ˈkɔːfi/, Mr. Lim goes to his office and reads a short market/ˈmɑːrkɪt/ report/rɪˈpɔːrt/. The report/rɪˈpɔːrt/ is made up for this story, so the numbers/ˈnʌmbərz/ are not real. He underlines/ˌʌndərˈlaɪnz/ the key words with a pen. \u003cstrong class=\"reading-emphasis\"\u003eAccording/əˈkɔːrdɪŋ/ to the report/rɪˈpɔːrt/\u003c/strong\u003e, there is \u003cstrong class=\"reading-emphasis\"\u003estrong/strɔːŋ/ demand/dɪˈmænd/ for\u003c/strong\u003e office space in Singapore. The bank may \u003cstrong class=\"reading-emphasis\"\u003eraise interest/ˈɪntrəst/ rates\u003c/strong\u003e next year. Many companies/ˈkʌmpəniz/ want to \u003cstrong class=\"reading-emphasis\"\u003ecut costs\u003c/strong\u003e. \u003cstrong class=\"reading-emphasis\"\u003eThe main point is that\u003c/strong\u003e the market/ˈmɑːrkɪt/ is changing/ˈtʃeɪndʒɪŋ/. Mr. Lim thinks/θɪŋks/, \"Investors/ɪnˈvestərz/ should \u003cstrong class=\"reading-emphasis\"\u003ewatch the market/ˈmɑːrkɪt/ closely/ˈkloʊsli/\u003c/strong\u003e.\"\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-2\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-2\" hidden\u003e喝完咖啡，林先生去办公室，读一份简短的市场报告。这份报告是为这个故事虚构的，所以数字都不是真实的。他用笔把关键词划出来。根据报告，新加坡对办公空间的需求强劲。银行明年可能会加息。很多公司想削减成本。主要意思是：市场正在变化。林先生心想：\"投资者应该密切关注市场。\"\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"3\"\u003eBefore the meeting/ˈmiːtɪŋ/, Mr. Lim makes a short list. \"\u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003echeck the figures/ˈfɪɡjərz/\u003c/strong\u003e in the investment/ɪnˈvestmənt/ report/rɪˈpɔːrt/. Then \u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003eassess/əˈses/ the risks\u003c/strong\u003e.\" He opens the report/rɪˈpɔːrt/ again and reads every number/ˈnʌmbər/ slowly/ˈsloʊli/. The numbers/ˈnʌmbərz/ look fine, but one risk is clear: costs may go up. Mr. Lim writes/raɪts/ a note beside/bɪˈsaɪd/ it and feels ready.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-3\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-3\" hidden\u003e开会前，林先生列了一份简短的清单。\"我需要核对投资报告里的数据。然后我需要评估风险。\"他再次打开报告，慢慢读每一个数字。数字看起来没问题，但有一个风险很明显：成本可能会上升。林先生在旁边写了一条备注，觉得准备好了。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"4\"\u003eAt eleven/ɪˈlɛvən/, Ms. Chen arrives/əˈraɪvz/. They \u003cstrong class=\"reading-emphasis\"\u003ediscuss/dɪˈskʌs/ the terms\u003c/strong\u003e of a small project/ˈprɑːdʒekt/. Then they \u003cstrong class=\"reading-emphasis\"\u003ereview/rɪˈvjuː/ progress/ˈprɑːɡres/\u003c/strong\u003e on the work so far. Ms. Chen asks, \"\u003cstrong class=\"reading-emphasis\"\u003eCould you\u003c/strong\u003e help \u003cstrong class=\"reading-emphasis\"\u003esort out\u003c/strong\u003e the payment/ˈpeɪmənt/ schedule/ˈskedʒuːl/ for next week?\" \"Sure,\" says Mr. Lim. \"\u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003econfirm/kənˈfɜːrm/ the time\u003c/strong\u003e of our next meeting/ˈmiːtɪŋ/, too. Is Tuesday/ˈtuzdeɪ/ good?\" \"Tuesday/ˈtuzdeɪ/ is fine,\" she says. Everyone/ˈɛvriˌwʌn/ agrees/əˈɡriz/. The meeting/ˈmiːtɪŋ/ ends at noon.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-4\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-4\" hidden\u003e十一点，陈女士到了。他们商讨一个小项目的条款，然后查看到目前为止的工作进展。陈女士问：\"你能帮忙理清下周的付款安排吗？\"\"没问题，\"林先生说，\"我也需要确认下次会议的时间。周二可以吗？\"\"周二可以，\"她说。大家都同意了。会议在中午结束。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"5\"\u003eOn the way home, Mr. Lim thinks/θɪŋks/ about his day. It was busy, but he feels calm and happy. He asked for help, wrote a clear email, read a report/rɪˈpɔːrt/, and planned/plænd/ his next steps. \"\u003cstrong class=\"reading-emphasis\"\u003eI'd like to\u003c/strong\u003e do this every day,\" he thinks/θɪŋks/. \"Small steps make a big difference/ˈdɪfərəns/.\"\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-5\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-5\" hidden\u003e回家的路上，林先生回想这一天。这一天很忙，但他觉得平静又开心。他请别人帮忙，写了一封清楚的邮件，读了一份报告，还安排好了下一步。\"我想每天都这样做，\"他想，\"小步骤能带来大不同。\"\u003c/div\u003e\n\u003c/section\u003e","blocks":["Mr. Lim works in investment/ɪnˈvestmənt/ in Singapore. Every morning/ˈmɔːrnɪŋ/, he goes to a small coffee/ˈkɔːfi/ shop near his office. The shop is busy, but the people are friendly/ˈfrɛndli/. Today he is a little late, so he sends a message/ˈmɛsɪdʒ/ to his partner/ˈpɑːrtnər/, Ms. Chen: \"I'm on my way.\" She replies/rɪˈplaɪz/, \"No worries/ˈwɜːriz/. See you at eleven/ɪˈlɛvən/.\" At the shop, Mr. Lim smiles/smaɪlz/ at the owner. \"I'd like to have a coffee/ˈkɔːfi/, please/pliːz/. Could you add a little milk?\" \"Of course/kɔrs/,\" says the owner.","Mr. Lim sits down and opens his laptop/ˈlæpˌtɑp/. First, he writes/raɪts/ an email to Mr. Tan, a client/ˈklaɪənt/. \"Dear Mr. Tan, I'm following/ˈfɑːloʊɪŋ/ up on our call last week. As discussed/dɪˈskʌst/, could you send the revised/rɪˈvaɪzd/ proposal/prəˈpoʊzl/ at your earliest/ˈɜːrliɪst/ convenience/kənˈviːniəns/? I look forward/ˈfɔːrwərd/ to your reply. Best regards/rɪˈɡɑːrdz/, Lim.\" He plans to follow/ˈfɑːloʊ/ up on it again on Friday/ˈfraɪdeɪ/. If Mr. Tan is busy, they can circle/ˈsɜːrkl/ back next week.","After coffee/ˈkɔːfi/, Mr. Lim goes to his office and reads a short market/ˈmɑːrkɪt/ report/rɪˈpɔːrt/. The report/rɪˈpɔːrt/ is made up for this story, so the numbers/ˈnʌmbərz/ are not real. He underlines/ˌʌndərˈlaɪnz/ the key words with a pen. According/əˈkɔːrdɪŋ/ to the report/rɪˈpɔːrt/, there is strong/strɔːŋ/ demand/dɪˈmænd/ for office space in Singapore. The bank may raise interest/ˈɪntrəst/ rates next year. Many companies/ˈkʌmpəniz/ want to cut costs. The main point is that the market/ˈmɑːrkɪt/ is changing/ˈtʃeɪndʒɪŋ/. Mr. Lim thinks/θɪŋks/, \"Investors/ɪnˈvestərz/ should watch the market/ˈmɑːrkɪt/ closely/ˈkloʊsli/.\"","Before the meeting/ˈmiːtɪŋ/, Mr. Lim makes a short list. \"I need to check the figures/ˈfɪɡjərz/ in the investment/ɪnˈvestmənt/ report/rɪˈpɔːrt/. Then I need to assess/əˈses/ the risks.\" He opens the report/rɪˈpɔːrt/ again and reads every number/ˈnʌmbər/ slowly/ˈsloʊli/. The numbers/ˈnʌmbərz/ look fine, but one risk is clear: costs may go up. Mr. Lim writes/raɪts/ a note beside/bɪˈsaɪd/ it and feels ready.","At eleven/ɪˈlɛvən/, Ms. Chen arrives/əˈraɪvz/. They discuss/dɪˈskʌs/ the terms of a small project/ˈprɑːdʒekt/. Then they review/rɪˈvjuː/ progress/ˈprɑːɡres/ on the work so far. Ms. Chen asks, \"Could you help sort out the payment/ˈpeɪmənt/ schedule/ˈskedʒuːl/ for next week?\" \"Sure,\" says Mr. Lim. \"I need to confirm/kənˈfɜːrm/ the time of our next meeting/ˈmiːtɪŋ/, too. Is Tuesday/ˈtuzdeɪ/ good?\" \"Tuesday/ˈtuzdeɪ/ is fine,\" she says. Everyone/ˈɛvriˌwʌn/ agrees/əˈɡriz/. The meeting/ˈmiːtɪŋ/ ends at noon.","On the way home, Mr. Lim thinks/θɪŋks/ about his day. It was busy, but he feels calm and happy. He asked for help, wrote a clear email, read a report/rɪˈpɔːrt/, and planned/plænd/ his next steps. \"I'd like to do this every day,\" he thinks/θɪŋks/. \"Small steps make a big difference/ˈdɪfərəns/.\""],"audio":["audio/2d99828adc6f.mp3","audio/499f924d466d.mp3","audio/d8954647c5d3.mp3","audio/b787250c78ed.mp3","audio/936ec24173f1.mp3","audio/f066099da27e.mp3"]},{"id":"reading-1-4","kind":"reading","title":"A Day in Singapore｜新加坡商务人士的一天","date":"2026-11-16","sort":1794836107.301544,"html":"\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"0\"\u003eMr. Lim works in investment in Singapore. Every morning, he goes to a small coffee shop near his office. The shop is busy, but the people are friendly. Today he is a little late, so he sends a message to his partner, Ms. Chen: \"I'm \u003cstrong class=\"reading-emphasis\"\u003eon my way\u003c/strong\u003e.\" She replies, \"\u003cstrong class=\"reading-emphasis\"\u003eNo worries\u003c/strong\u003e. See you at eleven.\" At the shop, Mr. Lim smiles at the owner. \"\u003cstrong class=\"reading-emphasis\"\u003eI'd like to\u003c/strong\u003e have a coffee, please. \u003cstrong class=\"reading-emphasis\"\u003eCould you\u003c/strong\u003e add a little milk?\" \"Of course,\" says the owner.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-0\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-0\" hidden\u003e林先生在新加坡从事投资工作。每天早上，他都会去办公室附近的一家小咖啡店。店里很忙，但大家都很友好。今天他有点晚了，所以给合伙人陈女士发了条消息：\"我在路上了。\"她回复：\"没关系，十一点见。\"在咖啡店里，林先生对店主笑了笑：\"我想要一杯咖啡，谢谢。你能加一点牛奶吗？\"\"当然可以，\"店主说。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"1\"\u003eMr. Lim sits down and opens his laptop. First, he writes an email to Mr. Tan, a client. \"Dear Mr. Tan, \u003cstrong class=\"reading-emphasis\"\u003eI'm following up on\u003c/strong\u003e our call last week. \u003cstrong class=\"reading-emphasis\"\u003eAs discussed\u003c/strong\u003e, \u003cstrong class=\"reading-emphasis\"\u003ecould you\u003c/strong\u003e send the revised proposal \u003cstrong class=\"reading-emphasis\"\u003eat your earliest convenience\u003c/strong\u003e? I \u003cstrong class=\"reading-emphasis\"\u003elook forward to\u003c/strong\u003e your reply. Best regards, Lim.\" He plans to \u003cstrong class=\"reading-emphasis\"\u003efollow up on\u003c/strong\u003e it again on Friday. If Mr. Tan is busy, they can \u003cstrong class=\"reading-emphasis\"\u003ecircle back\u003c/strong\u003e next week.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-1\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-1\" hidden\u003e林先生坐下来，打开笔记本电脑。首先，他给客户谭先生写了一封邮件。\"亲爱的谭先生：我想跟进一下我们上周的通话。如之前所谈，您方便时能尽快把修改后的方案发给我吗？期待您的回复。此致，林。\"他打算周五再跟进一次。如果谭先生很忙，他们可以下周再谈。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"2\"\u003eAfter coffee, Mr. Lim goes to his office and reads a short market report. The report is made up for this story, so the numbers are not real. He underlines the key words with a pen. \u003cstrong class=\"reading-emphasis\"\u003eAccording to the report\u003c/strong\u003e, there is \u003cstrong class=\"reading-emphasis\"\u003estrong demand for\u003c/strong\u003e office space in Singapore. The bank may \u003cstrong class=\"reading-emphasis\"\u003eraise interest rates\u003c/strong\u003e next year. Many companies want to \u003cstrong class=\"reading-emphasis\"\u003ecut costs\u003c/strong\u003e. \u003cstrong class=\"reading-emphasis\"\u003eThe main point is that\u003c/strong\u003e the market is changing. Mr. Lim thinks, \"Investors should \u003cstrong class=\"reading-emphasis\"\u003ewatch the market closely\u003c/strong\u003e.\"\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-2\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-2\" hidden\u003e喝完咖啡，林先生去办公室，读一份简短的市场报告。这份报告是为这个故事虚构的，所以数字都不是真实的。他用笔把关键词划出来。根据报告，新加坡对办公空间的需求强劲。银行明年可能会加息。很多公司想削减成本。主要意思是：市场正在变化。林先生心想：\"投资者应该密切关注市场。\"\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"3\"\u003eBefore the meeting, Mr. Lim makes a short list. \"\u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003echeck the figures\u003c/strong\u003e in the investment report. Then \u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003eassess the risks\u003c/strong\u003e.\" He opens the report again and reads every number slowly. The numbers look fine, but one risk is clear: costs may go up. Mr. Lim writes a note beside it and feels ready.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-3\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-3\" hidden\u003e开会前，林先生列了一份简短的清单。\"我需要核对投资报告里的数据。然后我需要评估风险。\"他再次打开报告，慢慢读每一个数字。数字看起来没问题，但有一个风险很明显：成本可能会上升。林先生在旁边写了一条备注，觉得准备好了。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"4\"\u003eAt eleven, Ms. Chen arrives. They \u003cstrong class=\"reading-emphasis\"\u003ediscuss the terms\u003c/strong\u003e of a small project. Then they \u003cstrong class=\"reading-emphasis\"\u003ereview progress\u003c/strong\u003e on the work so far. Ms. Chen asks, \"\u003cstrong class=\"reading-emphasis\"\u003eCould you\u003c/strong\u003e help \u003cstrong class=\"reading-emphasis\"\u003esort out\u003c/strong\u003e the payment schedule for next week?\" \"Sure,\" says Mr. Lim. \"\u003cstrong class=\"reading-emphasis\"\u003eI need to\u003c/strong\u003e \u003cstrong class=\"reading-emphasis\"\u003econfirm the time\u003c/strong\u003e of our next meeting, too. Is Tuesday good?\" \"Tuesday is fine,\" she says. Everyone agrees. The meeting ends at noon.\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-4\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-4\" hidden\u003e十一点，陈女士到了。他们商讨一个小项目的条款，然后查看到目前为止的工作进展。陈女士问：\"你能帮忙理清下周的付款安排吗？\"\"没问题，\"林先生说，\"我也需要确认下次会议的时间。周二可以吗？\"\"周二可以，\"她说。大家都同意了。会议在中午结束。\u003c/div\u003e\n\u003c/section\u003e\n\u003csection class=\"reading-pair\"\u003e\u003cp class=\"en speak-block\" data-block=\"5\"\u003eOn the way home, Mr. Lim thinks about his day. It was busy, but he feels calm and happy. He asked for help, wrote a clear email, read a report, and planned his next steps. \"\u003cstrong class=\"reading-emphasis\"\u003eI'd like to\u003c/strong\u003e do this every day,\" he thinks. \"Small steps make a big difference.\"\u003c/p\u003e\n\u003cbutton type=\"button\" class=\"translation-toggle\" aria-expanded=\"false\" aria-controls=\"translation-5\"\u003e中文\u003c/button\u003e\u003cdiv class=\"translation\" id=\"translation-5\" hidden\u003e回家的路上，林先生回想这一天。这一天很忙，但他觉得平静又开心。他请别人帮忙，写了一封清楚的邮件，读了一份报告，还安排好了下一步。\"我想每天都这样做，\"他想，\"小步骤能带来大不同。\"\u003c/div\u003e\n\u003c/section\u003e","blocks":["Mr. Lim works in investment in Singapore. Every morning, he goes to a small coffee shop near his office. The shop is busy, but the people are friendly. Today he is a little late, so he sends a message to his partner, Ms. Chen: \"I'm on my way.\" She replies, \"No worries. See you at eleven.\" At the shop, Mr. Lim smiles at the owner. \"I'd like to have a coffee, please. Could you add a little milk?\" \"Of course,\" says the owner.","Mr. Lim sits down and opens his laptop. First, he writes an email to Mr. Tan, a client. \"Dear Mr. Tan, I'm following up on our call last week. As discussed, could you send the revised proposal at your earliest convenience? I look forward to your reply. Best regards, Lim.\" He plans to follow up on it again on Friday. If Mr. Tan is busy, they can circle back next week.","After coffee, Mr. Lim goes to his office and reads a short market report. The report is made up for this story, so the numbers are not real. He underlines the key words with a pen. According to the report, there is strong demand for office space in Singapore. The bank may raise interest rates next year. Many companies want to cut costs. The main point is that the market is changing. Mr. Lim thinks, \"Investors should watch the market closely.\"","Before the meeting, Mr. Lim makes a short list. \"I need to check the figures in the investment report. Then I need to assess the risks.\" He opens the report again and reads every number slowly. The numbers look fine, but one risk is clear: costs may go up. Mr. Lim writes a note beside it and feels ready.","At eleven, Ms. Chen arrives. They discuss the terms of a small project. Then they review progress on the work so far. Ms. Chen asks, \"Could you help sort out the payment schedule for next week?\" \"Sure,\" says Mr. Lim. \"I need to confirm the time of our next meeting, too. Is Tuesday good?\" \"Tuesday is fine,\" she says. Everyone agrees. The meeting ends at noon.","On the way home, Mr. let player = null;
let utteranceReference = null;
let markedBlock = null;

try {
  const value = localStorage.getItem("english-reading-speed");
  if (value === "0.7" || value === "0.9") savedSpeed = value;
} catch (_) {}
speedControl.value = savedSpeed;

function notify(message) {
  const element = document.getElementById("toast");
  clearTimeout(toastTimer);
  element.textContent = message;
  element.hidden = false;
  toastTimer = setTimeout(() => { element.hidden = true; }, 2600);
}

function refreshVoices() {
  if (!synth) return;
  try { voices = synth.getVoices() || []; } catch (_) { voices = []; }
}

function initVoices() {
  // 必须由首次真实点击同步调用，不能等待 Promise 或 voiceschanged。
  if (!voicesInitialized) {
    voicesInitialized = true;
    refreshVoices();
  }
}

if (synth) {
  if (typeof synth.addEventListener === "function") {
    synth.addEventListener("voiceschanged", refreshVoices);
  } else {
    synth.onvoiceschanged = refreshVoices;
  }
}
document.addEventListener("click", initVoices, true);

function preferredVoice() {
  refreshVoices();
  const us = voices.filter(voice => voice.lang === "en-US");
  return us.find(voice => /Samantha|Alex|Google US English|Aaron|Nicky/i.test(voice.name))
    || us[0] || null;
}

function speechRate(base) {
  return savedSpeed ? Number(savedSpeed) : base;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function closeCard() {
  card.hidden = true;
  document.body.classList.remove("card-open");
}

function normalizeKey(value) {
  return value.toLowerCase().trim().replace(/\s+/g, " ");
}

function findDefinition(value) {
  const key = normalizeKey(value);
  const candidates = [];
  function add(word) {
    if (word && !candidates.includes(word)) candidates.push(word);
  }
  add(key);
  add(key.replace(/’/g, "'"));
  const seeds = candidates.slice();
  for (const seed of seeds) {
    if (/['’]s$/.test(seed)) add(seed.slice(0, -2));
    for (const suffix of ["s", "es", "ed", "ing", "ly"]) {
      if (seed.endsWith(suffix) && seed.length > suffix.length + 1) {
        const stem = seed.slice(0, -suffix.length);
        add(stem);
        if (suffix === "ed" || suffix === "ing") {
          add(stem + "e");
          if (/([a-z])\1$/.test(stem)) add(stem.slice(0, -1));
        }
        if ((suffix === "es" || suffix === "ed" || suffix === "ly") && stem.endsWith("i")) {
          add(stem.slice(0, -1) + "y");
        }
      }
    }
  }
  for (const candidate of candidates) {
    if (Object.prototype.hasOwnProperty.call(glossary, candidate)) return glossary[candidate];
  }
  return null;
}

function showCard(value) {
  currentWord = value;
  const definition = findDefinition(value);
  document.getElementById("card-word").textContent = value;
  for (const [id, field] of [["card-ipa","ipa"],["card-pos","pos"],["card-zh","zh"]]) {
    const element = document.getElementById(id);
    const text = definition ? definition[field] || "" : "";
    element.textContent = text;
    element.hidden = !text;
  }
  card.hidden = false;
  document.body.classList.add("card-open");
}

function clearBlockMark() {
  if (markedBlock) {
    markedBlock.classList.remove("playing");
    const button = markedBlock.querySelector(".play-block");
    if (button) {
      button.textContent = "▶";
      button.setAttribute("aria-label", "朗读本段");
    }
  }
  markedBlock = null;
}

function syncFullButton() {
  const button = document.getElementById("read-all");
  if (!button) return;
  if (player && player.mode === "full") {
    button.textContent = player.paused ? "▶ 继续全文朗读" : "Ⅱ 暂停全文朗读";
    button.setAttribute("aria-pressed", player.paused ? "false" : "true");
  } else {
    button.textContent = "▶ 全文朗读";
    button.setAttribute("aria-pressed", "false");
  }
}

function stopPlayback() {
  playerToken++;
  const previous = player;
  player = null;
  if (previous && previous.audio) {
    previous.audio.onended = null;
    previous.audio.onerror = null;
    previous.audio.pause();
    try { previous.audio.currentTime = 0; } catch (_) {}
    previous.audio.removeAttribute("src");
    try { previous.audio.load(); } catch (_) {}
  }
  if (synth) {
    try { synth.cancel(); } catch (_) {}
  }
  utteranceReference = null;
  clearBlockMark();
  syncFullButton();
}

function say(text, baseRate, token, onend) {
  if (!synth || typeof window.SpeechSynthesisUtterance === "undefined") {
    notify("此浏览器暂不支持系统朗读");
    if (onend) setTimeout(onend, 0);
    return;
  }
  initVoices();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = speechRate(baseRate);
  utterance.pitch = 1;
  const voice = preferredVoice();
  if (voice) utterance.voice = voice;
  utteranceReference = utterance;
  utterance.onend = () => {
    if (token !== playerToken) return;
    utteranceReference = null;
    if (onend) onend();
  };
  utterance.onerror = event => {
    if (token !== playerToken) return;
    if (event.error !== "canceled" && event.error !== "interrupted") {
      notify("系统朗读不可用，请检查设备英语语音");
    }
    if (onend) onend();
  };
  try {
    // 同步执行，保证 iPhone Safari 的第一次 speak 位于用户点击事件中。
    synth.speak(utterance);
  } catch (_) {
    notify("无法启动系统朗读");
    if (onend) onend();
  }
}

function readWord(text) {
  stopPlayback();
  say(text, 0.8, playerToken, null);
}

function markBlock(index, scroll) {
  clearBlockMark();
  const block = main.querySelector('[data-block="' + index + '"]');
  if (!block) return;
  markedBlock = block;
  block.classList.add("playing");
  const button = block.querySelector(".play-block");
  if (button) {
    button.textContent = "■";
    button.setAttribute("aria-label", "停止本段朗读");
  }
  if (scroll) {
    const rect = block.getBoundingClientRect();
    const bottomSpace = card.hidden ? 30 : card.getBoundingClientRect().height + 28;
    if (rect.top < 20 || rect.bottom > window.innerHeight - bottomSpace) {
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try {
        block.scrollIntoView({behavior:reduced ? "auto" : "smooth", block:"center"});
      } catch (_) {
        block.scrollIntoView();
      }
    }
  }
}

function finishCurrentBlock(state, token) {
  if (player !== state || token !== playerToken) return;
  state.audio = null;
  state.completed = true;
  if (state.paused) return;
  if (state.mode === "full" && state.index + 1 < currentEntry.blocks.length) {
    state.index++;
    playCurrentBlock(state, token);
  } else {
    stopPlayback();
  }
}

function playCurrentBlock(state, token) {
  if (player !== state || token !== playerToken || !currentEntry) return;
  state.completed = false;
  markBlock(state.index, state.mode === "full");
  syncFullButton();
  const text = currentEntry.blocks[state.index] || "";
  const uri = currentEntry.audio && currentEntry.audio[state.index];
  let fallbackStarted = false;

  function fallback() {
    if (player !== state || token !== playerToken || fallbackStarted) return;
    fallbackStarted = true;
    if (state.audio) {
      state.audio.onended = null;
      state.audio.onerror = null;
      state.audio.pause();
      state.audio = null;
    }
    if (!text || !/[A-Za-z]/.test(text)) {
      setTimeout(() => finishCurrentBlock(state, token), 0);
      return;
    }
    say(text, 0.85, token, () => finishCurrentBlock(state, token));
  }

  if (uri) {
    const audio = new Audio(uri);
    state.audio = audio;
    audio.preload = "auto";
    audio.playbackRate = savedSpeed ? Number(savedSpeed) : 1;
    audio.onended = () => finishCurrentBlock(state, token);
    audio.onerror = fallback;
    try {
      const result = audio.play();
      if (result && typeof result.catch === "function") result.catch(fallback);
    } catch (_) {
      fallback();
    }
  } else {
    fallback();
  }
}

function playBlock(index) {
  if (player && player.index === index && !player.paused) {
    stopPlayback();
    return;
  }
  stopPlayback();
  const state = {mode:"block", index:index, paused:false, audio:null, completed:false};
  player = state;
  playCurrentBlock(state, playerToken);
}

function toggleFullReading() {
  if (!currentEntry || !currentEntry.blocks.length) {
    notify("没有可朗读的段落");
    return;
  }
  if (player && player.mode === "full") {
    const state = player;
    if (!state.paused) {
      state.paused = true;
      if (state.audio) state.audio.pause();
      else if (synth) synth.pause();
      syncFullButton();
      return;
    }
    state.paused = false;
    if (state.completed) {
      finishCurrentBlock(state, playerToken);
    } else if (state.audio) {
      const token = playerToken;
      try {
        const result = state.audio.play();
        if (result && typeof result.catch === "function") {
          result.catch(() => {
            if (player === state && token === playerToken) {
              notify("请再点一次段落播放按钮");
              stopPlayback();
            }
          });
        }
      } catch (_) { stopPlayback(); }
    } else if (synth) {
      synth.resume();
    }
    syncFullButton();
    return;
  }
  stopPlayback();
  const state = {mode:"full", index:0, paused:false, audio:null, completed:false};
  player = state;
  playCurrentBlock(state, playerToken);
}

speedControl.addEventListener("change", () => {
  savedSpeed = speedControl.value;
  try { localStorage.setItem("english-reading-speed", savedSpeed); } catch (_) {}
  if (player && player.audio) {
    player.audio.playbackRate = savedSpeed ? Number(savedSpeed) : 1;
  } else if (player && !player.paused) {
    const mode = player.mode;
    const index = player.index;
    stopPlayback();
    const state = {mode:mode, index:index, paused:false, audio:null, completed:false};
    player = state;
    playCurrentBlock(state, playerToken);
  }
});

const englishPattern = /[A-Za-z]+(?:['’\-][A-Za-z]+)*/g;
const phraseBuckets = new Map();
for (const key of Object.keys(glossary)) {
  const words = key.match(/[A-Za-z]+(?:['’\-][A-Za-z]+)*/g);
  if (!words || words.length < 2) continue;
  // 多词短语只接受英文单词和空格，避免误匹配中文或任意正则。
  const normalized = normalizeKey(key).replace(/’/g, "'");
  if (!/^[a-z]+(?:['\-][a-z]+)*(?:\s+[a-z]+(?:['\-][a-z]+)*)+$/.test(normalized)) continue;
  const tokens = normalized.split(/\s+/);
  const bucket = phraseBuckets.get(tokens[0]) || [];
  bucket.push({tokens:tokens, key:key});
  phraseBuckets.set(tokens[0], bucket);
}
for (const bucket of phraseBuckets.values()) {
  bucket.sort((a,b) => b.tokens.length - a.tokens.length || b.key.length - a.key.length);
}

function wrappingGroups(root) {
  // 内联标签不截断分组，因此 follow <b>up</b> on 仍可整体匹配。
  // 段落/单元格/换行截断分组，短语不会跨到下一段。
  const blockTags = new Set([
    "P","DIV","SECTION","ARTICLE","BLOCKQUOTE","LI","UL","OL","TABLE",
    "THEAD","TBODY","TFOOT","TR","TD","TH","H1","H2","H3","H4","H5","H6"
  ]);
  const groups = [];
  let group = [];
  function flush() {
    if (group.length) groups.push(group);
    group = [];
  }
  function visit(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (node.nodeValue) group.push(node);
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (node.matches("button,script,style,.translation,.w,[hidden]")) {
      flush();
      return;
    }
    if (node.tagName === "BR") {
      flush();
      return;
    }
    const boundary = blockTags.has(node.tagName);
    if (boundary) flush();
    for (const child of Array.from(node.childNodes)) visit(child);
    if (boundary) flush();
  }
  visit(root);
  flush();
  return groups;
}

function wrapGroup(nodes) {
  const records = [];
  let text = "";
  for (const node of nodes) {
    records.push({node:node, start:text.length, end:text.length + node.nodeValue.length});
    text += node.nodeValue;
  }
  const words = [];
  englishPattern.lastIndex = 0;
  let match;
  while ((match = englishPattern.exec(text)) !== null) {
    words.push({
      start:match.index, end:match.index + match[0].length,
      normalized:match[0].toLowerCase().replace(/’/g, "'")
    });
  }
  const spans = [];
  let i = 0;
  while (i < words.length) {
    let found = null;
    const candidates = phraseBuckets.get(words[i].normalized) || [];
    for (const candidate of candidates) {
      if (i + candidate.tokens.length > words.length) continue;
      let matches = true;
      for (let j = 0; j < candidate.tokens.length; j++) {
        if (words[i+j].normalized !== candidate.tokens[j]) {
          matches = false;
          break;
        }
        if (j > 0 && !/^\s+$/.test(text.slice(words[i+j-1].end, words[i+j].start))) {
          matches = false;
          break;
        }
      }
      if (matches) { found = candidate; break; }
    }
    const count = found ? found.tokens.length : 1;
    const start = words[i].start;
    const end = words[i + count - 1].end;
    spans.push({start:start, end:end, phrase:!!found, value:text.slice(start,end)});
    i += count;
  }

  // 从后往前使用 Range，保持尚未处理的文本节点偏移不变。
  for (let n = spans.length - 1; n >= 0; n--) {
    const item = spans[n];
    const first = records.find(record => item.start >= record.start && item.start < record.end);
    const last = records.find(record => item.end > record.start && item.end <= record.end);
    if (!first || !last) continue;
    const range = document.createRange();
    try {
      range.setStart(first.node, item.start - first.start);
      range.setEnd(last.node, item.end - last.start);
      const span = document.createElement("span");
      span.className = item.phrase ? "w phrase" : "w";
      span.setAttribute("role", "button");
      span.setAttribute("tabindex", "0");
      span.setAttribute("aria-label", "朗读并查看释义：" + item.value);
      span.dataset.word = item.value;
      span.appendChild(range.extractContents());
      range.insertNode(span);
    } finally {
      range.detach();
    }
  }
}

function decorateBody(body) {
  for (const group of wrappingGroups(body)) wrapGroup(group);
  for (const block of body.querySelectorAll("[data-block]")) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "play-block";
    button.textContent = "▶";
    button.setAttribute("aria-label", "朗读本段");
    if (block.tagName === "TR") {
      const cell = block.querySelector("th,td");
      if (cell) cell.insertBefore(button, cell.firstChild);
    } else {
      block.insertBefore(button, block.firstChild);
    }
  }
}

function homeSection(kind, title) {
  const list = entries.filter(entry => entry.kind === kind).slice();
  list.sort((a,b) => {
    if (a.sort < b.sort) return 1;
    if (a.sort > b.sort) return -1;
    return b.id.localeCompare(a.id, undefined, {numeric:true});
  });
  let contents = '<section><h2 class="home-heading">' + title + " · " + list.length + "</h2>";
  if (!list.length) return contents + '<p class="empty">暂无' + title + "内容。</p></section>";
  contents += '<ul class="entry-list">';
  for (const entry of list) {
    const route = "#/" + kind + "/" + encodeURIComponent(entry.id);
    contents += '<li><a class="entry-link" href="' + route + '"><strong>'
      + escapeHTML(entry.title) + '</strong><span class="entry-meta">'
      + escapeHTML(entry.date) + " · " + entry.blocks.length
      + " 个朗读块</span></a></li>";
  }
  return contents + "</ul></section>";
}

function showHome() {
  currentEntry = null;
  backButton.hidden = true;
  document.title = "王总英语点读";
  main.innerHTML =
    '<p class="home-intro">点英文单词或下划线词块，立即听发音、看释义。段落左侧 ▶ 可朗读整段；阅读中的中文翻译默认收起。首次使用系统朗读时，设备需已安装英语语音。</p>'
    + homeSection("reading", "阅读")
    + homeSection("lesson", "课程");
}

function route() {
  stopPlayback();
  closeCard();
  let path;
  try { path = decodeURIComponent(location.hash.replace(/^#\/?/, "")); }
  catch (_) { path = ""; }
  const entry = entryMap.get(path);
  if (!entry) {
    showHome();
    if (path) notify("没有找到这个条目");
  } else {
    currentEntry = entry;
    backButton.hidden = false;
    document.title = entry.title + " · 王总英语点读";
    main.innerHTML = '<article><h1 class="article-title">' + escapeHTML(entry.title)
      + '</h1><div class="article-meta">' + (entry.kind === "reading" ? "阅读" : "课程")
      + " · " + escapeHTML(entry.date) + "</div>"
      + (entry.kind === "reading" ? '<div class="article-actions"><button type="button" class="action" id="read-all" aria-pressed="false">▶ 全文朗读</button></div>' : "")
      + '<div class="body" id="article-body">' + entry.html + "</div></article>";
    decorateBody(document.getElementById("article-body"));
  }
  window.scrollTo(0,0);
}

backButton.addEventListener("click", () => {
  // 首页与正文都是 hash 历史项；正文按钮始终回首页，浏览器返回仍正常工作。
  location.hash = "#/";
});
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", stopPlayback);

document.addEventListener("click", event => {
  const target = event.target instanceof Element ? event.target : event.target.parentElement;
  if (!target) return;

  const word = target.closest(".w");
  if (word && main.contains(word)) {
    event.preventDefault();
    const value = word.dataset.word || word.textContent;
    showCard(value);
    word.classList.add("word-active");
    setTimeout(() => word.classList.remove("word-active"), 1000);
    readWord(value);
    return;
  }

  if (target.closest("#card-speak")) {
    readWord(currentWord);
    return;
  }
  if (target.closest("#card-close")) {
    closeCard();
    return;
  }
  if (card.contains(target)) return;
  closeCard();

  const play = target.closest(".play-block");
  if (play) {
    event.preventDefault();
    const block = play.closest("[data-block]");
    if (block) playBlock(Number(block.dataset.block));
    return;
  }

  if (target.closest("#read-all")) {
    toggleFullReading();
    return;
  }

  const translation = target.closest(".translation-toggle");
  if (translation) {
    const panel = document.getElementById(translation.getAttribute("aria-controls"));
    if (panel) {
      panel.hidden = !panel.hidden;
      translation.setAttribute("aria-expanded", String(!panel.hidden));
      translation.textContent = panel.hidden ? "中文" : "收起中文";
    }
    return;
  }

  const reference = target.closest(".reference-link");
  if (reference) {
    event.preventDefault();
    const url = reference.dataset.url;
    notify(url ? "离线链接：" + url : "离线模式下不打开外部链接");
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeCard();
    return;
  }
  const target = event.target;
  if ((event.key === "Enter" || event.key === " ") && target instanceof Element && target.matches(".w")) {
    event.preventDefault();
    target.click();
  }
});

route();
</script>
</body>
